<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>R.I.V.E. — Registry of Internal Volatile Entities</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: 'Courier New', monospace; min-height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; display: flex; justify-content: center; align-items: center; }
    .game-wrap { max-width: 620px; width: 100%; margin: 0 auto; background: #0a0a10; border: 3px solid #00d4ff; border-radius: 16px; padding: 8px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); }
    #gameCanvas { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<div class="game-wrap"><canvas id="gameCanvas" width="600" height="820"></canvas></div>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
    let controlMode = isMobile ? 'mobile' : 'pc';

    // ═══════════════════════════════════════════════════════════
    //  ЛОГО
    // ═══════════════════════════════════════════════════════════
    const LOGO_URL = 'https://i.postimg.cc/c1Y3cBBZ/c551115c27311f185771ae74967528c-1.jpg';
    let logoImg = new Image(), logoReady = false;
    logoImg.crossOrigin = 'anonymous';
    logoImg.onload = () => { logoReady = true; };
    logoImg.src = LOGO_URL;

    // ═══════════════════════════════════════════════════════════
    //  НАСТРОЙКИ
    // ═══════════════════════════════════════════════════════════
    let settings = {
        masterVolume: 70, musicVolume: 50, soundVolume: 80,
        scares: true, scareVolume: 100, npcDialogs: true, tts: true,
        language: 'ru', controlMode: 'auto'
    };
    try { const s = localStorage.getItem('rive_settings'); if (s) settings = Object.assign(settings, JSON.parse(s)); } catch(e) {}
    function saveSettings() { try { localStorage.setItem('rive_settings', JSON.stringify(settings)); } catch(e) {} }

    // ═══════════════════════════════════════════════════════════
    //  TTS — Web Speech API (озвучка сущностей)
    // ═══════════════════════════════════════════════════════════
    const TTS = {
        enabled: true,
        lastSay: 0,
        supported: 'speechSynthesis' in window,
        say(text, options) {
            if (!this.supported || !settings.tts) return;
            const now = Date.now();
            if (now - this.lastSay < 2000) return;  // не чаще 1 раза в 2 сек
            this.lastSay = now;
            try {
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ru-RU';
                u.rate = options && options.rate || 0.8;
                u.pitch = options && options.pitch || 0.3;
                u.volume = (settings.scareVolume / 100) * (settings.masterVolume / 100);
                // Пытаемся найти русский мужской голос
                const voices = speechSynthesis.getVoices();
                const ru = voices.find(v => v.lang.startsWith('ru'));
                if (ru) u.voice = ru;
                speechSynthesis.speak(u);
            } catch(e) {}
        }
    };
    // Загружаем голоса
    if (TTS.supported) {
        speechSynthesis.onvoiceschanged = () => {};
        speechSynthesis.getVoices();
    }

    // ═══════════════════════════════════════════════════════════
    //  ПРОГРЕСС И РЕСУРСЫ
    // ═══════════════════════════════════════════════════════════
    let progress = {
        playerLevel: 1, playerXP: 0, xpToNext: 500,
        missionsDone: 0, employees: 0,
        currentFloor: 1, maxFloors: 1,
        currentMission: null, storySeen: false, deaths: 0
    };
    let resources = { credits: 1500, energy: 50, water: 50, food: 50, materials: 20 };
    let roomEmployees = {}, employees = [], applications = [];
    let employeeIdCounter = 1, applicationIdCounter = 1;
    let currentMission = null;

    let lastSaveTime = 0;
    function saveGame() {
        const now = Date.now();
        if (now - lastSaveTime < 1000) return;
        lastSaveTime = now;
        try {
            localStorage.setItem('rive_progress', JSON.stringify({ resources, progress }));
            localStorage.setItem('rive_rooms', JSON.stringify({ floors, roomEmployees }));
            localStorage.setItem('rive_employees', JSON.stringify({ employees, employeeIdCounter }));
            localStorage.setItem('rive_apps', JSON.stringify({ applications, applicationIdCounter }));
        } catch(e) {}
    }

    function loadGame() {
        try { const s = localStorage.getItem('rive_progress'); if (s) { const p = JSON.parse(s); if (p.resources) resources = Object.assign(resources, p.resources); if (p.progress) progress = Object.assign(progress, p.progress); } } catch(e) {}
        try { const s = localStorage.getItem('rive_rooms'); if (s) { const p = JSON.parse(s); if (p.floors) floors = p.floors; if (p.roomEmployees) roomEmployees = p.roomEmployees; } } catch(e) {}
        try { const s = localStorage.getItem('rive_employees'); if (s) { const p = JSON.parse(s); if (p.employees) employees = p.employees; if (p.employeeIdCounter) employeeIdCounter = p.employeeIdCounter; } } catch(e) {}
        try { const s = localStorage.getItem('rive_apps'); if (s) { const p = JSON.parse(s); if (p.applications) applications = p.applications; if (p.applicationIdCounter) applicationIdCounter = p.applicationIdCounter; } } catch(e) {}
        if (!floors || !floors[1] || !floors[1].rooms || !floors[1].rooms.length) floors = null;
    }

    // ═══════════════════════════════════════════════════════════
    //  ЗВУК
    // ═══════════════════════════════════════════════════════════
    const Sound = {
        ctx: null, humOsc: null, humGain: null, ambientStarted: false,
        init() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
        tone(freq, dur, type, vol, freqEnd) {
            if (!this.ctx) return;
            const v = (vol || 0.05) * (settings.masterVolume / 100) * (settings.soundVolume / 100);
            if (v <= 0.001) return;
            try {
                const t = this.ctx.currentTime;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
                if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
                g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.connect(g).connect(this.ctx.destination);
                o.start(t); o.stop(t + dur);
            } catch(e) {}
        },
        startAmbient() {
            if (this.ambientStarted || !this.ctx) return;
            try {
                this.humOsc = this.ctx.createOscillator();
                this.humGain = this.ctx.createGain();
                this.humOsc.type = 'sine'; this.humOsc.frequency.value = 55;
                this.humGain.gain.value = 0.015 * (settings.masterVolume / 100) * (settings.musicVolume / 100);
                this.humOsc.connect(this.humGain).connect(this.ctx.destination);
                this.humOsc.start(); this.ambientStarted = true;
            } catch(e) {}
        },
        click() { this.tone(700, 0.05, 'sine', 0.06, 900); },
        step() { this.tone(70 + Math.random() * 20, 0.05, 'triangle', 0.03, 40); },
        pickup() { [880, 1100, 1320].forEach((f, i) => setTimeout(() => this.tone(f, 0.08, 'sine', 0.08), i * 60)); },
        build() { [200, 180, 220, 160].forEach((f, i) => setTimeout(() => this.tone(f, 0.1, 'square', 0.08, 100), i * 150)); },
        buildDone() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.15, 'triangle', 0.1), i * 100)); },
        elevator() { this.tone(120, 0.5, 'sawtooth', 0.08, 60); setTimeout(() => this.tone(80, 0.8, 'sine', 0.1, 40), 250); },
        deny() { this.tone(200, 0.2, 'square', 0.08, 100); },
        notify() { [800, 1000, 1200].forEach((f, i) => setTimeout(() => this.tone(f, 0.08, 'sine', 0.08), i * 100)); },
        coin() { this.tone(1200, 0.06, 'sine', 0.05, 1800); },
        shot() { this.tone(400, 0.15, 'sawtooth', 0.15, 80); },
        hit() { this.tone(150, 0.2, 'sawtooth', 0.15, 60); },
        door() { this.tone(180, 0.4, 'sawtooth', 0.1, 60); },
        // Скример — усиленный
        scream() {
            if (!settings.scares) return;
            const v = settings.scareVolume / 100;
            this.tone(800, 0.6, 'sawtooth', 0.25 * v, 200);
            setTimeout(() => this.tone(600, 0.4, 'square', 0.22 * v, 150), 100);
            setTimeout(() => this.tone(1000, 0.5, 'sawtooth', 0.25 * v, 300), 200);
            setTimeout(() => this.tone(300, 0.7, 'sawtooth', 0.2 * v, 80), 400);
        }
    };

    // ═══════════════════════════════════════════════════════════
    //  НАВЫКИ
    // ═══════════════════════════════════════════════════════════
    const SKILLS = {
        science: { id: 'science', name: 'Наука', icon: '🔬', color: '#00d4ff' },
        guard: { id: 'guard', name: 'Охрана', icon: '🛡', color: '#f5a623' },
        chemistry: { id: 'chemistry', name: 'Химия', icon: '⚗️', color: '#00ffaa' },
        cooking: { id: 'cooking', name: 'Кулинария', icon: '🍳', color: '#e74c3c' },
        org: { id: 'org', name: 'Организация', icon: '📋', color: '#a855f7' },
        engineering: { id: 'engineering', name: 'Инженерия', icon: '📡', color: '#3498db' },
        physics: { id: 'physics', name: 'Физика', icon: '⚛️', color: '#f5d76e' },
        biology: { id: 'biology', name: 'Биология', icon: '🧬', color: '#34c759' },
        programming: { id: 'programming', name: 'Программирование', icon: '💻', color: '#9b59b6' }
    };
    const SKILL_IDS = Object.keys(SKILLS);
    const ROOM_SKILL_MAP = {
        lab: 'science', security: 'guard', chem: 'chemistry', cafeteria: 'cooking', kitchen: 'cooking',
        hr: 'org', office: 'org', power: 'engineering', radio: 'engineering', medbay: 'biology',
        quarantine: 'biology', armory: 'guard', storage: 'programming', rec: 'cooking',
        water: 'engineering', hangar: 'engineering', dorm: 'org'
    };

    const BUILDABLE_ROOMS = [
        { id: 'dorm', name: 'Общежитие', icon: '🛏', color: '#a855f7', cost: 500, levelReq: 1, desc: '+2 к лимиту', buildTime: 3, slots: 4 },
        { id: 'kitchen', name: 'Кухня', icon: '🍽', color: '#e74c3c', cost: 600, levelReq: 1, desc: '+еда', buildTime: 3, slots: 2 },
        { id: 'water', name: 'Водоочистка', icon: '🚰', color: '#3498db', cost: 600, levelReq: 1, desc: '+вода', buildTime: 3, slots: 2 },
        { id: 'power', name: 'Энергостанция', icon: '🔋', color: '#f5a623', cost: 800, levelReq: 2, desc: '+энергия', buildTime: 3, slots: 2 },
        { id: 'medbay', name: 'Мед. пункт', icon: '💊', color: '#ff4757', cost: 1000, levelReq: 2, desc: 'Лечение', buildTime: 3, slots: 2 },
        { id: 'armory', name: 'Арсенал', icon: '⚔️', color: '#f5d76e', cost: 1500, levelReq: 3, desc: '+урон', buildTime: 3, slots: 2 },
        { id: 'chem', name: 'Хим. лаборатория', icon: '🧪', color: '#00d4ff', cost: 1800, levelReq: 3, desc: 'Вещества', buildTime: 3, slots: 3 },
        { id: 'radio', name: 'Радиовышка', icon: '📡', color: '#34c759', cost: 2500, levelReq: 4, desc: 'Найм', buildTime: 3, slots: 2 },
        { id: 'rec', name: 'Комната отдыха', icon: '🎮', color: '#9b59b6', cost: 1500, levelReq: 4, desc: '+мораль', buildTime: 3, slots: 2 },
        { id: 'storage', name: 'Склад', icon: '📦', color: '#8b4513', cost: 3000, levelReq: 5, desc: '+лимит', buildTime: 3, slots: 2 },
        { id: 'quarantine', name: 'Карантин', icon: '🏥', color: '#e67e22', cost: 5000, levelReq: 6, desc: 'Изучение', buildTime: 3, slots: 3 },
        { id: 'hangar', name: 'Ангар', icon: '🚁', color: '#34495e', cost: 8000, levelReq: 8, desc: 'Эвакуация', buildTime: 3, slots: 2 }
    ];
    const ROOM_INCOME = {
        lab: { resource: 'materials', rate: 5 }, security: { resource: 'credits', rate: 6 },
        chem: { resource: 'materials', rate: 7 }, cafeteria: { resource: 'food', rate: 6 },
        kitchen: { resource: 'food', rate: 5 }, power: { resource: 'energy', rate: 6 },
        water: { resource: 'water', rate: 6 }, medbay: { resource: 'credits', rate: 5 },
        armory: { resource: 'credits', rate: 8 }, radio: { resource: 'credits', rate: 4 },
        rec: { resource: 'credits', rate: 3 }, storage: { resource: 'materials', rate: 4 },
        quarantine: { resource: 'materials', rate: 8 }, hangar: { resource: 'credits', rate: 7 },
        hr: { resource: 'credits', rate: 4 }, office: { resource: 'credits', rate: 5 },
        dorm: { resource: 'credits', rate: 2 }
    };

    // ═══════════════════════════════════════════════════════════
    //  ЭТАЖИ
    // ═══════════════════════════════════════════════════════════
    let floors = null;
    function createFloor1() {
        return {
            gridCols: 3, gridRows: 3,
            rooms: [
                { id: 'lab', name: 'Лаборатория', icon: '🔬', color: '#00d4ff', col: 0, row: 0, desc: 'Изучение', slots: 3 },
                { id: 'hall', name: 'Холл', icon: '🏢', color: '#34c759', col: 1, row: 0, desc: 'Приёмная', slots: 0 },
                { id: 'security', name: 'Офис охраны', icon: '🛡', color: '#f5a623', col: 2, row: 0, desc: 'Безопасность', slots: 3 },
                { id: 'cafeteria', name: 'Столовая', icon: '🍽', color: '#e74c3c', col: 0, row: 1, desc: 'Еда и отдых', slots: 2 },
                { id: 'elevator', name: 'Лифт', icon: '🛗', color: '#00d4ff', col: 1, row: 1, desc: 'Спуск на уровни', slots: 0 },
                { id: 'office', name: 'Кабинет', icon: '💼', color: '#f5d76e', col: 2, row: 1, desc: 'Твой кабинет', slots: 1 },
                { id: 'hr', name: 'Отдел кадров', icon: '📄', color: '#a855f7', col: 0, row: 2, desc: 'Приём', slots: 2 },
                { id: 'empty_1_1', name: 'Пустой слот', icon: '🚧', color: '#555', col: 1, row: 2, desc: 'Строительство', empty: true, slots: 0 },
                { id: 'empty_1_2', name: 'Пустой слот', icon: '🚧', color: '#555', col: 2, row: 2, desc: 'Строительство', empty: true, slots: 0 }
            ]
        };
    }
    function createEmptyFloor(n, cols, rows) {
        const rooms = [];
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
            rooms.push({ id: `empty_${n}_${r}_${c}`, name: 'Пустой слот', icon: '🚧', color: '#555', col: c, row: r, desc: 'Строительство', empty: true, slots: 0 });
        return { gridCols: cols, gridRows: rows, rooms };
    }
    function initFloors() {
        if (!floors) {
            floors = { 1: createFloor1(), 2: createEmptyFloor(2, 4, 3), 3: createEmptyFloor(3, 4, 3) };
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  КАНДИДАТЫ
    // ═══════════════════════════════════════════════════════════
    const CANDIDATE_TEMPLATES = [
        { name: 'Джон Смит', emoji: '👨', job: 'Учёный', exp: 5, skills: ['science', 'physics', 'programming'] },
        { name: 'Мария Гарсиа', emoji: '👩', job: 'Лаборант', exp: 3, skills: ['science', 'chemistry', 'biology'] },
        { name: 'Ханс Мюллер', emoji: '👨', job: 'Руководитель', exp: 10, skills: ['org', 'science', 'engineering'] },
        { name: 'Акира Танака', emoji: '👨', job: 'Инженер', exp: 7, skills: ['engineering', 'physics', 'programming'] },
        { name: 'Ольга Иванова', emoji: '👩', job: 'Химик', exp: 12, skills: ['chemistry', 'biology', 'science'] },
        { name: 'Лука Росси', emoji: '👨', job: 'Охранник', exp: 2, skills: ['guard', 'physics'] },
        { name: 'Ахмед Аль-Фарси', emoji: '👨', job: 'Охранник', exp: 8, skills: ['guard', 'org', 'engineering'] },
        { name: 'Софи Дюбуа', emoji: '👩', job: 'Повар', exp: 4, skills: ['cooking', 'chemistry', 'org'] },
        { name: 'Карлос Мендоса', emoji: '👨', job: 'Разнорабочий', exp: 6, skills: ['cooking', 'engineering'] },
        { name: 'Лена Шмидт', emoji: '👩', job: 'Программист', exp: 5, skills: ['programming', 'engineering', 'science'] },
        { name: 'Раджеш Кумар', emoji: '👨', job: 'Учёный', exp: 9, skills: ['science', 'physics', 'chemistry'] },
        { name: 'Эмили Джонсон', emoji: '👩', job: 'Лаборант', exp: 1, skills: ['biology'] },
        { name: 'Пьер Лоран', emoji: '👨', job: 'Охранник', exp: 3, skills: ['guard', 'cooking'] },
        { name: 'Ясмин Хадид', emoji: '👩', job: 'Биолог', exp: 7, skills: ['biology', 'science', 'physics'] },
        { name: 'Иван Петров', emoji: '👨', job: 'Инженер', exp: 15, skills: ['engineering', 'physics', 'programming', 'org'] },
        { name: 'Чжан Вэй', emoji: '👨', job: 'Программист', exp: 6, skills: ['programming', 'science', 'physics'] },
        { name: 'Анна Новак', emoji: '👩', job: 'Организатор', exp: 4, skills: ['org', 'cooking', 'biology'] },
        { name: 'Мохаммед Салах', emoji: '👨', job: 'Охранник', exp: 11, skills: ['guard', 'org', 'physics'] },
        { name: 'Клара Берг', emoji: '👩', job: 'Лаборант', exp: 2, skills: ['biology', 'chemistry'] },
        { name: 'Диего Сильва', emoji: '👨', job: 'Повар', exp: 8, skills: ['cooking', 'org', 'chemistry'] },
        { name: 'Фатима Азиз', emoji: '👩', job: 'Химик', exp: 5, skills: ['chemistry', 'biology', 'science'] },
        { name: 'Оливер Браун', emoji: '👨', job: 'Разнорабочий', exp: 3, skills: ['cooking', 'engineering'] },
        { name: 'Наталья Ковальски', emoji: '👩', job: 'Инженер', exp: 9, skills: ['engineering', 'physics', 'programming'] },
        { name: 'Таро Ямамото', emoji: '👨', job: 'Учёный', exp: 10, skills: ['science', 'physics', 'org'] },
        { name: 'Изабель Фернандес', emoji: '👩', job: 'Биолог', exp: 6, skills: ['biology', 'chemistry', 'science'] }
    ];

    function generateApplication() {
        if (applications.length >= 8) return;
        const t = CANDIDATE_TEMPLATES[Math.floor(Math.random() * CANDIDATE_TEMPLATES.length)];
        const skills = t.skills.map(sid => ({ id: sid, level: 2 + Math.floor(Math.random() * 4) }));
        if (Math.random() < 0.3 && skills.length < 4) {
            const ex = SKILL_IDS[Math.floor(Math.random() * SKILL_IDS.length)];
            if (!skills.find(s => s.id === ex)) skills.push({ id: ex, level: 1 + Math.floor(Math.random() * 3) });
        }
        applications.push({ id: applicationIdCounter++, name: t.name, emoji: t.emoji, job: t.job, exp: t.exp, skills, timeLeft: 180 + Math.floor(Math.random() * 120), createdAt: Date.now() });
        Sound.notify();
        addToast('📄 Новое заявление: ' + t.name, '#a855f7');
    }

    // ═══════════════════════════════════════════════════════════
    //  СОСТОЯНИЕ
    // ═══════════════════════════════════════════════════════════
    let screen = 'loading';
    let loadingProgress = 0, loadingTimer = 0;
    const splashText = `Компания R.I.V.E. изучала потустороннее, пока их сотрудник не исчез без следа. Попытка замять инцидент привела к созданию отряда S.C.O.U.T., но их находка изменила всё: «сбой» оказался физической дырой в реальности, которую невозможно закрыть.

Теперь R.I.V.E. — это Фонд.

Ты — новый начальник Фонда R.I.V.E.

Удачи.`;
    let splashCharIndex = 0, splashTimer = 0, splashComplete = false;

    const storyText = `2023 год. Группа исследователей R.I.V.E. обнаружила аномальную зону на границе реальности.

2024 год. Инцидент "37" — потеря связи с группой.

2025 год. Создан отряд S.C.O.U.T. Обнаружено: аномалия — не дыра, а ДВЕРЬ.

2026 год. R.I.V.E. переименован в Фонд. Твоя задача — исследовать, управлять, выживать.

Не доверяй тому, что видишь. Не слушай то, что слышишь. Возвращайся живым.`;
    let storyCharIndex = 0, storyTimer = 0;

    // ═══════════════════════════════════════════════════════════
    //  ГЕОМЕТРИЯ
    // ═══════════════════════════════════════════════════════════
    let ROOM_W = 200, ROOM_H = 180;
    let GRID_COLS = 3, GRID_ROWS = 3;
    let GRID_W = GRID_COLS * ROOM_W, GRID_H = GRID_ROWS * ROOM_H;
    const WALL_THICK = 12;
    const DOOR_WIDTH = 60;

    function updateFloorGeometry() {
        if (!floors || !floors[progress.currentFloor]) return;
        const f = floors[progress.currentFloor];
        GRID_COLS = f.gridCols;
        GRID_ROWS = f.gridRows;
        const availW = W;
        const availH = H - 54 - 80;
        ROOM_W = Math.min(200, Math.floor(availW / GRID_COLS));
        ROOM_H = Math.min(180, Math.floor(availH / GRID_ROWS));
        GRID_W = GRID_COLS * ROOM_W;
        GRID_H = GRID_ROWS * ROOM_H;
    }

    // ═══════════════════════════════════════════════════════════

    const PLAYER_RADIUS = 12;
    let player = { x: 300, y: 300, angle: -Math.PI / 2, walkPhase: 0, moving: false, speed: 3.0 };
    let camera = { x: 0, y: 0 };

    function updateCamera() {
        let cx = player.x - W / 2, cy = player.y - H / 2;
        cx = Math.max(0, Math.min(GRID_W - W, cx));
        cy = Math.max(0, Math.min(GRID_H - H, cy));
        if (GRID_W < W) cx = (GRID_W - W) / 2;
        if (GRID_H < H) cy = (GRID_H - H) / 2;
        camera.x = cx; camera.y = cy;
    }

    function isWall(x, y) {
        if (x < WALL_THICK || x > GRID_W - WALL_THICK) return true;
        if (y < WALL_THICK || y > GRID_H - WALL_THICK) return true;
        const col = Math.floor(x / ROOM_W), row = Math.floor(y / ROOM_H);
        const lx = x - col * ROOM_W, ly = y - row * ROOM_H;
        if (lx < WALL_THICK && col > 0) { const cY = ROOM_H / 2; if (ly < cY - DOOR_WIDTH / 2 || ly > cY + DOOR_WIDTH / 2) return true; }
        if (lx > ROOM_W - WALL_THICK && col < GRID_COLS - 1) { const cY = ROOM_H / 2; if (ly < cY - DOOR_WIDTH / 2 || ly > cY + DOOR_WIDTH / 2) return true; }
        if (ly < WALL_THICK && row > 0) { const cX = ROOM_W / 2; if (lx < cX - DOOR_WIDTH / 2 || lx > cX + DOOR_WIDTH / 2) return true; }
        if (ly > ROOM_H - WALL_THICK && row < GRID_ROWS - 1) { const cX = ROOM_W / 2; if (lx < cX - DOOR_WIDTH / 2 || lx > cX + DOOR_WIDTH / 2) return true; }
        return false;
    }

    function canMoveTo(x, y) {
        const r = PLAYER_RADIUS;
        if (isWall(x + r, y) || isWall(x - r, y) || isWall(x, y + r) || isWall(x, y - r)) return false;
        const d = r * 0.707;
        if (isWall(x + d, y + d) || isWall(x - d, y + d) || isWall(x + d, y - d) || isWall(x - d, y - d)) return false;
        return true;
    }

    function tryMovePlayer(dx, dy) {
        const nx = player.x + dx, ny = player.y + dy;
        if (canMoveTo(nx, ny)) { player.x = nx; player.y = ny; return true; }
        if (canMoveTo(nx, player.y)) { player.x = nx; return true; }
        if (canMoveTo(player.x, ny)) { player.y = ny; return true; }
        return false;
    }

    function drawButton(b) {
        let bg = 'rgba(0, 212, 255, 0.08)', bd = 'rgba(0, 212, 255, 0.4)', tc = '#00d4ff';
        if (b.type === 'primary') { bg = 'rgba(0, 212, 255, 0.15)'; bd = '#00d4ff'; }
        else if (b.type === 'gold') { bg = 'rgba(245, 215, 110, 0.15)'; bd = '#f5d76e'; tc = '#f5d76e'; }
        else if (b.type === 'danger') { bg = 'rgba(255, 71, 87, 0.15)'; bd = '#ff4757'; tc = '#ff4757'; }
        else if (b.type === 'success') { bg = 'rgba(52, 199, 89, 0.15)'; bd = '#34c759'; tc = '#34c759'; }
        ctx.fillStyle = bg;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = bd;
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
        ctx.fillStyle = tc;
        ctx.font = `bold ${b.fontSize}px "Courier New", monospace`;
        ctx.textAlign = b.align;
        ctx.textBaseline = 'middle';
        const tx = b.align === 'left' ? b.x + 16 : b.align === 'right' ? b.x + b.w - 16 : b.x + b.w / 2;
        ctx.fillText(b.label, tx, b.y + b.h / 2);
    }

    function wrapText(text, maxWidth, context) {
        const paragraphs = text.split('\n');
        const result = [];
        paragraphs.forEach(para => {
            if (para === '') { result.push(''); return; }
            const words = para.split(' ');
            let current = '';
            words.forEach(word => {
                const test = current ? current + ' ' + word : word;
                if (context.measureText(test).width > maxWidth) { if (current) result.push(current); current = word; }
                else current = test;
            });
            if (current) result.push(current);
        });
        return result;
    }

    function addXP(amount) {
        progress.playerXP += amount;
        while (progress.playerXP >= progress.xpToNext) {
            progress.playerXP -= progress.xpToNext;
            progress.playerLevel++;
            progress.xpToNext = Math.floor(progress.xpToNext * 1.5);
            addToast('🎉 УРОВЕНЬ ' + progress.playerLevel + '!', '#f5d76e');
            Sound.buildDone();
        }
        saveGame();
    }

    // ═══════════════════════════════════════════════════════════
    //  МЕБЕЛЬ (шкафы, тумбочки) — с лутом
    // ═══════════════════════════════════════════════════════════
    // Тип: 'cabinet' (шкаф), 'drawer' (тумбочка), 'table' (стол), 'chair' (стул), 'lamp' (лампа)
    function createFurnitureType(type) {
        if (type === 'cabinet') {
            return {
                type: 'cabinet', icon: '🗄️', color: '#4a3520', glow: '#6b4a2a',
                lootTable: [
                    { item: 'pistol', chance: 0.34, weight: 1 },
                    { item: 'taser', chance: 0.25, weight: 1 },
                    { item: 'ammo', chance: 0.5, weight: 1 }
                ],
                opened: false, empty: false
            };
        } else if (type === 'drawer') {
            return {
                type: 'drawer', icon: '🪑', color: '#5a3a1a', glow: '#8b6a3a',
                lootTable: [
                    { item: 'medkit', chance: 0.6, weight: 1 },
                    { item: 'energy', chance: 0.7, weight: 1 }
                ],
                opened: false, empty: false
            };
        } else if (type === 'table') {
            return { type: 'table', icon: '🪑', color: '#3a2a1a', glow: '#5a4a2a', decorative: true };
        } else if (type === 'chair') {
            return { type: 'chair', icon: '🪑', color: '#2a1a0a', glow: '#4a3a1a', decorative: true };
        } else if (type === 'lamp') {
            return { type: 'lamp', icon: '🔦', color: '#f5d76e', glow: '#fff', decorative: true };
        }
        return { type, icon: '📦', color: '#666', glow: '#999', decorative: true };
    }

    // ═══════════════════════════════════════════════════════════
    //  СОЗДАНИЕ LEVEL 0
    // ═══════════════════════════════════════════════════════════
    function createLevel0(type) {
        missionType = type;
        missionProgress = { killed: 0, totalKills: 1, zonesDone: 0, zonesTotal: 1, rescued: false };

        // Карта
        const map = [];
        for (let y = 0; y < MAP_SIZE; y++) {
            map[y] = [];
            for (let x = 0; x < MAP_SIZE; x++) map[y][x] = 1;
        }
        map[1][1] = 0;
        const frontiers = [];
        function addFrontiers(x, y) {
            [[0, -2], [0, 2], [-2, 0], [2, 0]].forEach(([dx, dy]) => {
                const nx = x + dx, ny = y + dy;
                if (nx > 0 && nx < MAP_SIZE - 1 && ny > 0 && ny < MAP_SIZE - 1 && map[ny][nx] === 1) {
                    frontiers.push({ x: nx, y: ny, fromX: x, fromY: y });
                }
            });
        }
        addFrontiers(1, 1);
        let safety = 0;
        while (frontiers.length > 0 && safety < 5000) {
            safety++;
            const idx = Math.floor(Math.random() * frontiers.length);
            const f = frontiers.splice(idx, 1)[0];
            if (map[f.y][f.x] === 0) continue;
            map[(f.y + f.fromY) / 2][(f.x + f.fromX) / 2] = 0;
            map[f.y][f.x] = 0;
            addFrontiers(f.x, f.y);
        }
        for (let i = 0; i < MAP_SIZE * 3; i++) {
            const x = 1 + Math.floor(Math.random() * (MAP_SIZE - 2));
            const y = 1 + Math.floor(Math.random() * (MAP_SIZE - 2));
            if (map[y][x] === 1) {
                const n = (map[y-1]?.[x] || 1) + (map[y+1]?.[x] || 1) + (map[y]?.[x-1] || 1) + (map[y]?.[x+1] || 1);
                if (n <= 2) map[y][x] = 0;
            }
        }

        // Свободные клетки
        const freeCells = [];
        for (let y = 1; y < MAP_SIZE - 1; y++) {
            for (let x = 1; x < MAP_SIZE - 1; x++) {
                if (map[y][x] === 0 && (x !== 1 || y !== 1)) freeCells.push({ x, y });
            }
        }

        // Выход
        let maxDist = 0, ex = MAP_SIZE - 3, ey = MAP_SIZE - 3;
        freeCells.forEach(({ x, y }) => {
            const d = Math.abs(x - 1) + Math.abs(y - 1);
            if (d > maxDist) { maxDist = d; ex = x; ey = y; }
        });
        map[ey][ex] = 2;
        const exitPos = { x: ex + 0.5, y: ey + 0.5 };

        // Мебель — шкафы, тумбочки, столы
        const furniture = [];
        const usedCells = new Set();
        usedCells.add("1,1");
        usedCells.add(ex + "," + ey);

        // Расставляем мебель
        const furnitureCount = 20 + Math.floor(Math.random() * 15);
        for (let i = 0; i < furnitureCount; i++) {
            let tries = 0;
            while (tries < 20) {
                const c = freeCells[Math.floor(Math.random() * freeCells.length)];
                if (!c) break;
                const k = c.x + "," + c.y;
                if (usedCells.has(k)) { tries++; continue; }
                const dS = Math.abs(c.x - 1) + Math.abs(c.y - 1);
                if (dS < 2) { tries++; continue; }
                usedCells.add(k);

                // Тип мебели
                let fType;
                const r = Math.random();
                if (r < 0.35) fType = 'cabinet';
                else if (r < 0.65) fType = 'drawer';
                else if (r < 0.85) fType = 'table';
                else fType = 'chair';

                const f = createFurnitureType(fType);
                f.x = c.x + 0.5;
                f.y = c.y + 0.5;
                f.mapX = c.x;
                f.mapY = c.y;
                furniture.push(f);
                break;
            }
        }

        // Лампы на потолке — просто для света (не блокируют)
        const lamps = [];
        for (let i = 0; i < 15; i++) {
            const c = freeCells[Math.floor(Math.random() * freeCells.length)];
            if (c) lamps.push({ x: c.x + 0.5, y: c.y + 0.5 });
        }

        // Предметы (валяются, но не как в шкафах)
        const items = [];
        spawnLevelItem(freeCells, items, 'medkit', 1 + Math.floor(Math.random() * 2), exitPos);
        spawnLevelItem(freeCells, items, 'ammo', 1 + Math.floor(Math.random() * 2), exitPos);

        // Сущности
        const entities = [];
        const numE = type === 'kill' ? 1 : (1 + Math.floor(Math.random() * 2));
        for (let i = 0; i < numE; i++) {
            let tries = 0;
            while (tries < 30) {
                const c = freeCells[Math.floor(Math.random() * freeCells.length)];
                if (!c) break;
                const d = Math.abs(c.x - 1) + Math.abs(c.y - 1);
                if (d > 8) {
                    entities.push(createEntity(c.x + 0.5, c.y + 0.5, Math.random() < 0.5 ? 'smiler' : 'hound'));
                    break;
                }
                tries++;
            }
        }

        // Заражённые зоны
        const infectedZones = [];
        if (type === 'virus') {
            let tries = 0;
            while (tries < 30) {
                const c = freeCells[Math.floor(Math.random() * freeCells.length)];
                if (!c) break;
                const d = Math.abs(c.x - 1) + Math.abs(c.y - 1);
                if (d > 6) { infectedZones.push({ x: c.x + 0.5, y: c.y + 0.5, deactivated: false }); break; }
                tries++;
            }
            missionProgress.zonesTotal = infectedZones.length || 1;
        }

        // Спасённый NPC
        let rescueNPC = null;
        if (type === 'rescue') {
            let tries = 0;
            while (tries < 40) {
                const c = freeCells[Math.floor(Math.random() * freeCells.length)];
                if (!c) break;
                const d = Math.abs(c.x - 1) + Math.abs(c.y - 1);
                if (d > 10) { rescueNPC = { x: c.x + 0.5, y: c.y + 0.5, following: false, name: 'Доктор В. Соколов', emoji: '🧑‍⚕️' }; break; }
                tries++;
            }
        }

        // Туман войны — какие клетки открыты
        const fog = [];
        for (let y = 0; y < MAP_SIZE; y++) {
            fog[y] = [];
            for (let x = 0; x < MAP_SIZE; x++) fog[y][x] = false;
        }
        // Открываем стартовую зону
        for (let dy = -3; dy <= 3; dy++) {
            for (let dx = -3; dx <= 3; dx++) {
                const nx = 1 + dx, ny = 1 + dy;
                if (ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE) {
                    if (Math.sqrt(dx * dx + dy * dy) < 4) fog[ny][nx] = true;
                }
            }
        }

        return {
            map, fog,
            player: { x: 1.5, y: 1.5, angle: 0, flash: 100, flashlightOn: true, bobPhase: 0, health: 100, maxHealth: 100 },
            items, entities, infectedZones, rescueNPC, exitPos, furniture, lamps,
            inventory: { medkit: 0, pistol: 0, ammo: 0, taser: 0, trap: 0, tablet: 0, energy: 0 },
            traps: [], particles: [], floatingTexts: [], toasts: [],
            vhsOffset: 0, screenShake: 0, damageFlash: 0, scareFlash: 0,
            scareFace: null,
            level: 0, levelTheme: 0,
            controls: { leftStick: { active: false, id: null, baseX: 130, baseY: H - 150, knobX: 130, knobY: H - 150, dx: 0, dy: 0 }, rightZone: { active: false, id: null, lastX: 0, rotateDelta: 0 } },
            inventoryOpen: false,
            deathScreen: null  // { timer, reason }
        };
    }

    function createEntity(x, y, type) {
        return {
            x, y, type,
            speed: type === 'hound' ? 0.03 : 0.015,
            hp: 30,
            state: 'idle',
            lastSeen: null,
            angle: 0,
            animTime: 0,
            screamCD: 0,
            stun: 0,
            _lastSay: 0,
            // Визуал — тело с руками/ногами
            walkPhase: 0,
            facing: 1
        };
    }

    function spawnLevelItem(freeCells, items, type, count, exitPos) {
        for (let i = 0; i < count; i++) {
            let tries = 0;
            while (tries < 30) {
                const c = freeCells[Math.floor(Math.random() * freeCells.length)];
                if (!c) break;
                const dS = Math.abs(c.x - 1) + Math.abs(c.y - 1);
                const dE = Math.abs(c.x - exitPos.x) + Math.abs(c.y - exitPos.y);
                if (dS > 3 && dE > 1 && !items.some(it => it.x === c.x && it.y === c.y)) {
                    items.push({ x: c.x + 0.5, y: c.y + 0.5, type, taken: false, bob: Math.random() * Math.PI * 2 });
                    break;
                }
                tries++;
            }
        }
    }

    function lvl0CanMove(x, y) {
        const xi = Math.floor(x), yi = Math.floor(y);
        if (xi < 0 || xi >= MAP_SIZE || yi < 0 || yi >= MAP_SIZE) return false;
        if (!lvl0.map[yi]) return false;
        return lvl0.map[yi][xi] !== 1;
    }

    function drawLoading() {

    function drawSplash() {
        ctx.fillStyle = '#0a0a10';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(0, 212, 255, 0.02)';
        for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
        if (logoReady) {
            const size = 130;
            ctx.drawImage(logoImg, W / 2 - size / 2, 60 - size / 2, size, size);
        }
        const vis = splashText.substring(0, splashCharIndex);
        ctx.fillStyle = '#e0e0e0';
        ctx.font = '15px "Courier New", monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        const lines = wrapText(vis, W - 60, ctx);
        lines.forEach((line, i) => ctx.fillText(line, 30, 160 + i * 24));
        if (splashComplete) {
            const pulse = 0.5 + Math.sin(performance.now() / 500) * 0.5;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = 'rgba(0, 212, 255, 0.15)';
            ctx.fillRect(W / 2 - 140, H - 130, 280, 60);
            ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
            ctx.strokeRect(W / 2 - 140 + 0.5, H - 130 + 0.5, 279, 59);
            ctx.fillStyle = '#00d4ff';
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    function enterBase() {
        Sound.init();
        Sound.startAmbient();
        progress.currentFloor = 1;
        updateFloorGeometry();
        const floor = floors[progress.currentFloor];
        const hall = floor.rooms.find(r => r.id === 'hall');
        if (hall) {
            player.x = hall.col * ROOM_W + ROOM_W / 2;
            player.y = hall.row * ROOM_H + ROOM_H / 2;
        } else { player.x = 300; player.y = 350; }

        buildMenuSlot = null;

    // ═══════════════════════════════════════════════════════════
    //  БАЗА — ОТРИСОВКА
    // ═══════════════════════════════════════════════════════════
    function drawBase() {
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, W, H);
        updateCamera();
        ctx.save();
        ctx.translate(-camera.x, -camera.y);
        const floor = floors[progress.currentFloor];
        floor.rooms.forEach(r => drawRoom(r));
        drawWalls();
        if (progress.maxFloors > 1) drawStairs();
        drawPlayerBase();
        const elev = floor.rooms.find(r => r.id === 'elevator');
        if (elev) drawElevatorPoint(elev);
        if (buildingAnimation) drawBuildingAnimation();
        ctx.restore();
        drawBaseHUD();
        if (buildMode) drawBuildModeUI();
        drawInteractPrompt();
        drawToasts();
        if (controlMode === 'mobile') drawMobileControls();
    }

    function drawRoom(room) {
        const x = room.col * ROOM_W, y = room.row * ROOM_H;
        if (room.empty) {
            const hl = buildMode;
            ctx.fillStyle = hl ? 'rgba(52, 199, 89, 0.1)' : 'rgba(80, 80, 80, 0.15)';
            ctx.fillRect(x + 4, y + 4, ROOM_W - 8, ROOM_H - 8);
            ctx.strokeStyle = hl ? '#34c759' : 'rgba(120, 120, 120, 0.4)';
            ctx.lineWidth = hl ? 3 : 2;
            ctx.setLineDash([8, 6]);
            ctx.strokeRect(x + 4, y + 4, ROOM_W - 8, ROOM_H - 8);
            ctx.setLineDash([]);
            ctx.fillStyle = hl ? '#34c759' : 'rgba(120, 120, 120, 0.5)';
            ctx.font = '40px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(hl ? '➕' : '🚧', x + ROOM_W / 2, y + ROOM_H / 2 - 10);
            return;
        }
        const light = (room.col + room.row) % 2 === 0;
        ctx.fillStyle = light ? '#1e2030' : '#191b28';
        ctx.fillRect(x, y, ROOM_W, ROOM_H);
        ctx.strokeStyle = room.color + '60'; ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, ROOM_W - 2, ROOM_H - 2);
        ctx.fillStyle = room.color;
        ctx.font = '28px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(room.icon, x + 25, y + 25);
        ctx.fillStyle = room.color;
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(room.name.toUpperCase(), x + 45, y + 25);
        if (room.slots > 0) {
            const arr = roomEmployees[room.id] || [];
            const occupied = arr.filter(e => e).length;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(x + ROOM_W - 50, y + ROOM_H - 35, 42, 22);
            ctx.strokeStyle = occupied >= room.slots ? '#34c759' : (occupied > 0 ? '#f5d76e' : '#666');
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x + ROOM_W - 50, y + ROOM_H - 35, 42, 22);
            ctx.fillStyle = occupied >= room.slots ? '#34c759' : (occupied > 0 ? '#f5d76e' : '#888');
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(occupied + '/' + room.slots, x + ROOM_W - 29, y + ROOM_H - 24);
        }
    }

    function drawWalls() {
        ctx.fillStyle = '#151520';
        ctx.fillRect(0, 0, GRID_W, WALL_THICK);
        ctx.fillRect(0, GRID_H - WALL_THICK, GRID_W, WALL_THICK);
        ctx.fillRect(0, 0, WALL_THICK, GRID_H);
        ctx.fillRect(GRID_W - WALL_THICK, 0, WALL_THICK, GRID_H);
        for (let col = 1; col < GRID_COLS; col++) {
            const wx = col * ROOM_W - WALL_THICK / 2;
            for (let row = 0; row < GRID_ROWS; row++) {
                const sY = row * ROOM_H, eY = sY + ROOM_H, cY = sY + ROOM_H / 2;
                ctx.fillRect(wx, sY, WALL_THICK, cY - DOOR_WIDTH / 2 - sY);
                ctx.fillRect(wx, cY + DOOR_WIDTH / 2, WALL_THICK, eY - (cY + DOOR_WIDTH / 2));
            }
        }
        for (let row = 1; row < GRID_ROWS; row++) {
            const wy = row * ROOM_H - WALL_THICK / 2;
            for (let col = 0; col < GRID_COLS; col++) {
                const sX = col * ROOM_W, eX = sX + ROOM_W, cX = sX + ROOM_W / 2;
                ctx.fillRect(sX, wy, cX - DOOR_WIDTH / 2 - sX, WALL_THICK);
                ctx.fillRect(cX + DOOR_WIDTH / 2, wy, eX - (cX + DOOR_WIDTH / 2), WALL_THICK);
            }
        }
        ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
        for (let col = 1; col < GRID_COLS; col++) {
            const wx = col * ROOM_W - WALL_THICK / 2;
            for (let row = 0; row < GRID_ROWS; row++) {
                const cY = row * ROOM_H + ROOM_H / 2;
                ctx.strokeRect(wx - 2, cY - DOOR_WIDTH / 2, WALL_THICK + 4, DOOR_WIDTH);
            }
        }
        for (let row = 1; row < GRID_ROWS; row++) {
            const wy = row * ROOM_H - WALL_THICK / 2;
            for (let col = 0; col < GRID_COLS; col++) {
                const cX = col * ROOM_W + ROOM_W / 2;
                ctx.strokeRect(cX - DOOR_WIDTH / 2, wy - 2, DOOR_WIDTH, WALL_THICK + 4);
            }
        }
    }

        ctx.shadowBlur = 20 + pulse * 15;

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🪜', cx, cy);
        ctx.restore();

    function drawInteractPrompt() {

        ctx.save();
        ctx.globalAlpha = pulse;
        const tW = ctx.measureText(interactPrompt).width;
        const bW = Math.max(220, tW + 50), bH = 46;
        const bX = W / 2 - bW / 2, bY = H - 400;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
        ctx.fillRect(bX, bY, bW, bH);
        ctx.strokeStyle = '#34c759'; ctx.lineWidth = 2;
        ctx.strokeRect(bX, bY, bW, bH);
        ctx.fillStyle = '#34c759';
        ctx.font = 'bold 14px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(interactPrompt, W / 2, bY + bH / 2);
        ctx.restore();
    }

            const bW = Math.max(240, ctx.measureText(t.text).width + 40);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(bX, bY, bW, bH);
            ctx.strokeStyle = t.color; ctx.lineWidth = 2;
            ctx.strokeRect(bX, bY, bW, bH);
            ctx.fillStyle = t.color;
            ctx.font = 'bold 13px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(t.text, W / 2, bY + bH / 2);
        });
        ctx.globalAlpha = 1;
    }

    function drawMobileControls() {

    }

    // ═══════════════════════════════════════════════════════════
    //  МИССИИ / ЛИФТ / ЗАЯВЛЕНИЯ И Т.Д. (сокращено)
    // ═══════════════════════════════════════════════════════════
    function updateInteractPrompt() {
        interactPrompt = '';
        interactTarget = null;
        if (buildMode) return;
        const floor = floors[progress.currentFloor];
        if (progress.maxFloors > 1) {
            const hall = floor.rooms.find(r => r.id === 'hall');
            if (hall) {
                const cx = hall.col * ROOM_W + ROOM_W / 2;
                const cy = hall.row * ROOM_H + ROOM_H / 2 + 30;
                if (Math.hypot(player.x - cx, player.y - cy) < 50) {
                    interactPrompt = '🪜 Лестница';
                    interactTarget = { type: 'stairs' };
                    return;
                }
            }
        }
        const elev = floor.rooms.find(r => r.id === 'elevator');
        if (elev) {
            const cx = elev.col * ROOM_W + ROOM_W / 2;
            const cy = elev.row * ROOM_H + ROOM_H / 2;
            if (Math.hypot(player.x - cx, player.y - cy) < 60) {
                interactPrompt = '🎯 Взаимодействие: Лифт';
                interactTarget = { type: 'elevator' };
                return;
            }
        }
    }

    function handleInteraction() {
        if (!interactTarget) return;
        if (interactTarget.type === 'elevator') { Sound.click(); screen = 'missionSelect'; }
        else if (interactTarget.type === 'stairs') { Sound.click(); screen = 'floorSelect'; }
    }

    // ═══════════════════════════════════════════════════════════
    //  LEVEL 0 — ОСНОВНОЕ
    // ═══════════════════════════════════════════════════════════
    function startLevel0() {
        try {
            const type = currentMission || 'kill';
            lvl0 = createLevel0(type);
            addToast('🎯 Задание: ' + (type === 'kill' ? 'Убить сущность' : type === 'virus' ? 'Деактивировать' : 'Спасти'), '#00d4ff');
            addToast('🖱 Тапни E у шкафа/тумбочки', '#f5d76e');
            screen = 'level0';
        } catch(err) {
            console.error('startLevel0 error:', err);
            lvl0 = null;
            screen = 'base';
        }

    // raycasting — защищённый
    function castRays() {
        const rays = [];
        const p = lvl0.player;
        const MAX_ITER = 80;
        for (let i = 0; i < RAY_COUNT; i++) {
            let dirX = Math.cos(p.angle + (2 * i / RAY_COUNT - 1) * FOV / 2);
            let dirY = Math.sin(p.angle + (2 * i / RAY_COUNT - 1) * FOV / 2);
            if (Math.abs(dirX) < 0.0001) dirX = 0.0001;
            if (Math.abs(dirY) < 0.0001) dirY = 0.0001;
            let mapX = Math.floor(p.x), mapY = Math.floor(p.y);
            const dX = Math.abs(1 / dirX), dY = Math.abs(1 / dirY);
            let stepX, stepY, sdX, sdY;
            if (dirX < 0) { stepX = -1; sdX = (p.x - mapX) * dX; }
            else { stepX = 1; sdX = (mapX + 1 - p.x) * dX; }
            if (dirY < 0) { stepY = -1; sdY = (p.y - mapY) * dY; }
            else { stepY = 1; sdY = (mapY + 1 - p.y) * dY; }
            let hit = 0, side = 0, cellType = 1, depth = 0, iter = 0;
            while (hit === 0 && depth < MAX_DEPTH && iter < MAX_ITER) {
                iter++;
                if (sdX < sdY) { sdX += dX; mapX += stepX; side = 0; }
                else { sdY += dY; mapY += stepY; side = 1; }
                if (mapX < 0 || mapX >= MAP_SIZE || mapY < 0 || mapY >= MAP_SIZE) { hit = 1; break; }
                if (!lvl0.map[mapY]) { hit = 1; break; }
                const cell = lvl0.map[mapY][mapX];
                if (cell === 1 || cell === 2) { hit = 1; cellType = cell; }
                depth++;
            }
            let dist;
            if (side === 0) dist = (mapX - p.x + (1 - stepX) / 2) / dirX;
            else dist = (mapY - p.y + (1 - stepY) / 2) / dirY;
            if (!isFinite(dist) || dist < 0.01) dist = MAX_DEPTH;
            if (dist > MAX_DEPTH) dist = MAX_DEPTH;
            let wallX;
            if (side === 0) wallX = p.y + dist * dirY;
            else wallX = p.x + dist * dirX;
            wallX -= Math.floor(wallX);
            if (!isFinite(wallX)) wallX = 0;
            rays.push({ cameraX: 2 * i / RAY_COUNT - 1, dist, side, cellType, wallX, mapX, mapY });
        }
        return rays;
    }

    // Проверка видимости (линия не блокирована)
    function hasLineOfSight(x1, y1, x2, y2) {
        const dx = x2 - x1, dy = y2 - y1;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.5) return true;
        const steps = Math.ceil(dist * 3);
        for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const cx = x1 + dx * t;
            const cy = y1 + dy * t;
            const xi = Math.floor(cx), yi = Math.floor(cy);
            if (xi < 0 || xi >= MAP_SIZE || yi < 0 || yi >= MAP_SIZE) return false;
            if (lvl0.map[yi][xi] === 1) return false;
        }
        return true;
    }

    function drawLevel0() {
        const p = lvl0.player;
        ctx.fillStyle = '#0a0a10';
        ctx.fillRect(0, 0, W, H);

        ctx.save();
        if (lvl0.screenShake > 0.1) ctx.translate((Math.random() - 0.5) * lvl0.screenShake, (Math.random() - 0.5) * lvl0.screenShake);

        const rays = castRays();
        const columnW = W / RAY_COUNT;
        const horizonY = H / 2 + 40;

        // Потолок и пол
        const cG = ctx.createLinearGradient(0, 0, 0, horizonY);
        cG.addColorStop(0, '#3a3a1a'); cG.addColorStop(1, '#8a8a4a');
        ctx.fillStyle = cG; ctx.fillRect(0, 0, W, horizonY);
        const fG = ctx.createLinearGradient(0, horizonY, 0, H);
        fG.addColorStop(0, '#6a6a2a'); fG.addColorStop(1, '#2a2a0a');
        ctx.fillStyle = fG; ctx.fillRect(0, horizonY, W, H - horizonY);

        // Стены
        for (let i = 0; i < rays.length; i++) {
            const r = rays[i];
            const wh = Math.min(H / r.dist * 0.9, H * 1.5);
            const wT = horizonY - wh / 2;
            const wB = horizonY + wh / 2;
            const x = i * columnW;
            let bR = 200, bG = 180, bB = 90;
            if (Math.floor(r.wallX * 4) % 2 === 0) { bR = 170; bG = 150; bB = 70; }
            const fog = Math.max(0, 1 - r.dist / MAX_DEPTH);
            bR = Math.floor(bR * fog + 20 * (1 - fog));
            bG = Math.floor(bG * fog + 15 * (1 - fog));
            bB = Math.floor(bB * fog + 5 * (1 - fog));
            if (r.side === 1) { bR *= 0.75; bG *= 0.75; bB *= 0.75; }
            if (r.cellType === 2) {
                const pulse = 0.8 + Math.sin(performance.now() / 300) * 0.2;
                bR = Math.floor(20 * fog); bG = Math.floor(180 * fog * pulse); bB = Math.floor(40 * fog);
            }
            if (p.flashlightOn && p.flash > 0) {
                const fb = Math.max(0, 1 - Math.pow(Math.abs(r.cameraX) * 1.4, 2));
                const inten = Math.min(1, p.flash / 50);
                const b = fb * inten;
                bR = Math.min(255, Math.floor(bR + b * 130));
                bG = Math.min(255, Math.floor(bG + b * 120));
                bB = Math.min(255, Math.floor(bB + b * 70));
            }
            const amb = 1 - Math.min(0.7, r.dist / MAX_DEPTH * 0.5);
            bR = Math.floor(bR * amb); bG = Math.floor(bG * amb); bB = Math.floor(bB * amb);
            ctx.fillStyle = `rgb(${bR},${bG},${bB})`;
            ctx.fillRect(x, wT, columnW + 1, wB - wT);
        }

        // Лампа
        const lampY = horizonY - 150, lampX = W / 2;
        const flicker = 0.7 + Math.random() * 0.3;
        const size = 40 * flicker;
        const lg = ctx.createRadialGradient(lampX, lampY, 0, lampX, lampY, size * 3);
        lg.addColorStop(0, `rgba(255, 250, 200, ${0.4 * flicker})`);
        lg.addColorStop(1, 'rgba(255, 250, 200, 0)');
        ctx.fillStyle = lg;
        ctx.fillRect(lampX - size * 3, lampY - size * 3, size * 6, size * 6);
        ctx.fillStyle = `rgba(255, 255, 220, ${0.8 * flicker})`;
        ctx.fillRect(lampX - 30, lampY - 8, 60, 16);

        // ═══ ОТРИСОВКА ОБЪЕКТОВ В ПОЛЕ ЗРЕНИЯ ═══
        // Сначала собираем всё для отрисовки с дистанцией
        const renderQueue = [];
        // Мебель
        lvl0.furniture.forEach(f => {
            const dx = f.x - p.x, dy = f.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > MAX_DEPTH) return;
            const angle = Math.atan2(dy, dx) - p.angle;
            let a = angle;
            while (a > Math.PI) a -= Math.PI * 2;
            while (a < -Math.PI) a += Math.PI * 2;
            if (Math.abs(a) > FOV / 2 + 0.3) return;
            // Линия видимости
            if (!hasLineOfSight(p.x, p.y, f.x, f.y)) return;
            const sx = W / 2 + (a / (FOV / 2)) * (W / 2);
            renderQueue.push({ dist, type: 'furniture', obj: f, sx });
        });
        // Предметы (кроме тех что подобраны)
        lvl0.items.forEach(it => {
            if (it.taken) return;
            const dx = it.x - p.x, dy = it.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > MAX_DEPTH) return;
            const angle = Math.atan2(dy, dx) - p.angle;
            let a = angle;
            while (a > Math.PI) a -= Math.PI * 2;
            while (a < -Math.PI) a += Math.PI * 2;
            if (Math.abs(a) > FOV / 2 + 0.3) return;
            if (!hasLineOfSight(p.x, p.y, it.x, it.y)) return;
            const sx = W / 2 + (a / (FOV / 2)) * (W / 2);
            renderQueue.push({ dist, type: 'item', obj: it, sx });
        });
        // Заражённые зоны
        lvl0.infectedZones.forEach(z => {
            if (z.deactivated) return;
            const dx = z.x - p.x, dy = z.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > MAX_DEPTH) return;
            const angle = Math.atan2(dy, dx) - p.angle;
            let a = angle;
            while (a > Math.PI) a -= Math.PI * 2;
            while (a < -Math.PI) a += Math.PI * 2;
            if (Math.abs(a) > FOV / 2 + 0.3) return;
            if (!hasLineOfSight(p.x, p.y, z.x, z.y)) return;
            const sx = W / 2 + (a / (FOV / 2)) * (W / 2);
            renderQueue.push({ dist, type: 'zone', obj: z, sx });
        });
        // Сущности — ТОЛЬКО если есть линия видимости И мы их можем видеть
        lvl0.entities.forEach(e => {
            if (e.state === 'dead') return;
            const dx = e.x - p.x, dy = e.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > MAX_DEPTH) return;
            const angle = Math.atan2(dy, dx) - p.angle;
            let a = angle;
            while (a > Math.PI) a -= Math.PI * 2;
            while (a < -Math.PI) a += Math.PI * 2;
            if (Math.abs(a) > FOV / 2 + 0.3) return;
            if (!hasLineOfSight(p.x, p.y, e.x, e.y)) return;
            const sx = W / 2 + (a / (FOV / 2)) * (W / 2);
            renderQueue.push({ dist, type: 'entity', obj: e, sx });
        });
        // Спасённый
        if (lvl0.rescueNPC) {
            const npc = lvl0.rescueNPC;
            const dx = npc.x - p.x, dy = npc.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MAX_DEPTH) {
                const angle = Math.atan2(dy, dx) - p.angle;
                let a = angle;
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                if (Math.abs(a) <= FOV / 2 + 0.3 && hasLineOfSight(p.x, p.y, npc.x, npc.y)) {
                    const sx = W / 2 + (a / (FOV / 2)) * (W / 2);
                    renderQueue.push({ dist, type: 'npc', obj: npc, sx });
                }
            }
        }

        // Сортируем по дистанции (дальние первыми)
        renderQueue.sort((a, b) => b.dist - a.dist);
        renderQueue.forEach(item => {
            if (item.type === 'furniture') drawFurnitureWorld(item.obj, item.sx, item.dist, horizonY);
            else if (item.type === 'item') drawItemWorld(item.obj, item.sx, item.dist, horizonY);
            else if (item.type === 'zone') drawZoneWorld(item.obj, item.sx, item.dist, horizonY);
            else if (item.type === 'entity') drawEntityWorld(item.obj, item.sx, item.dist, horizonY);
            else if (item.type === 'npc') drawRescueWorld(item.obj, item.sx, item.dist, horizonY);
        });

        // Выход
        const exitS = worldToScreen(lvl0.exitPos.x, lvl0.exitPos.y, rays, horizonY);
        if (exitS && hasLineOfSight(p.x, p.y, lvl0.exitPos.x, lvl0.exitPos.y)) {
            drawExit(exitS, horizonY);
        }

        ctx.restore();

        drawVHS();

        // Виньетка
        const v = ctx.createRadialGradient(W / 2, H / 2 + 40, W * 0.15, W / 2, H / 2 + 40, W * 0.7);
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, 'rgba(0,0,0,0.95)');
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);

        drawLevelUI();
        drawScareFlash();

        if (lvl0.damageFlash > 0) {
            ctx.fillStyle = `rgba(255, 0, 0, ${lvl0.damageFlash * 0.4})`;
            ctx.fillRect(0, 0, W, H);
        }

        if (lvl0.inventoryOpen) drawInventoryScreen();

        lvl0.toasts.forEach((t, i) => {
            const a = Math.min(1, t.life);
            ctx.globalAlpha = a;
            const bW = Math.max(240, ctx.measureText(t.text).width + 40);
            const bH = 38, bX = W / 2 - bW / 2, bY = 100 + i * 46;
            ctx.fillStyle = 'rgba(0,0,0,0.9)';
            ctx.fillRect(bX, bY, bW, bH);
            ctx.strokeStyle = t.color; ctx.lineWidth = 2;
            ctx.strokeRect(bX, bY, bW, bH);
            ctx.fillStyle = t.color;
            ctx.font = 'bold 13px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(t.text, W / 2, bY + bH / 2);
        });
        ctx.globalAlpha = 1;

        // Экран смерти
        if (lvl0.deathScreen) drawDeathScreen();

        if (controlMode === 'mobile') drawLevelMobileControls();
    }

    function worldToScreen(wx, wy, rays, horizonY) {
        const p = lvl0.player;
        const dx = wx - p.x, dy = wy - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (!isFinite(dist)) return null;
        const angle = Math.atan2(dy, dx) - p.angle;
        let a = angle;
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        if (Math.abs(a) > FOV / 2 + 0.3 || dist > MAX_DEPTH) return null;
        const sx = W / 2 + (a / (FOV / 2)) * (W / 2);
        return { x: sx, dist, angle: a };
    }

    // ═══ ОТРИСОВКА ОБЪЕКТОВ ═══
    function drawFurnitureWorld(f, sx, dist, horizonY) {
        const size = Math.min(1, 3 / dist);
        const baseY = horizonY + 40;
        const h = 60 * size;
        const w = 40 * size;

        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.ellipse(sx, baseY + 5, w * 0.6, 6 * size, 0, 0, Math.PI * 2);
        ctx.fill();

        // Тело шкафа
        ctx.fillStyle = f.color;
        ctx.fillRect(sx - w / 2, baseY - h, w, h);

        // Обводка
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - w / 2, baseY - h, w, h);

        // Дверца (линия)
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx, baseY - h + 3);
        ctx.lineTo(sx, baseY - 3);
        ctx.stroke();

        // Ручки
        ctx.fillStyle = '#f5d76e';
        ctx.beginPath();
        ctx.arc(sx - w * 0.15, baseY - h / 2, 2 * size, 0, Math.PI * 2);
        ctx.arc(sx + w * 0.15, baseY - h / 2, 2 * size, 0, Math.PI * 2);
        ctx.fill();

        // Свечение если можно открыть и не открыт
        if (!f.opened && !f.empty && !f.decorative) {
            const pulse = 0.5 + Math.sin(performance.now() / 300) * 0.5;
            ctx.strokeStyle = `rgba(245, 215, 110, ${pulse})`;
            ctx.lineWidth = 2;
            ctx.strokeRect(sx - w / 2 - 2, baseY - h - 2, w + 4, h + 4);
        }

        // Если открыт — иконка предмета/пусто
        if (f.opened) {
            if (f.lootItem) {
                ctx.font = `${Math.floor(20 * size)}px Arial`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(ITEM_TYPES[f.lootItem].emoji, sx, baseY - h / 2);
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(sx - 8 * size, baseY - h / 2 - 8 * size, 16 * size, 16 * size);
            }
        }
    }

    function drawItemWorld(it, sx, dist, horizonY) {
        const size = Math.min(1, 3 / dist);
        const bob = Math.sin(it.bob + performance.now() / 500) * 3;
        const cfg = ITEM_TYPES[it.type];
        if (!cfg) return;
        const baseY = horizonY + 40 + bob;

        // Свечение
        const gl = ctx.createRadialGradient(sx, baseY - 10, 0, sx, baseY - 10, 40 * size);
        gl.addColorStop(0, cfg.glow + 'cc');
        gl.addColorStop(0.5, cfg.glow + '44');
        gl.addColorStop(1, cfg.glow + '00');
        ctx.fillStyle = gl;
        ctx.beginPath();
        ctx.arc(sx, baseY - 10, 40 * size, 0, Math.PI * 2);
        ctx.fill();

        // Иконка
        ctx.font = `${Math.floor(35 * size)}px Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cfg.emoji, sx, baseY - 10);
    }

    function drawZoneWorld(z, sx, dist, horizonY) {
        const size = Math.min(1, 3 / dist);
        const baseY = horizonY + 40;
        const pulse = 0.6 + Math.sin(performance.now() / 200) * 0.4;
        const gl = ctx.createRadialGradient(sx, baseY, 0, sx, baseY, 60 * size);
        gl.addColorStop(0, `rgba(255, 0, 100, ${pulse})`);
        gl.addColorStop(0.5, `rgba(200, 0, 80, ${pulse * 0.5})`);
        gl.addColorStop(1, 'rgba(100, 0, 50, 0)');
        ctx.fillStyle = gl;
        ctx.beginPath(); ctx.arc(sx, baseY, 60 * size, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff00aa';
        ctx.font = `${Math.floor(30 * size)}px Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('☣️', sx, baseY);
    }

    // ═══ СУЩНОСТЬ С ТЕЛОМ, РУКАМИ, НОГАМИ ═══
    function drawEntityWorld(e, sx, dist, horizonY) {
        const size = Math.min(1, 4 / dist);
        const baseY = horizonY + 40;

        // Тело сущности — стикмен-подобное
        const height = 80 * size;
        const headR = 12 * size;
        const feetY = baseY;
        const headY = feetY - height;
        const bodyY = feetY - height * 0.55;

        // Аура при погоне
        if (e.state === 'chase') {
            const pulse = 0.5 + Math.sin(performance.now() / 200) * 0.5;
            ctx.fillStyle = `rgba(255, 0, 0, ${0.15 * pulse})`;
            ctx.beginPath();
            ctx.arc(sx, bodyY, 60 * size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Цвет
        const entityColor = e.type === 'smiler' ? '#000' : '#1a0000';
        ctx.strokeStyle = entityColor;
        ctx.fillStyle = entityColor;
        ctx.lineWidth = 4 * size;
        ctx.lineCap = 'round';

        // Тень
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.beginPath();
        ctx.ellipse(sx, feetY + 3, 20 * size, 4 * size, 0, 0, Math.PI * 2);
        ctx.fill();

        // Голова
        ctx.fillStyle = entityColor;
        ctx.beginPath();
        ctx.arc(sx, headY + headR, headR, 0, Math.PI * 2);
        ctx.fill();

        // Лицо смайлера / глаза хаунда
        if (e.type === 'smiler') {
            const pulse = 0.8 + Math.sin(e.animTime * 3) * 0.2;
            ctx.fillStyle = `rgba(255, 255, 255, ${pulse})`;
            ctx.font = `bold ${Math.floor(18 * size)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(':)', sx, headY + headR);
        } else {
            // Красные глаза
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(sx - 4 * size, headY + headR - 2 * size, 2 * size, 0, Math.PI * 2);
            ctx.arc(sx + 4 * size, headY + headR - 2 * size, 2 * size, 0, Math.PI * 2);
            ctx.fill();
        }

        // Тело
        ctx.strokeStyle = entityColor;
        ctx.beginPath();
        ctx.moveTo(sx, headY + headR * 2);
        ctx.lineTo(sx, bodyY + 10 * size);
        ctx.stroke();

        // Руки (тянутся вперёд, как у зомби)
        const armSwing = Math.sin(e.animTime * 6 + e.walkPhase) * 8 * size;
        const armReach = 20 * size;
        ctx.beginPath();
        ctx.moveTo(sx, headY + headR * 2 + 5 * size);
        ctx.lineTo(sx + e.facing * armReach, headY + headR * 2 + 15 * size + armSwing);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx, headY + headR * 2 + 5 * size);
        ctx.lineTo(sx + e.facing * armReach * 0.8, headY + headR * 2 + 20 * size - armSwing);
        ctx.stroke();

        // Ноги
        const legSwing = Math.sin(e.animTime * 10 + e.walkPhase) * 10 * size;
        const hipY = bodyY + 10 * size;
        ctx.beginPath();
        ctx.moveTo(sx, hipY);
        ctx.lineTo(sx - 8 * size + legSwing, feetY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx, hipY);
        ctx.lineTo(sx + 8 * size - legSwing, feetY);
        ctx.stroke();
    }

    function drawRescueWorld(npc, sx, dist, horizonY) {
        const size = Math.min(1, 3 / dist);
        const baseY = horizonY + 40;
        ctx.fillStyle = '#34c759';
        ctx.beginPath(); ctx.arc(sx, baseY - 40 * size, 20 * size, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.font = `${Math.floor(24 * size)}px Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(npc.emoji, sx, baseY - 40 * size);
        if (!npc.following) {
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.max(10, 14 * size)}px "Courier New", monospace`;
            ctx.fillText('ПОМОГИ!', sx, baseY - 70 * size);
        }
    }

    function drawExit(s, horizonY) {
        const size = Math.min(1, 3 / s.dist);
        const w = 100 * size, h = 160 * size;
        ctx.fillStyle = 'rgba(52, 199, 89, 0.85)';
        ctx.fillRect(s.x - w / 2, horizonY - h + h * 0.15, w, h);
        ctx.strokeStyle = '#34c759'; ctx.lineWidth = 3;
        ctx.strokeRect(s.x - w / 2, horizonY - h + h * 0.15, w, h);
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, size * 14)}px "Courier New", monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('ЛИФТ', s.x, horizonY - h + h * 0.15 + h / 2);
    }

    function drawVHS() {
        if (Math.random() < 0.05) lvl0.vhsOffset = (Math.random() - 0.5) * 20;
        lvl0.vhsOffset *= 0.9;
        for (let i = 0; i < 150; i++) {
            const x = Math.random() * W, y = Math.random() * H, b = Math.random() * 50;

            ctx.fillRect(x, y, 1, 1);

    // ═══ СКРИМЕР ═══
    function drawScareFlash() {
        if (lvl0.scareFlash <= 0) return;
        const i = lvl0.scareFlash;
        // Красная вспышка
        ctx.fillStyle = `rgba(255, 0, 0, ${i * 0.4})`;
        ctx.fillRect(0, 0, W, H);

        if (i > 0.3) {
            // Чёрный фон
            ctx.fillStyle = `rgba(0, 0, 0, ${i * 0.9})`;
            ctx.fillRect(0, 0, W, H);

            // Огромное лицо смайлера
            const faceR = 200 * (1.3 - i * 0.3);
            const cx = W / 2, cy = H / 2;

            // Голова
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(cx, cy, faceR, 0, Math.PI * 2);
            ctx.fill();

            // Глаза
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx - faceR * 0.4, cy - faceR * 0.2, faceR * 0.2, 0, Math.PI * 2);
            ctx.arc(cx + faceR * 0.4, cy - faceR * 0.2, faceR * 0.2, 0, Math.PI * 2);
            ctx.fill();

            // Зрачки
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(cx - faceR * 0.4, cy - faceR * 0.2, faceR * 0.1, 0, Math.PI * 2);
            ctx.arc(cx + faceR * 0.4, cy - faceR * 0.2, faceR * 0.1, 0, Math.PI * 2);
            ctx.fill();

            // Кровь из глаз
            ctx.fillStyle = '#8b0000';
            ctx.fillRect(cx - faceR * 0.45, cy - faceR * 0.05, faceR * 0.1, faceR * 1.2);
            ctx.fillRect(cx + faceR * 0.35, cy - faceR * 0.05, faceR * 0.1, faceR * 1.2);

            // Злобная улыбка
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = faceR * 0.08;
            ctx.beginPath();
            ctx.arc(cx, cy + faceR * 0.4, faceR * 0.6, 0.3, Math.PI - 0.3);
            ctx.stroke();

            // Зубы
            ctx.fillStyle = '#fff';
            const teethY = cy + faceR * 0.7;
            for (let j = -2; j <= 2; j++) {
                ctx.beginPath();
                ctx.moveTo(cx + j * faceR * 0.15 - faceR * 0.06, teethY);
                ctx.lineTo(cx + j * faceR * 0.15, teethY - faceR * 0.15);
                ctx.lineTo(cx + j * faceR * 0.15 + faceR * 0.06, teethY);
                ctx.closePath();
                ctx.fill();
            }
        }
    }

        if (!d) return;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';

        ctx.fillRect(0, 0, W, H);
