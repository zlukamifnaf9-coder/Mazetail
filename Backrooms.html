    // ═══ ПРОВЕРКА БЛИЖАЙШЕЙ МЕБЕЛИ ═══
    function checkFurnitureNear() {
        if (!lvl0) return null;
        const p = lvl0.player;
        for (const f of lvl0.furniture) {
            if (f.opened || f.empty || f.decorative) continue;
            const d = Math.hypot(f.x - p.x, f.y - p.y);
            if (d < 1.2) return f;
        }
        return null;
    }

    // ═══ ОТКРЫТЬ ШКАФ ═══
    function tryOpenFurniture() {
        const f = checkFurnitureNear();
        if (!f) return;
        f.opened = true;
        // Определяем что выпадет
        let looted = null;
        if (f.type === 'cabinet') {
            const r = Math.random();
            if (r < 0.34) looted = 'pistol';
            else if (r < 0.59) looted = 'taser';
            else if (r < 0.9) looted = 'ammo';
        } else if (f.type === 'drawer') {
            const r = Math.random();
            if (r < 0.55) looted = 'medkit';
            else if (r < 0.95) looted = 'energy';
        }
        if (looted) {
            f.lootItem = looted;
            lvl0.inventory[looted] = (lvl0.inventory[looted] || 0) + 1;
            addLevelToast('📦 Найдено: ' + ITEM_TYPES[looted].name, ITEM_TYPES[looted].color);
            Sound.pickup();
        } else {
            f.empty = true;
            addLevelToast('📦 Пусто...', '#666');
            Sound.deny();
        }
    }

    function addLevelToast(text, color) {
        if (!lvl0) return;
        lvl0.toasts.push({ text, color: color || '#fff', life: 2.5 });
    }

    // ═══════════════════════════════════════════════════════════
    //  ОБНОВЛЕНИЕ LEVEL 0
    // ═══════════════════════════════════════════════════════════
    function updateLevel0(dt) {
        if (!lvl0) return;
        if (!lvl0.player || !lvl0.map || !lvl0.entities) { lvl0 = null; screen = 'base'; return; }
        const p = lvl0.player;
        if (!isFinite(p.x) || !isFinite(p.y)) { p.x = 1.5; p.y = 1.5; }
        if (!isFinite(p.angle)) p.angle = 0;
        if (!isFinite(p.health)) p.health = 100;

        if (lvl0.screenShake > 0.1) lvl0.screenShake *= 0.9;
        if (lvl0.damageFlash > 0) lvl0.damageFlash -= dt * 2;
        if (lvl0.scareFlash > 0) lvl0.scareFlash -= dt * 3;

        lvl0.toasts.forEach(t => t.life -= dt);
        lvl0.toasts = lvl0.toasts.filter(t => t.life > 0);

        // Экран смерти — блокирует управление
        if (lvl0.deathScreen) {
            lvl0.deathScreen.timer -= dt;
            return;
        }

        if (lvl0.inventoryOpen) return;

        // Движение
        const c = lvl0.controls;
        let mvx = 0, mvy = 0;
        if (controlMode === 'mobile') {
            if (c.leftStick.active) { mvx = c.leftStick.dx; mvy = c.leftStick.dy; }
        } else {
            if (keys['w'] || keys['ц'] || keys['arrowup']) { mvx += Math.cos(p.angle); mvy += Math.sin(p.angle); }
            if (keys['s'] || keys['ы'] || keys['arrowdown']) { mvx -= Math.cos(p.angle); mvy -= Math.sin(p.angle); }
            if (keys['a'] || keys['ф'] || keys['arrowleft']) p.angle -= ROT_SPEED * 60 * dt;
            if (keys['d'] || keys['в'] || keys['arrowright']) p.angle += ROT_SPEED * 60 * dt;
        }
        const mag = Math.sqrt(mvx * mvx + mvy * mvy);
        if (mag > 0.1) {
            const speed = MOVE_SPEED_3D * Math.min(1, mag) * 60 * dt;
            const nx = p.x + (mvx / mag) * speed;
            const ny = p.y + (mvy / mag) * speed;
            if (lvl0CanMove(nx, p.y)) p.x = nx;
            if (lvl0CanMove(p.x, ny)) p.y = ny;
            p.bobPhase += dt * 10;
            if (!p._stepT) p._stepT = 0;
            p._stepT -= dt;
            if (p._stepT <= 0) { Sound.step(); p._stepT = 0.4; }
        }

        if (c.rightZone.rotateDelta) { p.angle += c.rightZone.rotateDelta; c.rightZone.rotateDelta = 0; }
        if (!isFinite(p.angle)) p.angle = 0;

        if (p.flashlightOn && p.flash > 0) p.flash = Math.max(0, p.flash - dt * 2.2);

        // Туман войны — открываем текущую клетку
        const pxi = Math.floor(p.x), pyi = Math.floor(p.y);
        for (let dy = -4; dy <= 4; dy++) {
            for (let dx = -4; dx <= 4; dx++) {
                const nx = pxi + dx, ny = pyi + dy;
                if (ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE) {
                    if (Math.sqrt(dx * dx + dy * dy) < 4.5) {
                        // Только если есть линия видимости
                        if (hasLineOfSight(p.x, p.y, nx + 0.5, ny + 0.5)) {
                            lvl0.fog[ny][nx] = true;
                        }
                    }
                }
            }
        }

        // Предметы на полу
        lvl0.items.forEach(it => {
            if (it.taken) return;
            const d = Math.hypot(it.x - p.x, it.y - p.y);
            if (d < 0.5) {
                it.taken = true;
                lvl0Pickup(it.type);
            }
            it.bob += dt * 2;
        });

        // Сущности
        lvl0.entities.forEach(e => {
            if (e.state === 'dead') return;
            if (!isFinite(e.x) || !isFinite(e.y)) { e.x = 1.5; e.y = 1.5; }
            if (e.stun > 0) { e.stun -= dt; return; }
            e.animTime += dt;
            const dx = p.x - e.x, dy = p.y - e.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const detectRange = e.type === 'hound' ? 10 : 6;
            // Проверка видимости — сущность нас видит только если есть линия
            const canSee = dist < detectRange && hasLineOfSight(e.x, e.y, p.x, p.y);

            if (canSee) {
                if (e.state !== 'chase') {
                    // Только что заметил
                    entitySay(e, 'spotted');
                }
                e.state = 'chase';
                e.lastSeen = { x: p.x, y: p.y };
                if (e.screamCD <= 0 && dist < 4 && settings.scares) {
                    Sound.scream();
                    lvl0.scareFlash = 1;
                    lvl0.screenShake = 15;
                    entitySay(e, 'attack');
                    e.screamCD = 8;
                }
            } else if (e.state === 'chase' && e.lastSeen) {
                const dl = Math.hypot(e.lastSeen.x - e.x, e.lastSeen.y - e.y);
                if (dl < 0.5) {
                    e.state = 'idle';
                    if (Math.random() < 0.3) entitySay(e, 'lost');
                }
            }
            if (e.screamCD > 0) e.screamCD -= dt;

            // Периодически говорит при погоне
            if (e.state === 'chase' && Math.random() < 0.005) {
                entitySay(e, 'chase');
            }

            // Движение к цели
            let target = null;
            if (e.state === 'chase' && e.lastSeen) target = e.lastSeen;
            if (target) {
                const tdx = target.x - e.x, tdy = target.y - e.y;
                const td = Math.hypot(tdx, tdy);
                if (td > 0.05 && td < 50) {
                    const sp = e.type === 'hound' ? 0.03 : 0.015;
                    const st = Math.min(sp * 60 * dt, td);
                    const nx = e.x + (tdx / td) * st;
                    const ny = e.y + (tdy / td) * st;
                    if (lvl0CanMove(nx, e.y)) e.x = nx;
                    if (lvl0CanMove(e.x, ny)) e.y = ny;
                    e.walkPhase += dt * 10;
                    e.facing = tdx > 0 ? 1 : -1;
                }
            }

            // Контакт = смерть + скример
            if (dist < 0.7) {
                triggerDeath(e.type === 'smiler' ? 'Smiler добрался до тебя' : 'Hound разорвал тебя');
            }
        });

        // Заражённые зоны
        lvl0.infectedZones.forEach(z => {
            if (z.deactivated) return;
            const d = Math.hypot(z.x - p.x, z.y - p.y);
            if (d < 0.6) {
                z.deactivated = true;
                missionProgress.zonesDone++;
                Sound.buildDone();
                addLevelToast('⚠️ Зона деактивирована!', '#00d4ff');
                checkMissionComplete();
            }
        });

        // Спасённый
        if (lvl0.rescueNPC) {
            const d = Math.hypot(lvl0.rescueNPC.x - p.x, lvl0.rescueNPC.y - p.y);
            if (d < 0.7 && !lvl0.rescueNPC.following) {
                lvl0.rescueNPC.following = true;
                Sound.buildDone();
                addLevelToast('👤 Спасён: ' + lvl0.rescueNPC.name, '#34c759');
                missionProgress.rescued = true;
            }
            if (lvl0.rescueNPC.following) {
                const tdx = p.x - lvl0.rescueNPC.x;
                const tdy = p.y - lvl0.rescueNPC.y;
                const td = Math.hypot(tdx, tdy);
                if (td > 0.8) {
                    const st = Math.min(0.04 * 60 * dt, td);
                    const nx = lvl0.rescueNPC.x + (tdx / td) * st;
                    const ny = lvl0.rescueNPC.y + (tdy / td) * st;
                    if (lvl0CanMove(nx, lvl0.rescueNPC.y)) lvl0.rescueNPC.x = nx;
                    if (lvl0CanMove(lvl0.rescueNPC.x, ny)) lvl0.rescueNPC.y = ny;
                }
            }
        }

        // Выход
        const dExit = Math.hypot(p.x - lvl0.exitPos.x, p.y - lvl0.exitPos.y);
        if (dExit < 0.6) {
            if (checkMissionComplete(true)) completeMissionLevel();
            else addLevelToast('⚠️ Задание не выполнено!', '#ff4757');
        }
    }

    function triggerDeath(reason) {
        if (!lvl0 || lvl0.deathScreen) return;
        // Скример
        if (settings.scares) {
            Sound.scream();
            lvl0.scareFlash = 1.5;
        }
        const tips = [
            'Не подходи близко к сущностям',
            'Слушай голоса — они предупреждают',
            'Проверяй шкафы — там может быть оружие',
            'Фонарик садится — экономь заряд',
            'Hound быстрее Smiler'
        ];
        lvl0.deathScreen = {
            timer: 3,
            reason: reason,
            tip: tips[Math.floor(Math.random() * tips.length)]
        };
        // Через 2 секунды показываем экран смерти
        setTimeout(() => {
            if (lvl0 && lvl0.deathScreen) {
                // Экран уже рисуется
            }
        }, 500);
    }

    function lvl0Pickup(type) {
        Sound.pickup();
        if (type === 'medkit') lvl0.inventory.medkit++;
        else if (type === 'pistol') { lvl0.inventory.pistol = 1; lvl0.inventory.ammo += 6; }
        else if (type === 'ammo') lvl0.inventory.ammo += 8;
        else if (type === 'taser') lvl0.inventory.taser++;
        else if (type === 'energy') lvl0.inventory.energy++;
        addLevelToast(ITEM_TYPES[type].emoji + ' ' + ITEM_TYPES[type].name, ITEM_TYPES[type].color);
    }

    function checkMissionComplete(silent) {
        if (missionType === 'kill') return missionProgress.killed >= missionProgress.totalKills;
        if (missionType === 'virus') return missionProgress.zonesDone >= missionProgress.zonesTotal;
        if (missionType === 'rescue') return missionProgress.rescued;
        return true;
    }

    function completeMissionLevel() {
        Sound.buildDone();
        const rewardCredits = 500 + Math.floor(Math.random() * 500);
        resources.credits += rewardCredits;
        addXP(300);
        progress.missionsDone++;
        saveGame();
        lvl0 = null;
        screen = 'base';
        updateFloorGeometry();
        const floor = floors[progress.currentFloor];
        const hall = floor.rooms.find(r => r.id === 'hall');
        if (hall) { player.x = hall.col * ROOM_W + ROOM_W / 2; player.y = hall.row * ROOM_H + ROOM_H / 2; }
        addToast('✅ Миссия выполнена! +' + rewardCredits + '💰', '#34c759');
    }

    function gameOverLevel() {
        resources.credits = Math.max(0, resources.credits - 200);
        progress.deaths = (progress.deaths || 0) + 1;
        addToast('💀 Вы погибли. -200💰', '#ff4757');
        saveGame();
        lvl0 = null;
        screen = 'base';
        updateFloorGeometry();
        const floor = floors[progress.currentFloor];
        const hall = floor.rooms.find(r => r.id === 'hall');
        if (hall) { player.x = hall.col * ROOM_W + ROOM_W / 2; player.y = hall.row * ROOM_H + ROOM_H / 2; }
    }

    // ═══════════════════════════════════════════════════════════
    //  ОБЩЕЕ ОБНОВЛЕНИЕ
    // ═══════════════════════════════════════════════════════════
    let lastTime = 0;
    let appTimer = 0;
    let incomeTimer = 0;

    function updateBase(dt) {
        let mx = 0, my = 0;
        if (!buildMode) {
            if (controlMode === 'mobile') {
                if (leftStick.active) { mx = leftStick.dx; my = leftStick.dy; }
            } else {
                if (keys['w'] || keys['ц'] || keys['arrowup']) my -= 1;
                if (keys['s'] || keys['ы'] || keys['arrowdown']) my += 1;
                if (keys['a'] || keys['ф'] || keys['arrowleft']) mx -= 1;
                if (keys['d'] || keys['в'] || keys['arrowright']) mx += 1;
            }
        }
        const mag = Math.sqrt(mx * mx + my * my);
        if (mag > 0.1) {
            const speed = player.speed * Math.min(1, mag) * 60 * dt;
            const moved = tryMovePlayer((mx / mag) * speed, (my / mag) * speed);
            if (moved) {
                player.angle = Math.atan2(my, mx);
                player.moving = true;
                player.walkPhase += dt * 12;
                if (!player._stepT) player._stepT = 0;
                player._stepT -= dt;
                if (player._stepT <= 0) { Sound.step(); player._stepT = 0.4; }
            } else player.moving = false;
        } else player.moving = false;
        if (interactPressed) {
            interactPressed = false;
            if (!buildMode) handleInteraction();
        }
    }

    function update(dt) {
        toasts.forEach(t => t.life -= dt);
        toasts = toasts.filter(t => t.life > 0);

        if (screen === 'loading') {
            loadingTimer += dt;
            loadingProgress = Math.min(100, loadingTimer * 50);
            if (loadingProgress >= 100) setTimeout(() => { if (screen === 'loading') screen = 'splash'; }, 500);
        } else if (screen === 'splash') {
            if (!splashComplete) {
                splashTimer += dt;
                const tc = Math.floor(splashTimer * 35);
                if (tc >= splashText.length) { splashCharIndex = splashText.length; splashComplete = true; }
                else while (splashCharIndex < tc && splashCharIndex < splashText.length) splashCharIndex++;
            }
        } else if (screen === 'story') {
            if (storyCharIndex < storyText.length) {
                storyTimer += dt;
                const tc = Math.floor(storyTimer * 35);
                while (storyCharIndex < tc && storyCharIndex < storyText.length) storyCharIndex++;
            }
        } else if (screen === 'base') {
            updateBase(dt);
            updateInteractPrompt();
            if (buildingAnimation) { buildingAnimation.timer += dt; if (buildingAnimation.timer >= buildingAnimation.totalTime) completeConstruction(); }
            appTimer += dt;
            if (appTimer >= 30) { appTimer = 0; generateApplication(); }
            applications.forEach(a => a.timeLeft -= dt);
            applications = applications.filter(a => a.timeLeft > 0);
        } else if (screen === 'elevator') {
            updateElevator(dt);
        } else if (screen === 'level0') {
            updateLevel0(dt);
        }
    }

    function updateElevator(dt) {
        elevatorTimer += dt;
        if (elevatorState === 'closing' && elevatorTimer > 1.5) { elevatorState = 'descending'; elevatorTimer = 0; elevatorMessage = 'СПУСК...'; }
        else if (elevatorState === 'descending' && elevatorTimer > 4) { elevatorState = 'arrived'; elevatorTimer = 0; elevatorMessage = 'УРОВЕНЬ 0'; }
        else if (elevatorState === 'arrived' && elevatorTimer > 2) { startLevel0(); }
    }

    function drawElevatorScreen() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        const dg = elevatorState === 'opening' ? Math.min(300, elevatorTimer * 200) : elevatorState === 'closing' ? Math.max(0, 300 - elevatorTimer * 200) : 0;
        ctx.fillStyle = '#2a2a3a';
        ctx.fillRect(0, 0, W / 2 - dg / 2, H);
        ctx.fillRect(W / 2 + dg / 2, 0, W / 2 - dg / 2, H);
        ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(W / 2 - dg / 2, 0); ctx.lineTo(W / 2 - dg / 2, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(W / 2 + dg / 2, 0); ctx.lineTo(W / 2 + dg / 2, H); ctx.stroke();
        if (elevatorMessage) {
            ctx.fillStyle = 'rgba(0,0,0,0.9)';
            ctx.fillRect(W / 2 - 220, H / 2 - 40, 440, 80);
            ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 2;
            ctx.strokeRect(W / 2 - 220, H / 2 - 40, 440, 80);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(elevatorMessage, W / 2, H / 2);
        }
    }

    function draw() {
        buttons = [];
        ctx.fillStyle = '#0a0a10';
        ctx.fillRect(0, 0, W, H);
        if (screen === 'loading') drawLoading();
        else if (screen === 'splash') drawSplash();
        else if (screen === 'menu') drawMenu();
        else if (screen === 'story') drawStory();
        else if (screen === 'settings') drawSettings();
        else if (screen === 'devs') drawDevs();
        else if (screen === 'help') drawHelp();
        else if (screen === 'base') drawBase();
        else if (screen === 'elevator') drawElevatorScreen();
        else if (screen === 'level0') drawLevel0();
        else if (screen === 'missionSelect') drawMissionSelect();
        else if (screen === 'floorSelect') drawFloorSelect();
        buttons.forEach(b => drawButton(b));
    }

    function drawMissionSelect() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#00d4ff';
        ctx.font = 'bold 22px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🎯 ВЫБЕРИ ЗАДАНИЕ', W / 2, 40);
        const missions = [
            { id: 'kill', title: '🔫 УНИЧТОЖИТЬ', desc: 'Найди пистолет и убей сущность', color: '#ff4757' },
            { id: 'virus', title: '☣️ ДЕАКТИВИРОВАТЬ', desc: 'Найди заражённую зону', color: '#00ffaa' },
            { id: 'rescue', title: '🧑 СПАСТИ', desc: 'Найди потерянного сотрудника', color: '#34c759' }
        ];
        missions.forEach((m, i) => {
            const y = 100 + i * 140;
            ctx.fillStyle = m.color + '22';
            ctx.fillRect(40, y, W - 80, 120);
            ctx.strokeStyle = m.color; ctx.lineWidth = 2;
            ctx.strokeRect(40.5, y + 0.5, W - 81, 119);
            ctx.fillStyle = m.color;
            ctx.font = 'bold 22px "Courier New", monospace';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(m.title, 60, y + 40);
            ctx.fillStyle = '#fff';
            ctx.font = '13px "Courier New", monospace';
            ctx.fillText(m.desc, 60, y + 75);
            addButton(40, y, W - 80, 120, '', () => startMission(m.id));
        });
        addButton(W / 2 - 100, H - 80, 200, 50, '← ОТМЕНА', () => { Sound.click(); screen = 'base'; }, { fontSize: 14 });
    }

    function startMission(type) {
        currentMission = type;
        progress.currentMission = type;
        saveGame();
        screen = 'elevator';
        elevatorState = 'closing';
        elevatorTimer = 0;
        elevatorMessage = 'ПОДГОТОВКА...';
        Sound.elevator();
    }

    function drawFloorSelect() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f5d76e';
        ctx.font = 'bold 24px "Courier New", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('🪜 ВЫБОР ЭТАЖА', W / 2, 50);
        for (let f = 1; f <= 3; f++) {
            const y = 140 + (f - 1) * 140;
            const unlocked = f <= progress.maxFloors;
            const current = f === progress.currentFloor;
            ctx.fillStyle = current ? 'rgba(52, 199, 89, 0.15)' : (unlocked ? 'rgba(245, 215, 110, 0.1)' : 'rgba(100, 100, 100, 0.1)');
            ctx.fillRect(40, y, W - 80, 110);
            ctx.strokeStyle = current ? '#34c759' : (unlocked ? '#f5d76e' : '#444');
            ctx.lineWidth = 2;
            ctx.strokeRect(40.5, y + 0.5, W - 81, 109);
            ctx.font = '50px Arial';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillStyle = unlocked ? '#fff' : '#555';
            ctx.fillText(unlocked ? '🏢' : '🔒', 65, y + 55);
            ctx.font = 'bold 22px "Courier New", monospace';
            ctx.fillStyle = unlocked ? '#fff' : '#555';
            ctx.fillText('ЭТАЖ ' + f, 130, y + 35);
            if (unlocked && !current) {
                addButton(40, y, W - 80, 110, '', () => {
                    progress.currentFloor = f;
                    updateFloorGeometry();
                    const flr = floors[f];
                    const hall = flr.rooms.find(r => r.id === 'hall') || flr.rooms[0];
                    player.x = hall.col * ROOM_W + ROOM_W / 2;
                    player.y = hall.row * ROOM_H + ROOM_H / 2;
                    screen = 'base';
                    addToast('🪜 Этаж ' + f, '#f5d76e');
                    Sound.click();
                    saveGame();
                });
            }
        }
        addButton(W / 2 - 100, H - 80, 200, 50, '← НАЗАД', () => { Sound.click(); screen = 'base'; }, { fontSize: 16 });
    }

    const isMobileCheck = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
    let controlMode = 'mobile';
    if (settings.controlMode === 'pc') controlMode = 'pc';
    else if (settings.controlMode === 'auto') controlMode = isMobileCheck ? 'mobile' : 'pc';

    function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * (W / rect.width), y: (cy - rect.top) * (H / rect.height) };
    }

    function handleTap(mx, my) {
        Sound.init();
        for (const b of buttons) {
            if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                if (b.onClick) b.onClick();
                return true;
            }
        }
        if (screen === 'splash' && !splashComplete) { splashCharIndex = splashText.length; splashComplete = true; }
        else if (screen === 'story' && storyCharIndex < storyText.length) storyCharIndex = storyText.length;
        return false;
    }

    function onTouchStart(e) {
        e.preventDefault();
        Sound.init();
        for (let i = 0; i < (e.touches ? e.touches.length : 1); i++) {
            const t = e.touches ? e.touches[i] : e;
            const pos = getCanvasPos({ touches: [t] });
            if (screen === 'level0' && controlMode === 'mobile' && lvl0) {
                const c = lvl0.controls;
                // Кнопки справа
                if (pos.x >= W / 2) {
                    if (Math.hypot(pos.x - (W - 55), pos.y - 115) < 40) { lvl0.player.flashlightOn = !lvl0.player.flashlightOn; Sound.click(); continue; }
                    if (Math.hypot(pos.x - (W - 55), pos.y - 205) < 40) { lvl0.inventoryOpen = !lvl0.inventoryOpen; Sound.click(); continue; }
                    if (Math.hypot(pos.x - (W - 55), pos.y - 295) < 40) {
                        // Использовать предмет (аптечка)
                        if (lvl0.inventory.medkit > 0 && lvl0.player.health < lvl0.player.maxHealth) {
                            lvl0.inventory.medkit--;
                            lvl0.player.health = Math.min(lvl0.player.maxHealth, lvl0.player.health + 50);
                            Sound.pickup();
                            addLevelToast('💊 +50 HP', '#34c759');
                        } else if (lvl0.inventory.energy > 0) {
                            lvl0.inventory.energy--;
                            lvl0.player.flash = 100;
                            Sound.pickup();
                            addLevelToast('🥤 Фонарик полный', '#ff00aa');
                        }
                        continue;
                    }
                    if (Math.hypot(pos.x - (W - 55), pos.y - 385) < 40) {
                        tryOpenFurniture();
                        continue;
                    }
                    if (c.rightZone.id === null) {
                        c.rightZone.active = true;
                        c.rightZone.id = t.identifier !== undefined ? t.identifier : 0;
                        c.rightZone.lastX = pos.x;
                    }
                    continue;
                }
                // Стик слева
                if (pos.x < W / 2 && c.leftStick.id === null) {
                    c.leftStick.active = true;
                    c.leftStick.id = t.identifier !== undefined ? t.identifier : 0;
                    c.leftStick.baseX = pos.x; c.leftStick.baseY = pos.y;
                    c.leftStick.knobX = pos.x; c.leftStick.knobY = pos.y;
                    continue;
                }
            }
            handleTap(pos.x, pos.y);
        }
    }

    function onTouchMove(e) {
        e.preventDefault();
        for (let i = 0; i < (e.touches ? e.touches.length : 0); i++) {
            const t = e.touches[i];
            const id = t.identifier !== undefined ? t.identifier : 0;
            const pos = getCanvasPos({ touches: [t] });
            if (screen === 'level0' && lvl0) {
                const c = lvl0.controls;
                if (c.leftStick.active && c.leftStick.id === id) {
                    const R = STICK_RADIUS;
                    let dx = pos.x - c.leftStick.baseX, dy = pos.y - c.leftStick.baseY;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d > R) { dx = dx / d * R; dy = dy / d * R; }
                    c.leftStick.knobX = c.leftStick.baseX + dx;
                    c.leftStick.knobY = c.leftStick.baseY + dy;
                    c.leftStick.dx = dx / R;
                    c.leftStick.dy = dy / R;
                } else if (c.rightZone.active && c.rightZone.id === id) {
                    const dx = pos.x - c.rightZone.lastX;
                    c.rightZone.rotateDelta = (c.rightZone.rotateDelta || 0) + dx * 0.006;
                    c.rightZone.lastX = pos.x;
                }
            }
            if (screen === 'base' && leftStick.active && leftStick.id === id) {
                let dx = pos.x - leftStick.baseX, dy = pos.y - leftStick.baseY;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d > STICK_RADIUS) { dx = dx / d * STICK_RADIUS; dy = dy / d * STICK_RADIUS; }
                leftStick.knobX = leftStick.baseX + dx;
                leftStick.knobY = leftStick.baseY + dy;
                leftStick.dx = dx / STICK_RADIUS;
                leftStick.dy = dy / STICK_RADIUS;
            }
        }
    }

    function onTouchEnd(e) {
        e.preventDefault();
        const ids = new Set();
        for (let i = 0; i < (e.touches ? e.touches.length : 0); i++) ids.add(e.touches[i].identifier !== undefined ? e.touches[i].identifier : 0);
        if (leftStick.id !== null && !ids.has(leftStick.id)) {
            leftStick.active = false; leftStick.id = null; leftStick.dx = 0; leftStick.dy = 0;
        }
        if (lvl0) {
            const c = lvl0.controls;
            if (c.leftStick.id !== null && !ids.has(c.leftStick.id)) {
                c.leftStick.active = false; c.leftStick.id = null; c.leftStick.dx = 0; c.leftStick.dy = 0;
            }
            if (c.rightZone.id !== null && !ids.has(c.rightZone.id)) {
                c.rightZone.active = false; c.rightZone.id = null;
            }
        }
    }

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });
    canvas.addEventListener('click', e => { const p = getCanvasPos(e); handleTap(p.x, p.y); });

    // ═══ КЛАВИАТУРА ═══
    document.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        keys[k] = true;
        if (screen === 'splash' && (k === ' ' || k === 'enter')) {
            if (!splashComplete) { splashCharIndex = splashText.length; splashComplete = true; }
            else screen = 'menu';
            e.preventDefault();
        }
        if (screen === 'story' && (k === ' ' || k === 'enter')) {
            if (storyCharIndex < storyText.length) storyCharIndex = storyText.length;
            else { progress.storySeen = true; saveGame(); enterBase(); }
            e.preventDefault();
        }
        if (screen === 'level0' && lvl0) {
            if (lvl0.deathScreen) {
                if (k === ' ' || k === 'enter') gameOverLevel();
                e.preventDefault(); return;
            }
            if (k === ' ') { lvl0.player.flashlightOn = !lvl0.player.flashlightOn; e.preventDefault(); }
            if (k === 'i' || k === 'ш') { lvl0.inventoryOpen = !lvl0.inventoryOpen; e.preventDefault(); }
            if (k === 'e' || k === 'у') { tryOpenFurniture(); e.preventDefault(); }
            if (k === 'q' || k === 'й') {
                // Использовать аптечку
                if (lvl0.inventory.medkit > 0 && lvl0.player.health < lvl0.player.maxHealth) {
                    lvl0.inventory.medkit--;
                    lvl0.player.health = Math.min(lvl0.player.maxHealth, lvl0.player.health + 50);
                    Sound.pickup();
                    addLevelToast('💊 +50 HP', '#34c759');
                }
            }
        }
        if (screen === 'base') {
            if (k === 'e' || k === 'у') { if (!buildMode) interactPressed = true; }
        }
        if (k.startsWith('arrow') || k === ' ') e.preventDefault();
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    // ═══════════════════════════════════════════════════════════
    //  СТАРТ
    // ═══════════════════════════════════════════════════════════
    loadGame();
    initFloors();
    if (!floors || !floors[1]) {
        floors = { 1: createFloor1(), 2: createEmptyFloor(2, 4, 3), 3: createEmptyFloor(3, 4, 3) };
    }
    if (!roomEmployees) roomEmployees = {};
    updateFloorGeometry();

    let errorCount = 0;
    function loop(time) {
        try {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;
            update(dt);
            draw();
            errorCount = 0;
        } catch(err) {
            errorCount++;
            console.error('Loop error:', err);
            if (errorCount >= 5) {
                try {
                    addToast('⚠️ Ошибка. Возврат...', '#ff4757');
                    lvl0 = null;
                    screen = 'base';
                    errorCount = 0;
                } catch(e) {}
            }
        }
        requestAnimationFrame(loop);
    }
    lastTime = performance.now();
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
