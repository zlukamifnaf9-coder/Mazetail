<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>День 1.5: Terraria на телефоне</title>
    <style>
        body { 
            margin: 0; background: #000; overflow: hidden; touch-action: none; 
            display: flex; justify-content: center; align-items: center; height: 100vh; 
            width: 100vw;
        }
        canvas { 
            background: #87CEEB; 
            image-rendering: pixelated; 
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Стили для экранных кнопок */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none; /* Чтобы клики проходили сквозь пустое место */
        }
        .btn-group {
            display: flex;
            gap: 10px;
            pointer-events: auto; /* Сами кнопки кликабельны */
        }
        .btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .btn:active { background: rgba(255, 255, 255, 0.7); }
        /* Кнопка копания отдельно */
        .btn-mine {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 80px;
            height: 80px;
            background: rgba(255, 0, 0, 0.3);
            border: 2px solid rgba(255, 0, 0, 0.8);
            pointer-events: auto;
        }
        .btn-mine:active { background: rgba(255, 0, 0, 0.6); }
    </style>
</head>
<body>

<canvas id="game"></canvas>

<div class="controls">
    <div class="btn-group">
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
        <div class="btn" id="btn-jump">▲</div>
    </div>
</div>
<div class="btn btn-mine" id="btn-mine">⛏️</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    // Адаптация размера под экран
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const TILE_SIZE = 30; // Чуть увеличили блоки для пальцев
    // Рассчитываем мир под размер экрана
    let worldWidth = Math.ceil(canvas.width / TILE_SIZE) + 2;
    let worldHeight = Math.ceil(canvas.height / TILE_SIZE) + 2;
    let world = [];

    // --- 1. МИР ИЗ БЛОКОВ ---
    function generateWorld() {
        world = [];
        for (let x = 0; x < worldWidth; x++) {
            world[x] = [];
            for (let y = 0; y < worldHeight; y++) {
                let dirtLevel = Math.floor(worldHeight * 0.7);
                if (y >= dirtLevel && y < worldHeight - 1) {
                    world[x][y] = 'dirt';
                } else if (y === worldHeight - 1) {
                    world[x][y] = 'stone';
                } else {
                    world[x][y] = 'air';
                }
            }
        }
    }
    generateWorld();

    // --- 2. ПЕРСОНАЖ ---
    let player = {
        x: 100, y: 300, 
        w: 20, h: 35,
        vx: 0, vy: 0,
        onGround: false,
        speed: 5,
        jumpPower: -12,
        gravity: 0.6
    };

    // --- 3. УПРАВЛЕНИЕ (Клавиатура + Сенсор) ---
    const keys = {};
    
    // Клавиатура
    document.addEventListener('keydown', (e) => keys[e.key] = true);
    document.addEventListener('keyup', (e) => keys[e.key] = false);

    // Сенсорные кнопки (обработка нажатий)
    function setupTouchButton(elementId, keyCode, isPress = true) {
        const el = document.getElementById(elementId);
        if (!el) return;
        
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyCode] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyCode] = false; });
        el.addEventListener('touchcancel', (e) => { keys[keyCode] = false; });
        
        // Для мыши (тестирование на ПК)
        el.addEventListener('mousedown', () => { keys[keyCode] = true; });
        el.addEventListener('mouseup', () => { keys[keyCode] = false; });
        el.addEventListener('mouseleave', () => { keys[keyCode] = false; });
    }

    setupTouchButton('btn-left', 'a');
    setupTouchButton('btn-right', 'd');
    setupTouchButton('btn-jump', 'w');

    // --- 4. КОПАНИЕ (Тап по экрану) ---
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        handleMine(touch.clientX, touch.clientY);
    });
    canvas.addEventListener('click', (e) => {
        handleMine(e.clientX, e.clientY);
    });

    function handleMine(clientX, clientY) {
        // Переводим экранные координаты в тайлы мира
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;   // Если canvas растянут CSS-ом
        const scaleY = canvas.height / rect.height;

        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;

        const tileX = Math.floor(canvasX / TILE_SIZE);
        const tileY = Math.floor(canvasY / TILE_SIZE);

        if (tileX >= 0 && tileX < worldWidth && tileY >= 0 && tileY < worldHeight) {
            // Проверка, что тап рядом с игроком
            const pTileX = Math.floor((player.x + player.w/2) / TILE_SIZE);
            const pTileY = Math.floor((player.y + player.h/2) / TILE_SIZE);
            if (Math.abs(tileX - pTileX) <= 3 && Math.abs(tileY - pTileY) <= 3) {
                world[tileX][tileY] = 'air';
            }
        }
    }

    // --- 5. ФИЗИКА И ОБНОВЛЕНИЕ ---
    function update() {
        // Горизонтальное движение
        if (keys['a']) player.vx = -player.speed;
        else if (keys['d']) player.vx = player.speed;
        else player.vx *= 0.8;

        // Прыжок
        if (keys['w'] && player.onGround) {
            player.vy = player.jumpPower;
            player.onGround = false;
        }

        player.vy += player.gravity;
        if (player.vy > 12) player.vy = 12;

        // Коллизия (такая же как в прошлый раз, но теперь мир динамический по высоте экрана)
        let newX = player.x + player.vx;
        let newY = player.y + player.vy;

        // По X
        let testX = Math.floor((newX + player.w/2) / TILE_SIZE);
        let testY1 = Math.floor((newY) / TILE_SIZE);
        let testY2 = Math.floor((newY + player.h - 1) / TILE_SIZE);
        if (testX >= 0 && testX < worldWidth && world[testX] && (world[testX][testY1] !== 'air' || world[testX][testY2] !== 'air')) {
            // Блокировка X
            if (player.vx > 0) player.x = testX * TILE_SIZE - player.w/2 - 1;
            else if (player.vx < 0) player.x = (testX + 1) * TILE_SIZE + player.w/2 + 1;
            player.vx = 0;
        } else {
            player.x = newX;
        }

        // По Y
        let testY = Math.floor((newY + player.h) / TILE_SIZE);
        let testX1 = Math.floor((newX) / TILE_SIZE);
        let testX2 = Math.floor((newX + player.w - 1) / TILE_SIZE);
        if (testY >= 0 && testY < worldHeight && world[testX1] && (world[testX1][testY] !== 'air' || world[testX2][testY] !== 'air')) {
            // Приземление
            player.y = testY * TILE_SIZE - player.h;
            player.vy = 0;
            player.onGround = true;
        } else {
            player.y = newY;
            player.onGround = false;
        }

        // Границы экрана (не даём улететь влево/вправо)
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;
    }

    // --- 6. ОТРИСОВКА ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Отрисовка мира
        for (let x = 0; x < worldWidth; x++) {
            for (let y = 0; y < worldHeight; y++) {
                if (world[x][y] === 'dirt') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    ctx.strokeStyle = '#5C2E00';
                    ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                } else if (world[x][y] === 'stone') {
                    ctx.fillStyle = '#555';
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // Отрисовка игрока (крупнее для телефона)
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.roundRect(player.x - player.w/2, player.y, player.w, player.h, 5);
        ctx.fill();
        
        ctx.fillStyle = '#000';
        ctx.fillRect(player.x - 6, player.y + 10, 5, 5);
        ctx.fillRect(player.x + 1, player.y + 10, 5, 5);
    }

    // Вспомогательная функция для скругленных прямоугольников
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        this.closePath();
        return this;
    };

    // --- ЦИКЛ ИГРЫ ---
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
