<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏁 Beach Rumble — Вид сзади</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}
.game-wrapper {
    background: linear-gradient(145deg, #1a2a1a, #0a1a0a);
    padding: 15px;
    border-radius: 20px;
    border: 3px solid #ffd700;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.08);
    max-width: 100vw;
}
canvas {
    display: block;
    border-radius: 12px;
    background: #1a2a1a;
    width: 100%;
    height: auto;
    touch-action: none;
}
.controls-mobile {
    display: none;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
    touch-action: none;
    flex-wrap: wrap;
}
.controls-mobile .row {
    display: flex;
    gap: 8px;
    justify-content: center;
}
.controls-mobile button {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255, 215, 0, 0.2);
    background: rgba(255, 215, 0, 0.05);
    color: #ffd700;
    font-size: 26px;
    touch-action: none;
    cursor: pointer;
    transition: 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}
.controls-mobile button:active,
.controls-mobile button.pressed {
    background: rgba(255, 215, 0, 0.15);
    border-color: #ffd700;
    transform: scale(0.92);
}
.controls-mobile .btn-wide {
    width: 72px;
    border-radius: 16px;
    font-size: 20px;
    letter-spacing: 1px;
}
.controls-mobile .btn-gas {
    border-color: rgba(0, 255, 100, 0.2);
    color: #66ff88;
}
.controls-mobile .btn-gas:active,
.controls-mobile .btn-gas.pressed {
    background: rgba(0, 255, 100, 0.15);
    border-color: #66ff88;
}
.controls-mobile .btn-brake {
    border-color: rgba(255, 50, 50, 0.2);
    color: #ff6666;
}
.controls-mobile .btn-brake:active,
.controls-mobile .btn-brake.pressed {
    background: rgba(255, 50, 50, 0.15);
    border-color: #ff6666;
}
.pc-hint {
    color: rgba(255, 215, 0, 0.15);
    font-size: 11px;
    text-align: center;
    margin-top: 8px;
    letter-spacing: 1px;
}
.info-panel {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
}
.info-panel span {
    color: rgba(255, 215, 0, 0.5);
    font-size: 13px;
    letter-spacing: 1px;
}
.info-panel .highlight {
    color: #ffd700;
    opacity: 1;
}
@media (max-width: 700px) {
    .controls-mobile { display: flex; }
    .controls-mobile button { width: 56px; height: 56px; font-size: 22px; }
    .controls-mobile .btn-wide { width: 64px; font-size: 16px; }
    .pc-hint { display: none; }
}
@media (max-width: 450px) {
    .controls-mobile button { width: 48px; height: 48px; font-size: 18px; }
    .controls-mobile .btn-wide { width: 56px; font-size: 14px; }
}
</style>
</head>
<body>
<div class="game-wrapper">
    <div class="info-panel">
        <span>🏎️ <span id="lapDisplay" class="highlight">1/3</span></span>
        <span>⏱️ <span id="timeDisplay" class="highlight">0.0</span>s</span>
        <span>🏆 <span id="positionDisplay" class="highlight">1</span></span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="controls-mobile" id="mobileControls">
        <div class="row">
            <button id="btnLeft">⬅️</button>
            <button id="btnGas" class="btn-gas btn-wide">🚀 ГАЗ</button>
            <button id="btnRight">➡️</button>
        </div>
        <div class="row">
            <button id="btnReset" class="btn-wide" style="width:80px;font-size:14px;">🔄</button>
            <button id="btnBrake" class="btn-brake btn-wide">⛔ ТОРМ</button>
            <button id="btnPause" class="btn-wide" style="width:80px;font-size:14px;">⏸️</button>
        </div>
    </div>
    <div class="pc-hint">⬆ ⬇ ⬅ ➡  ·  R — рестарт  ·  P — пауза</div>
</div>
<script>
// ============================================================
// 🏁 BEACH RUMBLE — ВИД СЗАДИ С ДОРОГОЙ
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

// ----- ЗВУК -----
let audioCtx = null;
let soundEnabled = true;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playBeep(freq = 440, dur = 0.08, vol = 0.06) {
    if (!soundEnabled || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

// ----- СОСТОЯНИЕ -----
let keys = { up: false, down: false, left: false, right: false };
let gamePaused = false;
let gameRunning = true;
let maxLaps = 3;
let raceTime = 0;
let startTime = Date.now();

// ----- МИР -----
const world = {
    width: 2000,
    height: 2000,
    roadPoints: [],
    checkpoints: [],
    decorations: [],
};

// Генерация трассы (изогнутое кольцо)
function generateWorld() {
    const cx = world.width / 2, cy = world.height / 2;
    const pts = 50;
    const baseRadius = 450;
    world.roadPoints = [];
    for (let i = 0; i < pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const r = baseRadius + Math.sin(a * 2.7) * 80 + Math.cos(a * 1.3) * 60 + Math.sin(a * 0.7) * 40;
        world.roadPoints.push({
            x: cx + Math.cos(a) * r,
            y: cy + Math.sin(a) * r
        });
    }
    // Чекпоинты
    world.checkpoints = [];
    for (let i = 0; i < world.roadPoints.length; i += 6) {
        const p = world.roadPoints[i];
        world.checkpoints.push({ x: p.x, y: p.y, index: world.checkpoints.length, radius: 45 });
    }
    // Декорации
    world.decorations = [];
    for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = baseRadius + 80 + Math.random() * 250;
        world.decorations.push({
            x: cx + Math.cos(a) * r,
            y: cy + Math.sin(a) * r,
            type: Math.random() > 0.5 ? 'palm' : 'rock',
            size: 12 + Math.random() * 25
        });
    }
}
generateWorld();

// ----- КЛАСС МАШИНЫ -----
class Car {
    constructor(x, y, color, name = 'Car') {
        this.x = x; this.y = y;
        this.angle = -Math.PI / 2;
        this.speed = 0;
        this.maxSpeed = 4.5;
        this.acceleration = 0.12;
        this.friction = 0.98;
        this.turnSpeed = 0.045;
        this.color = color;
        this.name = name;
        this.lap = 0;
        this.checkpointId = 0;
        this.finished = false;
        this.finishTime = 0;
        this.isPlayer = false;
        this.width = 24;
        this.height = 38;
    }
    update() {
        if (this.finished) return;
        if (this.isPlayer) {
            if (keys.up) this.speed = Math.min(this.speed + this.acceleration, this.maxSpeed);
            if (keys.down) this.speed = Math.max(this.speed - this.acceleration * 0.7, -this.maxSpeed * 0.4);
            if (!keys.up && !keys.down) this.speed *= this.friction;
            if (keys.left) this.angle -= this.turnSpeed * (0.5 + Math.abs(this.speed) / 6);
            if (keys.right) this.angle += this.turnSpeed * (0.5 + Math.abs(this.speed) / 6);
            if (Math.abs(this.speed) < 0.01) this.speed = 0;
        }
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        const m = 50;
        if (this.x < m) { this.x = m; this.speed *= -0.3; }
        if (this.x > world.width - m) { this.x = world.width - m; this.speed *= -0.3; }
        if (this.y < m) { this.y = m; this.speed *= -0.3; }
        if (this.y > world.height - m) { this.y = world.height - m; this.speed *= -0.3; }
    }
    draw(ctx, camX, camY, camAngle) {
        const dx = this.x - camX, dy = this.y - camY;
        const rot = -camAngle;
        const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
        const ry = dx * Math.sin(rot) + dy * Math.cos(rot);
        if (ry < 10) return;
        const scale = 400 / ry;
        const sx = W/2 + rx * scale;
        const sy = H/2 + 50 - 200 / ry;
        const w = this.width * scale * 1.2;
        const h = this.height * scale * 1.2;
        if (w < 2 || h < 2 || sx < -200 || sx > W + 200) return;
        const carAngle = this.angle - camAngle;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(carAngle);
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 20 * scale;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.roundRect(-w/2, -h/2, w, h, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(100,200,255,0.15)';
        ctx.beginPath();
        ctx.roundRect(-w/2 + 4, -h/2 + 4, w - 8, h * 0.25, 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.roundRect(-w/2 + 3, h/2 - 4, w - 6, 5, 2);
        ctx.fill();
        ctx.fillStyle = '#ff2200';
        ctx.shadowColor = '#ff2200';
        ctx.shadowBlur = 12 * scale;
        ctx.beginPath();
        ctx.arc(-w/2 + 5, -h/2 + 6, 3 * scale, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 - 5, -h/2 + 6, 3 * scale, 0, Math.PI*2);
        ctx.fill();
        if (keys.down || this.speed < -0.2) {
            ctx.fillStyle = '#ff0000';
            ctx.shadowBlur = 25 * scale;
            ctx.beginPath();
            ctx.arc(-w/2 + 8, h/2 - 6, 4 * scale, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w/2 - 8, h/2 - 6, 4 * scale, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,215,0,0.08)';
        ctx.fillRect(-w/3, h/2 - 10, w * 0.6, 5);
        if (this.isPlayer) {
            ctx.fillStyle = '#ffd700';
            ctx.font = `${10 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255,215,0,0.2)';
            ctx.fillText('🚗 ТЫ', 0, -h/2 - 8 * scale);
        }
        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

// ----- ИГРОК И БОТЫ -----
let player, bots = [];

function initRace() {
    const start = world.roadPoints[0];
    player = new Car(start.x + 30, start.y + 10, '#ff4444', 'Игрок');
    player.isPlayer = true;
    const colors = ['#44ff44', '#4488ff', '#ffaa00', '#ff44ff', '#ff8800'];
    const names = ['Bot 1', 'Bot 2', 'Bot 3', 'Bot 4', 'Bot 5'];
    bots = [];
    for (let i = 0; i < 5; i++) {
        const idx = Math.floor(Math.random() * world.roadPoints.length);
        const p = world.roadPoints[idx];
        const bot = new Car(p.x + Math.random() * 60 - 30, p.y + Math.random() * 60 - 30, colors[i % colors.length], names[i % names.length]);
        bot.maxSpeed = 2.0 + Math.random() * 1.8;
        bot.angle = -Math.PI/2 + (Math.random() - 0.5) * 0.8;
        bots.push(bot);
    }
    player.lap = 0; player.checkpointId = 0; player.finished = false;
    bots.forEach(b => { b.lap = 0; b.checkpointId = 0; b.finished = false; });
    raceTime = 0; startTime = Date.now();
}
initRace();

// ----- ОБНОВЛЕНИЕ БОТОВ -----
function updateBots() {
    bots.forEach(bot => {
        if (bot.finished) return;
        let min = Infinity, target = world.roadPoints[0];
        world.roadPoints.forEach(p => {
            const d = Math.hypot(p.x - bot.x, p.y - bot.y);
            if (d < min) { min = d; target = p; }
        });
        const dx = target.x - bot.x, dy = target.y - bot.y;
        const ta = Math.atan2(dy, dx);
        let diff = ta - bot.angle;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        bot.angle += diff * 0.04;
        const dist = Math.hypot(dx, dy);
        if (dist > 40) bot.speed = Math.min(bot.speed + 0.06, bot.maxSpeed);
        else bot.speed *= 0.97;
        if (dist < 20) bot.speed *= 0.92;
        bot.x += Math.cos(bot.angle) * bot.speed;
        bot.y += Math.sin(bot.angle) * bot.speed;
        world.checkpoints.forEach(cp => {
            const d = Math.hypot(bot.x - cp.x, bot.y - cp.y);
            if (d < cp.radius && cp.index !== bot.checkpointId) {
                if (cp.index === 0 && bot.checkpointId > 5) {
                    bot.lap++;
                    if (bot.lap >= maxLaps) { bot.finished = true; bot.finishTime = raceTime; }
                }
                bot.checkpointId = cp.index;
            }
        });
    });
}

// ----- ОБНОВЛЕНИЕ ИГРОКА -----
function updatePlayer() {
    if (player.finished) return;
    player.update();
    world.checkpoints.forEach(cp => {
        const d = Math.hypot(player.x - cp.x, player.y - cp.y);
        if (d < cp.radius && cp.index !== player.checkpointId) {
            if (cp.index === 0 && player.checkpointId > 5) {
                player.lap++;
                if (player.lap >= maxLaps) {
                    player.finished = true;
                    player.finishTime = raceTime;
                    playBeep(1000, 0.5, 0.2);
                    playBeep(1200, 0.3, 0.15);
                    setTimeout(() => playBeep(1500, 0.4, 0.15), 200);
                }
            }
            player.checkpointId = cp.index;
        }
    });
}

// ----- ОТРИСОВКА (ВИД СЗАДИ С ДОРОГОЙ) -----
function draw() {
    ctx.clearRect(0, 0, W, H);
    const camX = player.x, camY = player.y, camAngle = player.angle;

    // Небо/земля
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a3a6a');
    grad.addColorStop(0.2, '#2a5a4a');
    grad.addColorStop(0.5, '#3a7a3a');
    grad.addColorStop(0.8, '#2a5a2a');
    grad.addColorStop(1, '#1a2a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // ===== ДОРОГА В ПЕРСПЕКТИВЕ =====
    const segments = 100;
    const roadWidth = 100;
    const halfRoad = roadWidth / 2;

    for (let i = 0; i < segments; i++) {
        const t = i / segments;
        const lookAhead = 30 + t * 500;
        const idx = findClosestRoadPoint(
            player.x + Math.cos(camAngle) * lookAhead,
            player.y + Math.sin(camAngle) * lookAhead
        );
        const p = world.roadPoints[idx % world.roadPoints.length];

        const dx = p.x - camX, dy = p.y - camY;
        const rot = -camAngle;
        const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
        const ry = dx * Math.sin(rot) + dy * Math.cos(rot);
        if (ry < 5) continue;

        const scale = 450 / ry;
        const sx = W/2 + rx * scale;
        const sy = H/2 + 40 - 250 / ry;
        const halfW = (halfRoad + 20 * (1 - t)) * scale;
        const bright = 0.4 + 0.6 * (1 - t);

        // Асфальт
        const r = Math.floor(50 * bright);
        const g = Math.floor(80 * bright);
        const b = Math.floor(50 * bright);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.rect(sx - halfW, sy - 1.5, halfW * 2, 3);
        ctx.fill();

        // Обочина (светлая полоса)
        ctx.fillStyle = `rgba(200,200,150,${0.08 * bright})`;
        ctx.fillRect(sx - halfW - 4, sy - 1, 4, 2);
        ctx.fillRect(sx + halfW, sy - 1, 4, 2);

        // Разметка (пунктир)
        if (i % 8 < 4) {
            ctx.fillStyle = `rgba(255,255,255,${0.25 * bright})`;
            ctx.fillRect(sx - 3, sy - 0.5, 6, 1);
        }

        // Бордюр (красный/белый)
        if (i % 10 < 5) {
            ctx.fillStyle = `rgba(255,50,50,${0.15 * bright})`;
            ctx.fillRect(sx - halfW - 6, sy - 0.5, 2, 1);
            ctx.fillRect(sx + halfW + 4, sy - 0.5, 2, 1);
        } else {
            ctx.fillStyle = `rgba(255,255,255,${0.1 * bright})`;
            ctx.fillRect(sx - halfW - 6, sy - 0.5, 2, 1);
            ctx.fillRect(sx + halfW + 4, sy - 0.5, 2, 1);
        }

        // Стрелка на дороге (иногда)
        if (i % 20 === 0 && i > 10 && i < segments - 10) {
            ctx.fillStyle = `rgba(255,255,255,${0.08 * bright})`;
            ctx.beginPath();
            ctx.moveTo(sx - 4, sy - 3);
            ctx.lineTo(sx, sy - 6);
            ctx.lineTo(sx + 4, sy - 3);
            ctx.fill();
        }
    }

    // ---- ДЕКОРАЦИИ ----
    world.decorations.forEach(dec => {
        const dx = dec.x - camX, dy = dec.y - camY;
        const rot = -camAngle;
        const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
        const ry = dx * Math.sin(rot) + dy * Math.cos(rot);
        if (ry < 20) return;
        const scale = 400 / ry;
        const sx = W/2 + rx * scale;
        const sy = H/2 + 40 - 200 / ry;
        const size = dec.size * scale * 0.7;
        if (sx < -200 || sx > W + 200 || size < 2) return;
        if (dec.type === 'palm') {
            ctx.fillStyle = '#4a2a1a';
            ctx.fillRect(sx - size/10, sy, size/5, size * 0.6);
            ctx.fillStyle = '#2a7a2a';
            ctx.beginPath();
            ctx.arc(sx, sy - size * 0.05, size * 0.35, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#3a9a3a';
            ctx.beginPath();
            ctx.arc(sx - size * 0.2, sy - size * 0.1, size * 0.25, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sx + size * 0.2, sy - size * 0.1, size * 0.25, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#5a5a5a';
            ctx.beginPath();
            ctx.arc(sx, sy + size * 0.1, size * 0.3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#6a6a6a';
            ctx.beginPath();
            ctx.arc(sx - size * 0.05, sy + size * 0.05, size * 0.15, 0, Math.PI*2);
            ctx.fill();
        }
    });

    // ---- МАШИНЫ (сортировка по дальности) ----
    const allCars = [...bots, player];
    allCars.sort((a, b) => {
        const da = Math.hypot(a.x - camX, a.y - camY);
        const db = Math.hypot(b.x - camX, b.y - camY);
        return db - da;
    });
    allCars.forEach(car => {
        if (!car.finished || car === player) car.draw(ctx, camX, camY, camAngle);
    });

    // ---- СПИДОМЕТР ----
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.roundRect(W - 150, H - 65, 130, 45, 12);
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    const speed = Math.abs(player.speed * 30);
    ctx.fillText(`⚡ ${speed.toFixed(0)} км/ч`, W - 85, H - 34);

    // ---- ФИНИШ ----
    if (player.finished) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(W/2 - 160, H/2 - 70, 320, 120);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 ФИНИШ!', W/2, H/2);
        ctx.font = '20px Arial';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Время: ${raceTime.toFixed(1)}с`, W/2, H/2 + 45);
    }

    // ---- ПАУЗА ----
    if (gamePaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ ПАУЗА', W/2, H/2);
    }
}

function findClosestRoadPoint(x, y) {
    let min = Infinity, idx = 0;
    world.roadPoints.forEach((p, i) => {
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < min) { min = d; idx = i; }
    });
    return idx;
}

// ----- ОБНОВЛЕНИЕ -----
function update() {
    if (gamePaused || !gameRunning) return;
    raceTime = (Date.now() - startTime) / 1000;
    updatePlayer();
    updateBots();
    document.getElementById('lapDisplay').textContent = `${Math.min(player.lap + 1, maxLaps)}/${maxLaps}`;
    document.getElementById('timeDisplay').textContent = raceTime.toFixed(1);
    const all = [player, ...bots].filter(c => !c.finished);
    all.sort((a, b) => {
        if (a.lap !== b.lap) return b.lap - a.lap;
        return b.speed - a.speed;
    });
    const pos = all.indexOf(player) + 1;
    document.getElementById('positionDisplay').textContent = pos > 0 ? pos : '—';
}

// ----- УПРАВЛЕНИЕ -----
document.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': keys.up = true; e.preventDefault(); break;
        case 'ArrowDown': case 's': keys.down = true; e.preventDefault(); break;
        case 'ArrowLeft': case 'a': keys.left = true; e.preventDefault(); break;
        case 'ArrowRight': case 'd': keys.right = true; e.preventDefault(); break;
        case 'r': resetRace(); break;
        case 'p': togglePause(); break;
    }
});
document.addEventListener('keyup', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': keys.up = false; e.preventDefault(); break;
        case 'ArrowDown': case 's': keys.down = false; e.preventDefault(); break;
        case 'ArrowLeft': case 'a': keys.left = false; e.preventDefault(); break;
        case 'ArrowRight': case 'd': keys.right = false; e.preventDefault(); break;
    }
});

function setupTouch(id, key) {
    const el = document.getElementById(id);
    if (!el) return;
    const start = (e) => { e.preventDefault(); keys[key] = true; el.classList.add('pressed'); initAudio(); };
    const end = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
}
setupTouch('btnLeft', 'left');
setupTouch('btnRight', 'right');
setupTouch('btnGas', 'up');
setupTouch('btnBrake', 'down');

document.getElementById('btnReset').addEventListener('click', resetRace);
document.getElementById('btnPause').addEventListener('click', togglePause);

function resetRace() {
    initRace();
    startTime = Date.now();
    gameRunning = true;
    gamePaused = false;
    document.getElementById('btnPause').textContent = '⏸️';
    playBeep(600, 0.2, 0.1);
}
function togglePause() {
    gamePaused = !gamePaused;
    document.getElementById('btnPause').textContent = gamePaused ? '▶️' : '⏸️';
    if (!gamePaused) startTime = Date.now() - raceTime * 1000;
}

// ----- СТАРТ -----
initAudio();
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });
gameLoop();

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
