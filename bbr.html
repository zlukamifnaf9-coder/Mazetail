<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏁 Beach Rumble: Turbo — Вид сзади</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
}

.game-wrapper {
    background: linear-gradient(145deg, #1a2a1a, #0a1a0a);
    padding: 15px;
    border-radius: 20px;
    border: 3px solid #ffd700;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.08);
    max-width: 100vw;
}

canvas {
    display: block;
    border-radius: 12px;
    background: #1a2a1a;
    width: 100%;
    height: auto;
    touch-action: none;
}

/* ===== МОБИЛЬНОЕ УПРАВЛЕНИЕ ===== */
.controls-mobile {
    display: none;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
    touch-action: none;
}

.controls-mobile .row {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.controls-mobile button {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255, 215, 0, 0.2);
    background: rgba(255, 215, 0, 0.05);
    color: #ffd700;
    font-size: 26px;
    touch-action: none;
    cursor: pointer;
    transition: 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.controls-mobile button:active,
.controls-mobile button.pressed {
    background: rgba(255, 215, 0, 0.15);
    border-color: #ffd700;
    transform: scale(0.92);
}

.controls-mobile .btn-wide {
    width: 72px;
    border-radius: 16px;
    font-size: 20px;
    letter-spacing: 1px;
}

.controls-mobile .btn-gas {
    border-color: rgba(0, 255, 100, 0.2);
    color: #66ff88;
}
.controls-mobile .btn-gas:active,
.controls-mobile .btn-gas.pressed {
    background: rgba(0, 255, 100, 0.15);
    border-color: #66ff88;
}

.controls-mobile .btn-brake {
    border-color: rgba(255, 50, 50, 0.2);
    color: #ff6666;
}
.controls-mobile .btn-brake:active,
.controls-mobile .btn-brake.pressed {
    background: rgba(255, 50, 50, 0.15);
    border-color: #ff6666;
}

/* ПК-управление (подсказка) */
.pc-hint {
    color: rgba(255, 215, 0, 0.15);
    font-size: 11px;
    text-align: center;
    margin-top: 8px;
    letter-spacing: 1px;
}

.info-panel {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 4px;
}
.info-panel span {
    color: rgba(255, 215, 0, 0.5);
    font-size: 13px;
    letter-spacing: 1px;
}
.info-panel .highlight {
    color: #ffd700;
    opacity: 1;
}

/* ===== АДАПТИВ ===== */
@media (max-width: 700px) {
    .controls-mobile {
        display: flex;
        flex-wrap: wrap;
    }
    .controls-mobile button {
        width: 56px;
        height: 56px;
        font-size: 22px;
    }
    .controls-mobile .btn-wide {
        width: 64px;
        font-size: 16px;
    }
    .pc-hint {
        display: none;
    }
    .game-wrapper {
        padding: 10px;
        border-width: 2px;
    }
    .info-panel span {
        font-size: 11px;
    }
}

@media (max-width: 450px) {
    .controls-mobile button {
        width: 48px;
        height: 48px;
        font-size: 18px;
    }
    .controls-mobile .btn-wide {
        width: 56px;
        font-size: 14px;
    }
    .controls-mobile {
        gap: 5px;
    }
    .controls-mobile .row {
        gap: 5px;
    }
}
</style>
</head>
<body>

<div class="game-wrapper">
    <div class="info-panel">
        <span>🏎️ <span id="lapDisplay" class="highlight">1/3</span></span>
        <span>⏱️ <span id="timeDisplay" class="highlight">0.0</span>s</span>
        <span>🏆 <span id="positionDisplay" class="highlight">1</span></span>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- МОБИЛЬНОЕ УПРАВЛЕНИЕ -->
    <div class="controls-mobile" id="mobileControls">
        <div class="row">
            <button id="btnLeft" class="btn-left">⬅️</button>
            <button id="btnGas" class="btn-gas btn-wide">🚀 ГАЗ</button>
            <button id="btnRight" class="btn-right">➡️</button>
        </div>
        <div class="row">
            <button id="btnReset" class="btn-wide" style="width:80px;font-size:14px;">🔄</button>
            <button id="btnBrake" class="btn-brake btn-wide">⛔ ТОРМ</button>
            <button id="btnPause" class="btn-wide" style="width:80px;font-size:14px;">⏸️</button>
        </div>
    </div>

    <div class="pc-hint">⬆ ⬇ ⬅ ➡  ·  R — рестарт  ·  P — пауза</div>
</div>

<script>
// ============================================================
// 🏁 BEACH RUMBLE: TURBO — ВИД СЗАДИ (3D-эффект)
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 800, H = 600;

// ----- ЗВУК -----
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playBeep(freq = 440, dur = 0.08, vol = 0.06) {
    if (!soundEnabled || !audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

// ----- СОСТОЯНИЕ -----
let keys = { up: false, down: false, left: false, right: false };
let gamePaused = false;
let gameRunning = true;
let maxLaps = 3;

// ----- КЛАСС МИРА (трасса в глобальных координатах) -----
const world = {
    width: 2000,
    height: 2000,
    roadPoints: [],
    checkpoints: [],
    decorations: [],
};

// Генерация трассы (большое кольцо)
function generateWorld() {
    const cx = world.width / 2;
    const cy = world.height / 2;
    const pts = 40;
    const baseRadius = 500;
    world.roadPoints = [];
    for (let i = 0; i < pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const r = baseRadius + Math.sin(a * 2.3) * 80 + Math.cos(a * 1.1) * 60;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        world.roadPoints.push({ x, y });
    }

    // Чекпоинты
    world.checkpoints = [];
    for (let i = 0; i < world.roadPoints.length; i += 6) {
        world.checkpoints.push({
            x: world.roadPoints[i].x,
            y: world.roadPoints[i].y,
            index: world.checkpoints.length,
            radius: 50
        });
    }

    // Декорации (пальмы, камни)
    world.decorations = [];
    for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = baseRadius + 60 + Math.random() * 200;
        const x = cx + Math.cos(a) * r;
        const y = cy + Math.sin(a) * r;
        world.decorations.push({
            x, y,
            type: Math.random() > 0.5 ? 'palm' : 'rock',
            size: 15 + Math.random() * 20
        });
    }
}
generateWorld();

// ----- КЛАСС МАШИНЫ -----
class Car {
    constructor(x, y, color, name = 'Car') {
        this.x = x;
        this.y = y;
        this.angle = -Math.PI / 2;
        this.speed = 0;
        this.maxSpeed = 4.5;
        this.acceleration = 0.12;
        this.friction = 0.98;
        this.turnSpeed = 0.045;
        this.color = color;
        this.name = name;
        this.lap = 0;
        this.checkpointId = 0;
        this.finished = false;
        this.finishTime = 0;
        this.isPlayer = false;
        this.width = 24;
        this.height = 38;
    }

    update() {
        if (this.finished) return;

        // Управление
        if (this.isPlayer) {
            if (keys.up) {
                this.speed = Math.min(this.speed + this.acceleration, this.maxSpeed);
            }
            if (keys.down) {
                this.speed = Math.max(this.speed - this.acceleration * 0.7, -this.maxSpeed * 0.4);
            }
            if (!keys.up && !keys.down) {
                this.speed *= this.friction;
            }
            if (keys.left) {
                this.angle -= this.turnSpeed * (0.5 + Math.abs(this.speed) / 6);
            }
            if (keys.right) {
                this.angle += this.turnSpeed * (0.5 + Math.abs(this.speed) / 6);
            }
            if (Math.abs(this.speed) < 0.01) this.speed = 0;
        }

        // Движение
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        // Границы мира
        const margin = 60;
        if (this.x < margin) { this.x = margin; this.speed *= -0.3; }
        if (this.x > world.width - margin) { this.x = world.width - margin; this.speed *= -0.3; }
        if (this.y < margin) { this.y = margin; this.speed *= -0.3; }
        if (this.y > world.height - margin) { this.y = world.height - margin; this.speed *= -0.3; }
    }

    draw(ctx, camX, camY, camAngle) {
        // Относительные координаты (вид сзади)
        const dx = this.x - camX;
        const dy = this.y - camY;
        const rot = -camAngle;
        const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
        const ry = dx * Math.sin(rot) + dy * Math.cos(rot);

        // Упрощённая проекция (вид сзади — 3D эффект)
        const dist = ry;
        if (dist < 10) return; // слишком близко

        const scale = 400 / dist;
        const screenX = W/2 + rx * scale;
        const screenY = H/2 + 50 - 200 / dist;

        // Размер машины
        const w = this.width * scale * 1.2;
        const h = this.height * scale * 1.2;

        if (w < 2 || h < 2) return;
        if (screenX < -200 || screenX > W + 200) return;

        // Угол машины относительно камеры
        const carAngle = this.angle - camAngle;

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.rotate(carAngle);

        // Тень
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 20 * scale;

        // --- КУЗОВ МАШИНЫ (вид сзади) ---
        // Корпус
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.roundRect(-w/2, -h/2, w, h, 4);
        ctx.fill();

        // Стекло заднее
        ctx.fillStyle = 'rgba(100,200,255,0.15)';
        ctx.beginPath();
        ctx.roundRect(-w/2 + 4, -h/2 + 4, w - 8, h * 0.25, 2);
        ctx.fill();

        // Бампер
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.roundRect(-w/2 + 3, h/2 - 4, w - 6, 5, 2);
        ctx.fill();

        // Фары (красные сзади)
        ctx.fillStyle = '#ff2200';
        ctx.shadowColor = '#ff2200';
        ctx.shadowBlur = 12 * scale;
        ctx.beginPath();
        ctx.arc(-w/2 + 5, -h/2 + 6, 3 * scale, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(w/2 - 5, -h/2 + 6, 3 * scale, 0, Math.PI*2);
        ctx.fill();

        // Стоп-сигналы при торможении
        if (keys.down || this.speed < 0) {
            ctx.fillStyle = '#ff0000';
            ctx.shadowBlur = 25 * scale;
            ctx.beginPath();
            ctx.arc(-w/2 + 8, h/2 - 6, 4 * scale, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w/2 - 8, h/2 - 6, 4 * scale, 0, Math.PI*2);
            ctx.fill();
        }

        // Номер
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,215,0,0.08)';
        ctx.fillRect(-w/3, h/2 - 10, w * 0.6, 5);

        // Имя над машиной
        if (this.isPlayer) {
            ctx.fillStyle = '#ffd700';
            ctx.font = `${10 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(255,215,0,0.2)';
            ctx.fillText('🚗 ТЫ', 0, -h/2 - 8 * scale);
        }

        ctx.shadowBlur = 0;
        ctx.restore();
    }
}

// ----- СОЗДАНИЕ ИГРОКА И БОТОВ -----
let player;
let bots = [];

function initRace() {
    const startX = world.roadPoints[0].x + 30;
    const startY = world.roadPoints[0].y + 10;
    player = new Car(startX, startY, '#ff4444', 'Игрок');
    player.isPlayer = true;

    const botColors = ['#44ff44', '#4488ff', '#ffaa00', '#ff44ff', '#ff8800'];
    const botNames = ['Bot 1', 'Bot 2', 'Bot 3', 'Bot 4', 'Bot 5'];
    bots = [];
    for (let i = 0; i < 5; i++) {
        const idx = Math.floor(Math.random() * world.roadPoints.length);
        const p = world.roadPoints[idx];
        const bot = new Car(p.x + Math.random() * 40 - 20, p.y + Math.random() * 40 - 20, botColors[i % botColors.length], botNames[i % botNames.length]);
        bot.maxSpeed = 2.5 + Math.random() * 1.5;
        bot.angle = -Math.PI/2 + (Math.random() - 0.5) * 0.5;
        bots.push(bot);
    }

    player.lap = 0;
    player.checkpointId = 0;
    player.finished = false;
    bots.forEach(b => { b.lap = 0; b.checkpointId = 0; b.finished = false; });

    document.getElementById('lapDisplay').textContent = `1/${maxLaps}`;
    document.getElementById('timeDisplay').textContent = '0.0';
    raceTime = 0;
    startTime = Date.now();
}
initRace();

let raceTime = 0;
let startTime = Date.now();

// ----- ОБНОВЛЕНИЕ БОТОВ -----
function updateBots() {
    bots.forEach(bot => {
        if (bot.finished) return;

        // Найти ближайшую точку трассы
        let minDist = Infinity;
        let target = world.roadPoints[0];
        world.roadPoints.forEach(p => {
            const d = Math.hypot(p.x - bot.x, p.y - bot.y);
            if (d < minDist) { minDist = d; target = p; }
        });

        const dx = target.x - bot.x;
        const dy = target.y - bot.y;
        const targetAngle = Math.atan2(dy, dx);
        let diff = targetAngle - bot.angle;
        while (diff > Math.PI) diff -= Math.PI*2;
        while (diff < -Math.PI) diff += Math.PI*2;
        bot.angle += diff * 0.04;

        const dist = Math.hypot(dx, dy);
        if (dist > 40) {
            bot.speed = Math.min(bot.speed + 0.06, bot.maxSpeed);
        } else {
            bot.speed *= 0.97;
        }
        if (dist < 20) bot.speed *= 0.92;

        bot.x += Math.cos(bot.angle) * bot.speed;
        bot.y += Math.sin(bot.angle) * bot.speed;

        // Чекпоинты
        world.checkpoints.forEach(cp => {
            const d = Math.hypot(bot.x - cp.x, bot.y - cp.y);
            if (d < cp.radius && cp.index !== bot.checkpointId) {
                if (cp.index === 0 && bot.checkpointId > 5) {
                    bot.lap++;
                    if (bot.lap >= maxLaps) {
                        bot.finished = true;
                        bot.finishTime = raceTime;
                    }
                }
                bot.checkpointId = cp.index;
            }
        });
    });
}

// ----- ОБНОВЛЕНИЕ ИГРОКА -----
function updatePlayer() {
    if (player.finished) return;
    player.update();

    world.checkpoints.forEach(cp => {
        const d = Math.hypot(player.x - cp.x, player.y - cp.y);
        if (d < cp.radius && cp.index !== player.checkpointId) {
            if (cp.index === 0 && player.checkpointId > 5) {
                player.lap++;
                if (player.lap >= maxLaps) {
                    player.finished = true;
                    player.finishTime = raceTime;
                    playBeep(1000, 0.5, 0.2);
                    playBeep(1200, 0.3, 0.15);
                    setTimeout(() => playBeep(1500, 0.4, 0.15), 200);
                }
            }
            player.checkpointId = cp.index;
        }
    });
}

// ----- ОТРИСОВКА (ВИД СЗАДИ) -----
function draw() {
    ctx.clearRect(0, 0, W, H);

    // ----- РИСУЕМ МИР ОТНОСИТЕЛЬНО КАМЕРЫ (ИГРОК) -----
    const camX = player.x;
    const camY = player.y;
    const camAngle = player.angle;

    // Фон (небо/земля)
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a3a5a');
    grad.addColorStop(0.3, '#2a5a3a');
    grad.addColorStop(0.6, '#3a6a3a');
    grad.addColorStop(1, '#1a2a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // --- ДОРОГА (перспективная) ---
    // Рисуем дорогу в перспективе
    const roadSegments = 80;
    for (let i = 0; i < roadSegments; i++) {
        const t = i / roadSegments;
        const dist = 50 + t * 800;
        const worldDist = dist;

        // Находим точку на трассе впереди
        const lookAhead = 50 + t * 400;
        const targetIdx = findClosestRoadPoint(player.x + Math.cos(camAngle) * lookAhead, player.y + Math.sin(camAngle) * lookAhead);
        const p = world.roadPoints[targetIdx % world.roadPoints.length];

        // Проекция на экран
        const dx = p.x - camX;
        const dy = p.y - camY;
        const rot = -camAngle;
        const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
        const ry = dx * Math.sin(rot) + dy * Math.cos(rot);

        if (ry < 10) continue;

        const scale = 400 / ry;
        const screenX = W/2 + rx * scale;
        const screenY = H/2 + 50 - 200 / ry;

        // Ширина дороги в перспективе
        const roadWidth = 80 * scale;
        const halfW = roadWidth / 2;

        // Цвет дороги (дальше темнее)
        const brightness = 0.5 + 0.5 * (1 - t);
        const r = Math.floor(40 * brightness);
        const g = Math.floor(80 * brightness);
        const b = Math.floor(40 * brightness);

        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.beginPath();
        ctx.rect(screenX - halfW, screenY - 2, roadWidth, 4);
        ctx.fill();

        // Разметка (пунктир)
        if (i % 6 < 3) {
            ctx.fillStyle = `rgba(255,255,255,${0.3 * brightness})`;
            ctx.fillRect(screenX - 2, screenY - 1, 4, 3);
        }
    }

    // --- ДЕКОРАЦИИ в перспективе ---
    world.decorations.forEach(dec => {
        const dx = dec.x - camX;
        const dy = dec.y - camY;
        const rot = -camAngle;
        const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
        const ry = dx * Math.sin(rot) + dy * Math.cos(rot);
        if (ry < 20) return;

        const scale = 400 / ry;
        const screenX = W/2 + rx * scale;
        const screenY = H/2 + 50 - 200 / ry;
        const size = dec.size * scale * 0.8;

        if (screenX < -200 || screenX > W + 200 || size < 2) return;

        if (dec.type === 'palm') {
            // Пальма в перспективе
            ctx.fillStyle = '#4a2a1a';
            ctx.fillRect(screenX - size/8, screenY, size/4, size * 0.6);
            ctx.fillStyle = '#2a7a2a';
            ctx.beginPath();
            ctx.arc(screenX, screenY - size * 0.1, size * 0.35, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#3a9a3a';
            ctx.beginPath();
            ctx.arc(screenX - size * 0.2, screenY - size * 0.15, size * 0.25, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(screenX + size * 0.2, screenY - size * 0.15, size * 0.25, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#5a5a5a';
            ctx.beginPath();
            ctx.arc(screenX, screenY + size * 0.1, size * 0.3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#6a6a6a';
            ctx.beginPath();
            ctx.arc(screenX - size * 0.05, screenY + size * 0.05, size * 0.15, 0, Math.PI*2);
            ctx.fill();
        }
    });

    // --- МАШИНЫ БОТОВ (вид сзади) ---
    // Сортируем по расстоянию (дальние рисуем первыми)
    const sortedCars = [...bots, player].filter(c => !c.finished).sort((a, b) => {
        const da = Math.hypot(a.x - camX, a.y - camY);
        const db = Math.hypot(b.x - camX, b.y - camY);
        return db - da;
    });

    sortedCars.forEach(car => {
        car.draw(ctx, camX, camY, camAngle);
    });

    // --- ИНТЕРФЕЙС (спидометр) ---
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.roundRect(W - 140, H - 60, 120, 40, 10);
    ctx.fill();

    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    const speedKmh = Math.abs(player.speed * 30);
    ctx.fillText(`⚡ ${speedKmh.toFixed(0)} км/ч`, W - 80, H - 33);

    // Финиш
    if (player.finished) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(W/2 - 160, H/2 - 70, 320, 120);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 42px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🏆 ФИНИШ!', W/2, H/2);
        ctx.font = '20px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Время: ${raceTime.toFixed(1)}с`, W/2, H/2 + 45);
    }

    // Пауза
    if (gamePaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 48px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('⏸ ПАУЗА', W/2, H/2);
    }
}

function findClosestRoadPoint(x, y) {
    let min = Infinity, idx = 0;
    world.roadPoints.forEach((p, i) => {
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < min) { min = d; idx = i; }
    });
    return idx;
}

// ----- ОБНОВЛЕНИЕ -----
function update() {
    if (gamePaused || !gameRunning) return;
    const now = Date.now();
    raceTime = (now - startTime) / 1000;

    updatePlayer();
    updateBots();

    // UI
    document.getElementById('lapDisplay').textContent = `${Math.min(player.lap + 1, maxLaps)}/${maxLaps}`;
    document.getElementById('timeDisplay').textContent = raceTime.toFixed(1);

    const allCars = [player, ...bots].filter(c => !c.finished);
    const sorted = allCars.sort((a, b) => {
        if (a.lap !== b.lap) return b.lap - a.lap;
        return b.speed - a.speed;
    });
    const pos = sorted.indexOf(player) + 1;
    document.getElementById('positionDisplay').textContent = pos > 0 ? pos : '—';
}

// ----- ИГРОВОЙ ЦИКЛ -----
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================
// УПРАВЛЕНИЕ (КЛАВИАТУРА + ТАЧ)
// ============================================================

// --- Клавиатура ---
document.addEventListener('keydown', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': keys.up = true; e.preventDefault(); break;
        case 'ArrowDown': case 's': keys.down = true; e.preventDefault(); break;
        case 'ArrowLeft': case 'a': keys.left = true; e.preventDefault(); break;
        case 'ArrowRight': case 'd': keys.right = true; e.preventDefault(); break;
        case 'r': resetRace(); break;
        case 'p': togglePause(); break;
    }
});
document.addEventListener('keyup', (e) => {
    switch(e.key) {
        case 'ArrowUp': case 'w': keys.up = false; e.preventDefault(); break;
        case 'ArrowDown': case 's': keys.down = false; e.preventDefault(); break;
        case 'ArrowLeft': case 'a': keys.left = false; e.preventDefault(); break;
        case 'ArrowRight': case 'd': keys.right = false; e.preventDefault(); break;
    }
});

// --- Мобильное управление (тач) ---
function setupTouchButton(id, key) {
    const el = document.getElementById(id);
    if (!el) return;

    const start = (e) => {
        e.preventDefault();
        keys[key] = true;
        el.classList.add('pressed');
        initAudio();
    };
    const end = (e) => {
        e.preventDefault();
        keys[key] = false;
        el.classList.remove('pressed');
    };

    el.addEventListener('touchstart', start, { passive: false });
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', end);
}

setupTouchButton('btnLeft', 'left');
setupTouchButton('btnRight', 'right');
setupTouchButton('btnGas', 'up');
setupTouchButton('btnBrake', 'down');

document.getElementById('btnReset').addEventListener('click', resetRace);
document.getElementById('btnPause').addEventListener('click', togglePause);

// ----- ФУНКЦИИ -----
function resetRace() {
    initRace();
    startTime = Date.now();
    gameRunning = true;
    gamePaused = false;
    document.getElementById('btnPause').textContent = '⏸️';
    playBeep(600, 0.2, 0.1);
}

function togglePause() {
    gamePaused = !gamePaused;
    document.getElementById('btnPause').textContent = gamePaused ? '▶️' : '⏸️';
    if (!gamePaused) startTime = Date.now() - raceTime * 1000;
}

// ----- СТАРТ -----
initAudio();
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

gameLoop();

console.log('🏁 Beach Rumble: Turbo — Вид сзади!');
console.log('Управление: WASD/Стрелки, R — рестарт, P — пауза');
</script>
