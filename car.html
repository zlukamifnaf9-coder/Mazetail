<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏎️ Гоночный трек</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a16;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 10px;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #14142a, #1a1a32);
            border-radius: 20px;
            padding: 12px;
            border: 2px solid #ffd70033;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            max-width: 860px;
            width: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 600;
            background: #1a2a1a;
            border-radius: 12px;
            border: 2px solid #333366;
            touch-action: none;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px 2px 10px;
            color: #aaaadd;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .hud .speed {
            color: #ffd700;
            font-weight: bold;
            font-size: 18px;
        }
        .hud .laps {
            color: #66ddff;
            font-weight: bold;
        }
        .touch-controls {
            display: none;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            padding: 10px 5px 0 5px;
            max-width: 500px;
            margin: 0 auto;
        }
        .touch-btn {
            background: #222244;
            border: 2px solid #444477;
            border-radius: 14px;
            color: #fff;
            font-size: 24px;
            padding: 14px 0;
            text-align: center;
            touch-action: none;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #0a0a16;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-btn:active,
        .touch-btn.active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0a0a16;
            border-color: #ffd700;
            background: #2a2a5a;
        }
        .touch-btn.gas {
            background: #1a4a1a;
            border-color: #2a7a2a;
        }
        .touch-btn.gas:active,
        .touch-btn.gas.active {
            background: #2a7a2a;
            border-color: #4aaa4a;
        }
        .touch-btn.brake {
            background: #4a1a1a;
            border-color: #7a2a2a;
        }
        .touch-btn.brake:active,
        .touch-btn.brake.active {
            background: #7a2a2a;
            border-color: #aa4a4a;
        }
        .touch-btn.steer {
            background: #1a1a4a;
            border-color: #2a2a7a;
        }
        .touch-btn.steer:active,
        .touch-btn.steer.active {
            background: #2a2a7a;
            border-color: #4a4aaa;
        }
        .touch-btn .label {
            display: block;
            font-size: 9px;
            color: #8888bb;
            margin-top: 2px;
        }
        @media (max-width: 600px) {
            .touch-controls {
                display: grid;
            }
            .touch-btn {
                font-size: 20px;
                padding: 12px 0;
            }
            .hud {
                font-size: 11px;
            }
            .hud .speed {
                font-size: 16px;
            }
        }
        @media (min-width: 601px) {
            .touch-controls {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="hud">
            <div>🏁 Круг: <span class="laps" id="lapsDisplay">0</span></div>
            <div>⚡ <span class="speed" id="speedDisplay">0</span> км/ч</div>
            <div style="color:#555588;font-size:10px;">⬆️⬇️⬅️➡️</div>
        </div>
        <div class="touch-controls" id="touchControls">
            <div></div>
            <div class="touch-btn gas" id="btnGas">⬆️<span class="label">газ</span></div>
            <div></div>
            <div class="touch-btn steer" id="btnLeft">⬅️<span class="label">влево</span></div>
            <div class="touch-btn brake" id="btnBrake">⬇️<span class="label">тормоз</span></div>
            <div class="touch-btn steer" id="btnRight">➡️<span class="label">вправо</span></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🏎️  НАСТОЯЩИЙ ГОНОЧНЫЙ ТРЕК  —  НОВАЯ ТРАССА
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lapsDisplay = document.getElementById('lapsDisplay');
        const speedDisplay = document.getElementById('speedDisplay');

        const W = 800,
            H = 600;

        // ----- НОВАЯ ТРАССА (с изгибами, как настоящее кольцо) -----
        // Внешняя граница
        const outer = [
            { x: 80, y: 80 }, { x: 300, y: 50 }, { x: 500, y: 50 }, { x: 720, y: 80 },
            { x: 750, y: 200 }, { x: 730, y: 320 }, { x: 750, y: 440 }, { x: 720, y: 540 },
            { x: 500, y: 560 }, { x: 300, y: 560 }, { x: 80, y: 540 }, { x: 50, y: 440 },
            { x: 70, y: 320 }, { x: 50, y: 200 }
        ];

        // Внутренняя граница
        const inner = [
            { x: 160, y: 150 }, { x: 300, y: 130 }, { x: 500, y: 130 }, { x: 640, y: 150 },
            { x: 660, y: 220 }, { x: 640, y: 300 }, { x: 660, y: 380 }, { x: 640, y: 450 },
            { x: 500, y: 470 }, { x: 300, y: 470 }, { x: 160, y: 450 }, { x: 140, y: 380 },
            { x: 160, y: 300 }, { x: 140, y: 220 }
        ];

        // Чекпоинты (для подсчёта кругов)
        const checkpoints = [
            { x: 120, y: 120 }, { x: 400, y: 80 }, { x: 680, y: 120 },
            { x: 720, y: 280 }, { x: 680, y: 460 }, { x: 400, y: 520 },
            { x: 120, y: 460 }, { x: 80, y: 280 }
        ];

        // ----- МАШИНА -----
        const car = {
            x: 400,
            y: 300,
            angle: 0,
            speed: 0,
            width: 22,
            height: 13,
            lap: 0,
            checkpointIndex: 0,
            maxSpeed: 5.2,
            acceleration: 0.14,
            braking: 0.09,
            friction: 0.022,
            turnSpeed: 0.042,
            color1: '#ff3333',
            color2: '#ff6b35'
        };

        // ----- СОПЕРНИКИ (боты) -----
        let opponents = [];

        function initOpponents() {
            opponents = [
                { x: 200, y: 180, angle: 0.4, speed: 1.0, width: 20, height: 12, color: '#44aaff', lap: 0,
                    checkpointIndex: 0 },
                { x: 600, y: 400, angle: -0.2, speed: 0.9, width: 20, height: 12, color: '#ff66aa', lap: 0,
                    checkpointIndex: 0 },
                { x: 300, y: 480, angle: 0.7, speed: 0.8, width: 20, height: 12, color: '#66dd88', lap: 0,
                    checkpointIndex: 0 },
            ];
        }
        initOpponents();

        // ----- ФИЗИКА -----
        function isInsideTrack(x, y) {
            return isInsidePolygon(x, y, outer) && !isInsidePolygon(x, y, inner);
        }

        function isInsidePolygon(px, py, polygon) {
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i].x,
                    yi = polygon[i].y;
                const xj = polygon[j].x,
                    yj = polygon[j].y;
                const intersect = ((yi > py) !== (yj > py)) &&
                    (px < (xj - xi) * (py - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

        function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

        function moveCar(entity) {
            const dx = Math.cos(entity.angle) * entity.speed;
            const dy = Math.sin(entity.angle) * entity.speed;
            const nx = entity.x + dx;
            const ny = entity.y + dy;

            const hw = entity.width / 2,
                hh = entity.height / 2;
            const corners = [
                { x: nx + hw, y: ny + hh }, { x: nx - hw, y: ny + hh },
                { x: nx + hw, y: ny - hh }, { x: nx - hw, y: ny - hh }
            ];

            let onTrack = true;
            for (const c of corners) {
                if (!isInsideTrack(c.x, c.y)) { onTrack = false; break; }
            }

            if (onTrack) { entity.x = nx;
                entity.y = ny; } else {
                entity.speed *= -0.3;
                entity.x -= dx * 0.4;
                entity.y -= dy * 0.4;
            }
        }

        function checkCheckpoints(entity) {
            const next = (entity.checkpointIndex + 1) % checkpoints.length;
            const p = checkpoints[next];
            if (dist(entity, p) < 28) {
                if (next === 0 && entity.checkpointIndex === checkpoints.length - 1) entity.lap++;
                entity.checkpointIndex = next;
            }
        }

        // ----- ОБНОВЛЕНИЕ -----
        const keys = { up: false, down: false, left: false, right: false };

        function updatePlayer() {
            if (keys.up) car.speed = Math.min(car.speed + car.acceleration, car.maxSpeed);
            else if (keys.down) car.speed = Math.max(car.speed - car.braking, -car.maxSpeed * 0.3);
            else {
                if (Math.abs(car.speed) < car.friction) car.speed = 0;
                else car.speed -= Math.sign(car.speed) * car.friction;
            }

            if (Math.abs(car.speed) > 0.1) {
                const tf = clamp(car.speed / car.maxSpeed, 0.2, 1);
                if (keys.left) car.angle -= car.turnSpeed * tf;
                if (keys.right) car.angle += car.turnSpeed * tf;
            }

            moveCar(car);
            checkCheckpoints(car);
        }

        function updateOpponents() {
            for (const opp of opponents) {
                const next = (opp.checkpointIndex + 1) % checkpoints.length;
                const p = checkpoints[next];
                const dx = p.x - opp.x,
                    dy = p.y - opp.y;
                let target = Math.atan2(dy, dx);
                let diff = target - opp.angle;
                while (diff > Math.PI) diff -= 2 * Math.PI;
                while (diff < -Math.PI) diff += 2 * Math.PI;
                opp.angle += diff * 0.025;
                opp.speed = 0.9 + Math.random() * 0.3;
                opp.angle += (Math.random() - 0.5) * 0.008;
                moveCar(opp);
                checkCheckpoints(opp);
            }
        }

        // ----- ОТРИСОВКА -----
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Фон
            const grad = ctx.createRadialGradient(400, 300, 100, 400, 300, 500);
            grad.addColorStop(0, '#1a3a1a');
            grad.addColorStop(1, '#0a1a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Трасса
            ctx.beginPath();
            ctx.moveTo(outer[0].x, outer[0].y);
            for (let i = 1; i < outer.length; i++) ctx.lineTo(outer[i].x, outer[i].y);
            ctx.closePath();
            ctx.moveTo(inner[0].x, inner[0].y);
            for (let i = 1; i < inner.length; i++) ctx.lineTo(inner[i].x, inner[i].y);
            ctx.closePath();
            ctx.fillStyle = '#2a4a2a';
            ctx.fill();
            ctx.strokeStyle = '#4a7a4a';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Бордюры (пунктир)
            ctx.setLineDash([12, 14]);
            ctx.strokeStyle = '#ffd70055';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(outer[0].x, outer[0].y);
            for (let i = 1; i < outer.length; i++) ctx.lineTo(outer[i].x, outer[i].y);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(inner[0].x, inner[0].y);
            for (let i = 1; i < inner.length; i++) ctx.lineTo(inner[i].x, inner[i].y);
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);

            // Старт/финиш
            ctx.fillStyle = '#ff444466';
            ctx.fillRect(370, 55, 60, 24);
            ctx.fillStyle = '#ffffffcc';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('СТАРТ/ФИНИШ', 400, 73);

            // Чекпоинты
            for (let i = 0; i < checkpoints.length; i++) {
                const p = checkpoints[i];
                const active = i === (car.checkpointIndex + 1) % checkpoints.length;
                ctx.fillStyle = active ? '#ffd70099' : '#ffffff33';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
                ctx.fill();
                if (active) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = '16px Arial';
                    ctx.fillText('🚩', p.x - 10, p.y - 14);
                }
            }

            // Боты
            for (const opp of opponents) {
                drawCar(opp.x, opp.y, opp.angle, opp.width, opp.height, opp.color, '#fff');
            }

            // Игрок
            drawCar(car.x, car.y, car.angle, car.width, car.height, car.color1, car.color2);

            // Эффект скорости
            if (Math.abs(car.speed) > 2) {
                const alpha = Math.min((Math.abs(car.speed) - 2) / 3, 0.5);
                ctx.fillStyle = `rgba(255,200,50,${alpha * 0.08})`;
                ctx.beginPath();
                ctx.arc(car.x, car.y, 45 + Math.abs(car.speed) * 6, 0, Math.PI * 2);
                ctx.fill();
            }

            speedDisplay.textContent = Math.round(Math.abs(car.speed) * 40);
            lapsDisplay.textContent = car.lap;
        }

        function drawCar(x, y, angle, w, h, c1, c2) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.shadowColor = 'rgba(255,215,0,0.15)';
            ctx.shadowBlur = 12;
            const g = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
            g.addColorStop(0, c1);
            g.addColorStop(0.5, c2 || c1);
            g.addColorStop(1, c1);
            ctx.fillStyle = g;
            ctx.shadowColor = 'rgba(255,100,0,0.25)';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, 4);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(100,200,255,0.2)';
            ctx.beginPath();
            ctx.roundRect(-w / 2 + 3, -h / 2 + 2, w * 0.28, h - 4, 2);
            ctx.fill();
            ctx.fillStyle = '#ffff88';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffff44';
            ctx.beginPath();
            ctx.arc(w / 2 - 2, -h / 2 + 3, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(w / 2 - 2, h / 2 - 3, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff2222';
            ctx.beginPath();
            ctx.arc(-w / 2 + 2, -h / 2 + 3, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-w / 2 + 2, h / 2 - 3, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(-w / 2 - 2, -h / 2 - 1, 3, 5);
            ctx.fillRect(w / 2 - 1, -h / 2 - 1, 3, 5);
            ctx.fillRect(-w / 2 - 2, h / 2 - 4, 3, 5);
            ctx.fillRect(w / 2 - 1, h / 2 - 4, 3, 5);
            ctx.restore();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        // ----- УПРАВЛЕНИЕ -----
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') { keys.up = true;
                e.preventDefault(); }
            if (e.key === 'ArrowDown') { keys.down = true;
                e.preventDefault(); }
            if (e.key === 'ArrowLeft') { keys.left = true;
                e.preventDefault(); }
            if (e.key === 'ArrowRight') { keys.right = true;
                e.preventDefault(); }
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowUp') { keys.up = false;
                e.preventDefault(); }
            if (e.key === 'ArrowDown') { keys.down = false;
                e.preventDefault(); }
            if (e.key === 'ArrowLeft') { keys.left = false;
                e.preventDefault(); }
            if (e.key === 'ArrowRight') { keys.right = false;
                e.preventDefault(); }
        });

        function setupTouch(id, key) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = e => { e.preventDefault();
                keys[key] = true;
                el.classList.add('active'); };
            const end = e => { e.preventDefault();
                keys[key] = false;
                el.classList.remove('active'); };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('touchcancel', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
        }
        setupTouch('btnGas', 'up');
        setupTouch('btnBrake', 'down');
        setupTouch('btnLeft', 'left');
        setupTouch('btnRight', 'right');

        // Старт
        car.x = 400;
        car.y = 100;
        car.angle = Math.PI / 2;

        function loop() {
            updatePlayer();
            updateOpponents();
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        console.log('🏎️  НАСТОЯЩИЙ ГОНОЧНЫЙ ТРЕК!');
        console.log('📍 Трасса с 8 поворотами');
        console.log('🤖 3 соперника');
        console.log('📱 Тач-кнопки или стрелки');
    </script>
</body>
</html>
