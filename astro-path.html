<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Астро-путь — SpaceEngine стиль</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #000005;
    --panel: rgba(10, 10, 20, 0.92);
    --panel-light: rgba(20, 20, 40, 0.85);
    --border: #1a3a6a;
    --border-bright: #4a7abf;
    --text: #c8d4e8;
    --text-dim: #6a7a9a;
    --accent: #4a9eff;
    --accent-bright: #7abfff;
    --warning: #ffaa44;
    --danger: #ff5544;
    --success: #44dd88;
  }

  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'Courier New', monospace;
    user-select: none;
    font-size: 12px;
  }

  /* === ЗВЁЗДНОЕ ПОЛЕ === */
  #space {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    cursor: grab;
  }
  #space:active { cursor: grabbing; }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    pointer-events: none;
  }

  /* === КОНТЕЙНЕР ВСЕЛЕННОЙ === */
  #world {
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    transform: translate(-50%, -50%) scale(1);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 4000px; height: 4000px;
    pointer-events: none;
  }
  #world > * { pointer-events: auto; }

  /* === ЗВЕЗДА === */
  .sun {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffe680 30%, #ffaa33 60%, #ff6600 100%);
    box-shadow: 0 0 80px #ffaa33, 0 0 200px #ff8800, 0 0 400px rgba(255, 136, 0, 0.4);
    cursor: pointer;
    transition: transform 0.3s;
    z-index: 100;
  }
  .sun:hover { transform: translate(-50%, -50%) scale(1.1); }

  /* === ОРБИТЫ === */
  .orbit {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(74, 158, 255, 0.08);
    border-radius: 50%;
    pointer-events: none;
  }

  /* === ПЛАНЕТЫ === */
  .planet {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 10;
  }
  .planet:hover { transform: scale(1.15); z-index: 50; }

  .planet-body {
    width: 100%; height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    box-shadow: inset -12px -12px 24px rgba(0,0,0,0.85), inset 4px 4px 12px rgba(255,255,255,0.15);
  }
  .planet-body::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
  }

  .planet-label {
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--text-dim);
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 4px black;
    letter-spacing: 0.5px;
  }

  /* === ВЕРХНЯЯ ПАНЕЛЬ === */
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 32px;
    background: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.6));
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    z-index: 1000;
    font-size: 11px;
    gap: 12px;
  }
  .top-bar .logo {
    color: var(--accent-bright);
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 8px var(--accent);
  }
  .top-bar .coords {
    color: var(--text-dim);
    font-size: 10px;
  }
  .top-bar .status {
    margin-left: auto;
    color: var(--success);
    font-size: 10px;
  }

  /* === ЛЕВАЯ ПАНЕЛЬ (ОБЪЕКТЫ) === */
  .left-panel {
    position: fixed;
    top: 32px; left: 0;
    width: 220px;
    bottom: 60px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    z-index: 900;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s;
  }
  .left-panel.hidden { transform: translateX(-100%); }

  .panel-section {
    border-bottom: 1px solid var(--border);
    padding: 8px;
  }
  .panel-section h3 {
    margin: 0 0 6px;
    font-size: 10px;
    color: var(--accent-bright);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: normal;
  }

  .search-input {
    width: 100%;
    padding: 5px 8px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 11px;
    border-radius: 2px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(74,158,255,0.3);
  }

  .objects-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .object-item {
    padding: 6px 10px;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
    border-left: 2px solid transparent;
  }
  .object-item:hover {
    background: rgba(74,158,255,0.1);
    border-left-color: var(--accent);
  }
  .object-item.active {
    background: rgba(74,158,255,0.2);
    border-left-color: var(--accent-bright);
  }
  .object-item .icon {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  .object-item .name {
    flex: 1;
    color: var(--text);
  }
  .object-item .type {
    font-size: 9px;
    color: var(--text-dim);
  }

  /* === ПРАВАЯ ПАНЕЛЬ (ИНФО) === */
  .right-panel {
    position: fixed;
    top: 32px; right: 0;
    width: 280px;
    bottom: 60px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    z-index: 900;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s;
    overflow-y: auto;
  }
  .right-panel.hidden { transform: translateX(100%); }

  .info-header {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-light);
  }
  .info-header .name {
    font-size: 16px;
    color: var(--accent-bright);
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-shadow: 0 0 10px var(--accent);
  }
  .info-header .type {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .info-header .lang {
    font-size: 10px;
    color: var(--accent);
    margin-top: 4px;
    font-style: italic;
  }

  .info-body {
    padding: 12px;
    font-size: 11px;
    line-height: 1.5;
  }
  .info-body p {
    margin: 0 0 10px;
    color: var(--text);
  }

  .info-stats {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-bottom: 12px;
  }
  .info-stat {
    display: flex;
    justify-content: space-between;
    padding: 4px 6px;
    background: rgba(0,0,0,0.3);
    border-left: 2px solid var(--accent);
    font-size: 10px;
  }
  .info-stat .label {
    color: var(--text-dim);
  }
  .info-stat .value {
    color: var(--text);
    font-weight: bold;
  }

  .info-actions {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .action-btn {
    padding: 8px 12px;
    background: rgba(74,158,255,0.1);
    border: 1px solid var(--accent);
    color: var(--accent-bright);
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    text-align: left;
    letter-spacing: 0.5px;
  }
  .action-btn:hover {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 12px var(--accent);
  }

  /* === НИЖНЯЯ ПАНЕЛЬ (УПРАВЛЕНИЕ) === */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(0deg, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
    border-top: 1px solid var(--border);
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
    overflow-x: auto;
  }

  .tool-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 9px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    white-space: nowrap;
    min-width: 50px;
  }
  .tool-btn .icon {
    font-size: 16px;
  }
  .tool-btn:hover {
    color: var(--accent-bright);
    border-color: var(--accent);
    background: rgba(74,158,255,0.1);
  }
  .tool-btn.active {
    color: var(--accent-bright);
    border-color: var(--accent-bright);
    background: rgba(74,158,255,0.2);
  }

  .tool-sep {
    width: 1px;
    height: 30px;
    background: var(--border);
    margin: 0 5px;
    flex-shrink: 0;
  }

  /* === HUD ВИДА === */
  .view-hud {
    position: fixed;
    top: 50px;
    right: 300px;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    padding: 8px 12px;
    font-size: 10px;
    color: var(--text-dim);
    z-index: 800;
    border-radius: 2px;
    display: none;
  }
  .view-hud.show { display: block; }
  .view-hud .line {
    margin: 2px 0;
  }
  .view-hud .val {
    color: var(--accent-bright);
    font-weight: bold;
  }

  /* === ПЕРВОЕ ЛИЦО === */
  .first-person {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    overflow: hidden;
  }
  .first-person.show { display: block; }

  .fp-sky {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 70%;
    transition: background 1s;
  }
  .fp-ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 30%;
    transition: background 1s;
  }
  .fp-star {
    position: absolute;
    border-radius: 50%;
    transition: all 1s;
    filter: blur(1px);
  }
  .fp-object {
    position: absolute;
    font-size: 42px;
    cursor: pointer;
    transition: transform 0.2s;
    filter: drop-shadow(0 0 8px currentColor);
  }
  .fp-object:hover { transform: scale(1.2) translateY(-5px); }

  .fp-player {
    position: absolute;
    bottom: 30px;
    font-size: 30px;
    transition: left 0.3s;
    z-index: 10;
    filter: drop-shadow(0 0 6px var(--accent));
  }

  .fp-hud {
    position: absolute;
    top: 50px; left: 15px;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 2px;
    font-size: 10px;
    color: var(--text);
    z-index: 20;
    max-width: 220px;
    line-height: 1.6;
  }
  .fp-hud .title {
    color: var(--accent-bright);
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .fp-hud .stat {
    color: var(--text-dim);
    font-size: 10px;
  }
  .fp-hud .stat b {
    color: var(--text);
  }

  .fp-exit {
    position: absolute;
    top: 50px; right: 15px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.8);
    color: var(--accent-bright);
    border: 1px solid var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    z-index: 20;
    border-radius: 2px;
    letter-spacing: 0.5px;
  }
  .fp-exit:hover { background: var(--accent); color: #000; }

  .fp-controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 20;
  }
  .fp-btn {
    padding: 10px 16px;
    background: rgba(0,0,0,0.8);
    color: var(--accent-bright);
    border: 1px solid var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    border-radius: 2px;
    transition: all 0.15s;
  }
  .fp-btn:hover { background: var(--accent); color: #000; }

  /* === МЕНЮ === */
  .menu {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, rgba(10,20,40,0.95), rgba(0,0,5,0.98));
    z-index: 3000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .menu.hide { display: none; }

  .menu-title {
    font-size: 32px;
    color: var(--accent-bright);
    letter-spacing: 6px;
    text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
    margin-bottom: 6px;
    font-weight: bold;
  }
  .menu-sub {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
    margin-bottom: 30px;
    text-transform: uppercase;
  }
  .menu-btn {
    padding: 10px 40px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent-bright);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    margin: 4px;
    min-width: 280px;
    text-align: center;
    text-transform: uppercase;
  }
  .menu-btn:hover {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 20px var(--accent);
  }
  .menu-footer {
    position: absolute;
    bottom: 20px;
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* === TOAST === */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(200px);
    background: rgba(0,0,0,0.9);
    color: var(--accent-bright);
    padding: 10px 24px;
    border: 1px solid var(--accent);
    border-radius: 2px;
    font-size: 11px;
    z-index: 9999;
    transition: transform 0.3s;
    pointer-events: none;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* === СКРОЛЛБАР === */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* === МОБИЛЬНАЯ ВЕРСИЯ === */
  @media (max-width: 768px) {
    .left-panel, .right-panel { width: 100%; }
    .left-panel { transform: translateX(-100%); }
    .right-panel { transform: translateX(100%); }
    .left-panel.open { transform: translateX(0); }
    .right-panel.open { transform: translateX(0); }
    .view-hud { right: 15px; }
    .menu-title { font-size: 22px; letter-spacing: 3px; }
    .menu-btn { font-size: 11px; min-width: 220px; padding: 8px 20px; }
  }
</style>
</head>
<body>

<!-- === МЕНЮ === -->
<div class="menu" id="mainMenu">
  <div class="menu-title">АСТРО-ПУТЬ</div>
  <div class="menu-sub">Вселенная Румэджа · v1.0</div>
  <button class="menu-btn" onclick="startMode('explore')">▶ Свободный полёт</button>
  <button class="menu-btn" onclick="startMode('creator')">⚙ Режим Творца</button>
  <button class="menu-btn" onclick="startMode('about')">? О программе</button>
  <div class="menu-footer">Сунная система · 7 планет · 40+ спутников</div>
</div>

<!-- === КОСМОС === -->
<div id="space" style="display:none;">
  <div id="world"></div>
</div>

<!-- === ВЕРХНЯЯ ПАНЕЛЬ === -->
<div class="top-bar" id="topBar" style="display:none;">
  <div class="logo">АСТРО-ПУТЬ</div>
  <div class="coords" id="coordsDisplay">Zoom: 1.00x · X: 0 · Y: 0</div>
  <div class="status" id="statusDisplay">● ONLINE</div>
</div>

<!-- === ЛЕВАЯ ПАНЕЛЬ === -->
<div class="left-panel" id="leftPanel" style="display:none;">
  <div class="panel-section">
    <h3>Поиск объектов</h3>
    <input type="text" class="search-input" id="searchInput" placeholder="Введите название...">
  </div>
  <div class="panel-section">
    <h3>Объекты системы</h3>
  </div>
  <div class="objects-list" id="objectsList"></div>
</div>

<!-- === ПРАВАЯ ПАНЕЛЬ === -->
<div class="right-panel hidden" id="rightPanel" style="display:none;">
  <div class="info-header">
    <div class="name" id="infoName">—</div>
    <div class="type" id="infoType">—</div>
    <div class="lang" id="infoLang"></div>
  </div>
  <div class="info-body">
    <p id="infoDesc"></p>
    <div class="info-stats" id="infoStats"></div>
  </div>
  <div class="info-actions">
    <button class="action-btn" id="btnGoTo">🎯 Перейти к объекту</button>
    <button class="action-btn" id="btnWalk">🚶 Прогуляться</button>
    <button class="action-btn" id="btnOrbit">🛰 Выйти на орбиту</button>
  </div>
</div>

<!-- === НИЖНЯЯ ПАНЕЛЬ === -->
<div class="bottom-bar" id="bottomBar" style="display:none;">
  <button class="tool-btn" id="toolExplore">
    <span class="icon">🌌</span>
    <span>Полёт</span>
  </button>
  <button class="tool-btn" id="toolFocus">
    <span class="icon">🎯</span>
    <span>Фокус</span>
  </button>
  <button class="tool-btn" id="toolOrbit">
    <span class="icon">🛰</span>
    <span>Орбита</span>
  </button>
  <button class="tool-btn" id="toolSurface">
    <span class="icon">🚶</span>
    <span>Поверхность</span>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="toolZoomIn">
    <span class="icon">＋</span>
    <span>Зум+</span>
  </button>
  <button class="tool-btn" id="toolZoomOut">
    <span class="icon">－</span>
    <span>Зум−</span>
  </button>
  <button class="tool-btn" id="toolReset">
    <span class="icon">⟲</span>
    <span>Сброс</span>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="toolCreator">
    <span class="icon">⚙</span>
    <span>Творец</span>
  </button>
  <button class="tool-btn" id="toolMenu">
    <span class="icon">☰</span>
    <span>Меню</span>
  </button>
</div>

<!-- === HUD ВИДА === -->
<div class="view-hud" id="viewHud">
  <div class="line">Цель: <span class="val" id="hudTarget">—</span></div>
  <div class="line">Расстояние: <span class="val" id="hudDist">—</span></div>
  <div class="line">Скорость: <span class="val" id="hudSpeed">0.00 c</span></div>
</div>

<!-- === РЕЖИМ ТВОРЦА === -->
<div class="left-panel" id="creatorPanel" style="display:none; top: 32px; width: 260px; z-index: 950;">
  <div class="panel-section">
    <h3>⚙ Режим Творца</h3>
    <p style="font-size:10px; color:var(--text-dim); margin:6px 0;">
      Меняй планеты местами и смотри последствия.
    </p>
  </div>
  <div class="panel-section">
    <h3>Планета 1</h3>
    <select class="search-input" id="swapPlanet1"></select>
  </div>
  <div class="panel-section">
    <h3>Планета 2</h3>
    <select class="search-input" id="swapPlanet2"></select>
  </div>
  <div class="panel-section">
    <button class="action-btn" id="swapBtn" style="width:100%;">🔄 Поменять местами</button>
    <button class="action-btn" id="resetUniverseBtn" style="width:100%; margin-top:6px; border-color:var(--danger); color:var(--danger);">↺ Сбросить вселенную</button>
  </div>
</div>

<!-- === ПЕРВОЕ ЛИЦО === -->
<div class="first-person" id="firstPerson">
  <div class="fp-sky" id="fpSky"></div>
  <div class="fp-ground" id="fpGround"></div>
  <div class="fp-star" id="fpStar"></div>

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur = 0.08, type = 'sine', vol = 0.06) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
const sfxClick = () => beep(1200, 0.04, 'sine', 0.04);
const sfxSelect = () => { beep(800, 0.06); setTimeout(() => beep(1200, 0.08), 50); };
const sfxZoom = () => beep(600, 0.05, 'sine', 0.03);

}

    // Планета

    planet.style.width = p.size + 'px';
    planet.style.height = p.size + 'px';
    planet.dataset.id = p.id;
    planet.dataset.pos = i;

    // Тело планеты
    const body = document.createElement('div');
    body.className = 'planet-body';
    body.style.background = `radial-gradient(circle at 30% 30%, ${p.color}, ${p.color}44)`;
    planet.appendChild(body);

    // Подпись
    const label = document.createElement('div');
    label.className = 'planet-label';
    label.textContent = p.name;
    planet.appendChild(label);

    // Позиция
    const angle = (i * 137.5) * Math.PI / 180;
    planet.style.left = `calc(50% + ${Math.cos(angle) * p.dist}px - ${p.size/2}px)`;
    planet.style.top = `calc(50% + ${Math.sin(angle) * p.dist}px - ${p.size/2}px)`;

    planet.onclick = (e) => {
      e.stopPropagation();
      initAudio(); sfxSelect();
      selectObject(p, p.id);
    };

    world.appendChild(planet);
  });
}

function selectObject(obj, id) {
  selectedObject = obj;

  // Подсветка в списке
  document.querySelectorAll('.object-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  // Инфо-панель
  document.getElementById('infoName').textContent = obj.name;
  document.getElementById('infoType').textContent = obj.type;
  document.getElementById('infoLang').textContent = obj.lang || '';
  document.getElementById('infoDesc').textContent = obj.desc;

  const stats = document.getElementById('infoStats');
  stats.innerHTML = '';
  Object.entries(obj.stats || {}).forEach(([k, v]) => {
    stats.innerHTML += `
      <div class="info-stat">
        <span class="label">${k}</span>
        <span class="value">${v}</span>
      </div>
    `;
  });

  document.getElementById('rightPanel').classList.remove('hidden');
  document.getElementById('viewHud').classList.add('show');
  document.getElementById('hudTarget').textContent = obj.name;
  document.getElementById('hudDist').textContent = (Math.random() * 10 + 1).toFixed(2) + ' а.е.';

  beep(900, 0.05);
}

function focusObject(id, targetZoom = 2) {
  let el;
  if (id === 'sun') el = document.querySelector('.sun');
  else el = document.querySelector(`.planet[data-id="${id}"]`);
  if (!el) return;

  const rect = el.getBoundingClientRect();
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const dx = cx - (rect.left + rect.width / 2);
  const dy = cy - (rect.top + rect.height / 2);

  panX += dx; panY += dy;
  zoom = targetZoom;
  applyTransform();
  updateCoords();
  showToast(`🎯 Переход к ${id}`);
}

// ============================================
// === ЗУМ И ПАН ===
// ============================================
function applyTransform() {
  world.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom})`;
  updateCoords();
}
function updateCoords() {
  document.getElementById('coordsDisplay').textContent =
    `Zoom: ${zoom.toFixed(2)}x · X: ${panX.toFixed(0)} · Y: ${panY.toFixed(0)}`;
}

const space = document.getElementById('space');
space.addEventListener('mousedown', (e) => {
  if (e.target.closest('.planet') || e.target.closest('.sun')) return;
  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; });

space.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.05, Math.min(zoom * delta, 20));
  applyTransform();
  sfxZoom();
}, { passive: false });

// Тач
let touchDist = 0;
space.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  } else if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX - panX;
    dragStartY = e.touches[0].clientY - panY;
  }
});
space.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    zoom = Math.max(0.05, Math.min(zoom * (d / touchDist), 20));
    touchDist = d;
    applyTransform();
  } else if (isDragging) {
    panX = e.touches[0].clientX - dragStartX;
    panY = e.touches[0].clientY - dragStartY;
    applyTransform();
  }
}, { passive: false });
space.addEventListener('touchend', () => { isDragging = false; });

    obj.textContent = o.icon;

      e.stopPropagation();
      initAudio(); sfxClick();
      showToast(`${o.name}: ${o.desc}`);
    };
    objs.appendChild(obj);
  });

  document.getElementById('fpPlayer').style.left = fpPlayerX + '%';
  document.getElementById('fpHud').innerHTML = `
    <div class="title">${p.name}</div>
    <div class="stat">Тип: <b>${p.type}</b></div>
    <div class="stat">Темп: <b>${p.stats["Температура"]}</b></div>
    <div class="stat">Атм.: <b>${p.stats["Атмосфера"]}</b></div>
  `;
}

function exitFirstPerson() {

  document.getElementById('firstPerson').classList.remove('show');

function fpMove(dir) {
  initAudio(); sfxClick();
  const player = document.getElementById('fpPlayer');
  if (dir === 'left') fpPlayerX = Math.max(5, fpPlayerX - 8);
  else if (dir === 'right') fpPlayerX = Math.min(95, fpPlayerX + 8);
  else if (dir === 'forward') {
    player.style.transform = 'scale(1.2)';
    setTimeout(() => player.style.transform = 'scale(1)', 200);
  }
  player.style.left = fpPlayerX + '%';
}

// ============================================
function openCreator() {
  const sel1 = document.getElementById('swapPlanet1');
  const sel2 = document.getElementById('swapPlanet2');
  sel1.innerHTML = '';
  sel2.innerHTML = '';
  currentPlanets.forEach((p, i) => {
    sel1.innerHTML += `<option value="${i}">${p.name} (поз. ${p.pos})</option>`;
    sel2.innerHTML += `<option value="${i}">${p.name} (поз. ${p.pos})</option>`;
  });
  sel2.selectedIndex = 1;
}

document.getElementById('swapBtn').onclick = () => {
  initAudio(); sfxClick();
  const i1 = parseInt(document.getElementById('swapPlanet1').value);
  const i2 = parseInt(document.getElementById('swapPlanet2').value);
  if (i1 === i2) { showToast('Выбери разные планеты'); return; }

  const temp = {...currentPlanets[i1]};
  currentPlanets[i1] = {...currentPlanets[i2]};
  currentPlanets[i2] = temp;

  const tmpPos = currentPlanets[i1].pos;
  currentPlanets[i1].pos = currentPlanets[i2].pos;
  currentPlanets[i2].pos = tmpPos;

  buildUniverse();
  buildObjectsList();
  openCreator();

  const p1 = currentPlanets[i1];
  const p2 = currentPlanets[i2];
  let result = '';
  if ((p1.type.includes("Обитаемая") && p1.pos > 3) || (p2.type.includes("Обитаемая") && p2.pos > 3)) {
    result = '⚠ Жизнь погибнет!';
  } else if (p1.pos === 1 || p2.pos === 1) {
    result = '🔥 Планета сгорит!';
  } else {
    result = '✅ Система стабильна';
  }
  showToast(result);
};

document.getElementById('resetUniverseBtn').onclick = () => {
  initAudio(); sfxClick();
  currentPlanets = JSON.parse(JSON.stringify(planetsData));
  buildUniverse();
  buildObjectsList();
  openCreator();
  showToast('Вселенная сброшена');
};

// ============================================
// === ЗАПУСК ===
// ============================================
function startMode(mode) {
  initAudio(); sfxSelect();
  document.getElementById('mainMenu').classList.add('hide');

  if (mode === 'about') {
    alert("АСТРО-ПУТЬ v1.0\n\nСимулятор вселенной Румэджа в стиле SpaceEngine.\n\n• Свободный полёт по Сунной системе\n• 7 планет + звезда Сун\n• Режим Творца — меняй планеты местами\n• Высадка на поверхность\n\nУправление: мышь/палец — панорама, колесо — зум.");
    document.getElementById('mainMenu').classList.remove('hide');
    return;
  }

  document.getElementById('space').style.display = 'block';
  document.getElementById('topBar').style.display = 'flex';
  document.getElementById('leftPanel').style.display = 'flex';
  document.getElementById('rightPanel').style.display = 'flex';
  document.getElementById('bottomBar').style.display = 'flex';

  generateStars();
  buildObjectsList();

  if (mode === 'creator') {
    document.getElementById('creatorPanel').style.display = 'block';
    openCreator();
    showToast('Режим Творца');
  } else {
    showToast('Свободный полёт');
  }

  setTimeout(() => applyTransform(), 100);
}

// ============================================
// === TOAST ===
// ============================================
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================
// === АНИМАЦИЯ ОРБИТ ===
// ============================================
function animate() {
  const t = Date.now() / 1000;
  currentPlanets.forEach((p, i) => {
    const el = document.querySelector(`.planet[data-id="${p.id}"]`);
    if (!el) return;
    const speed = 0.02 / Math.sqrt(p.dist / 200);
    const angle = (i * 137.5 + t * speed * 20) * Math.PI / 180;
    const x = Math.cos(angle) * p.dist;
    const y = Math.sin(angle) * p.dist;
    el.style.left = `calc(50% + ${x}px - ${p.size/2}px)`;
    el.style.top = `calc(50% + ${y}px - ${p.size/2}px)`;
  });
  requestAnimationFrame(animate);
}
animate();

// Стартовый трансформ
applyTransform();
</script>
