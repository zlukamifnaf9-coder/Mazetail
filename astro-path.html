<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Астро-путь — Вселенная Румэджа</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #050510;
    --panel: rgba(20, 15, 40, 0.95);
    --border: #6a3fbf;
    --text: #d4d4e0;
    --text-dim: #9a8ac0;
    --accent: #b28bff;
    --gold: #f4e4a0;
    --red: #f4a8a8;
    --green: #a8e2a8;
    --blue: #a8d5e2;
    --orange: #f4a860;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', serif;
    user-select: none;
  }

  /* === КОСМИЧЕСКОЕ ПОЛОТНО === */
  #universe {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    cursor: grab;
    perspective: 1200px;
  }
  #universe:active { cursor: grabbing; }

  /* Звёзды на фоне */
  .star-field {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 4px white;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* === КОНТЕЙНЕР С ИЗОБРАЖЕНИЕМ === */
  #world {
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: 0 0;
    transform: translate(-50%, -50%) scale(1) rotate(0deg);
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    width: 2000px;
    height: 2000px;
    pointer-events: none;
  }
  #world > * { pointer-events: auto; }

  /* === ЗВЕЗДА (СУН) === */
  .star-system {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .sun-core {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, #ffd700, #ff8c00);
    box-shadow: 0 0 60px #ffd700, 0 0 120px #ff8c00;
    cursor: pointer;
    transition: transform 0.3s;
    position: relative;
    z-index: 10;
  }
  .sun-core:hover { transform: scale(1.15); }

  /* === ОРБИТЫ === */
  .orbit {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(178, 139, 255, 0.2);
    border-radius: 50%;
    pointer-events: none;
  }

  /* === ПЛАНЕТЫ === */
  .planet {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: box-shadow 0.3s, transform 0.3s;
    animation: planetRotate 20s linear infinite;
    transform-origin: center;
  }
  .planet:hover {
    box-shadow: 0 0 30px currentColor, 0 0 60px currentColor;
    z-index: 20;
    animation-play-state: paused;
  }
  @keyframes planetRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Сфера с 3D-вращением */
  .planet-sphere {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    box-shadow: inset -15px -15px 30px rgba(0,0,0,0.7), 0 0 20px currentColor;
  }
  .planet-sphere::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50%;
    background: inherit;
    animation: sphereRotate 8s linear infinite;
  }
  @keyframes sphereRotate {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .planet-label {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 5px;
    font-size: 11px;
    color: white;
    text-shadow: 0 0 6px black, 0 0 4px black;
    white-space: nowrap;
    pointer-events: none;
    font-weight: bold;
  }

  /* === ИНТЕРФЕЙС === */
  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    z-index: 100;
    pointer-events: none;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hud-title {
    font-size: 14px;
    color: var(--accent);
    text-shadow: 0 0 10px var(--border);
    letter-spacing: 1px;
    pointer-events: auto;
  }
  .hud-controls {
    display: flex;
    gap: 6px;
    pointer-events: auto;
    flex-wrap: wrap;
  }
  .hud-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(30, 20, 50, 0.9);
    color: var(--accent);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .hud-btn:hover { background: var(--border); color: #fff; }
  .hud-btn.active { background: var(--accent); color: #1a1520; }

  /* === ЗУМ-КОНТРОЛЫ === */
  .zoom-controls {
    position: fixed;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 100;
  }
  .zoom-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(30, 20, 50, 0.9);
    color: var(--accent);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }
  .zoom-btn:hover { background: var(--border); color: #fff; transform: scale(1.1); }

  /* === ПАНЕЛЬ ПЛАНЕТЫ === */
  .planet-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--panel);
    border-top: 2px solid var(--border);
    padding: 14px;
    z-index: 200;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    max-height: 60vh;
    overflow-y: auto;
  }
  .planet-panel.show { transform: translateY(0); }

  .panel-close {
    position: absolute;
    top: 10px; right: 15px;
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 22px;
    cursor: pointer;
    font-weight: bold;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .panel-sphere {
    width: 60px; height: 60px;
    border-radius: 50%;
    box-shadow: inset -8px -8px 15px rgba(0,0,0,0.7), 0 0 15px currentColor;
  }
  .panel-info { flex: 1; min-width: 150px; }
  .panel-name {
    font-weight: bold;
    color: var(--accent);
    font-size: 18px;
    margin-bottom: 3px;
  }
  .panel-type {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
  }
  .panel-lang {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .panel-desc {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 10px;
  }

  .panel-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px;
    margin-bottom: 10px;
  }
  .panel-stat {
    background: rgba(0,0,0,0.3);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    border-left: 3px solid var(--border);
  }
  .panel-stat b { color: var(--accent); }

  .panel-btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(30, 20, 50, 0.8);
    color: var(--accent);
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin: 3px;
  }
  .panel-btn:hover { background: var(--border); color: #fff; }

  /* === ВИД ОТ ПЕРВОГО ЛИЦА === */
  .first-person {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 500;
    display: none;
    overflow: hidden;
  }
  .first-person.show { display: block; }

  .fp-sky {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 65%;
    transition: background 1s;
  }
  .fp-ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35%;
    transition: background 1s;
  }
  .fp-sun {
    position: absolute;
    border-radius: 50%;
    transition: all 1s;
  }
  .fp-object {
    position: absolute;
    font-size: 44px;
    cursor: pointer;
    transition: transform 0.2s;
    text-shadow: 0 0 15px currentColor;
  }
  .fp-object:hover { transform: scale(1.3) translateY(-8px); }

  .fp-player {
    position: absolute;
    bottom: 40px;
    font-size: 34px;
    transition: left 0.3s ease-out;
    z-index: 10;
  }
  .fp-horizon {
    position: absolute;
    bottom: 35%;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255,255,255,0.2);
  }
  .fp-exit {
    position: absolute;
    top: 15px; left: 15px;
    padding: 8px 14px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
    z-index: 20;
  }

  .fp-controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 20;
  }
  .fp-btn {
    padding: 10px 20px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: all 0.2s;
  }
  .fp-btn:hover { background: var(--border); }

  .fp-hud {
    position: absolute;
    top: 15px; right: 15px;
    background: rgba(0,0,0,0.7);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--text);
    z-index: 20;
    max-width: 200px;
  }

  /* === РЕЖИМ ТВОРЦА === */
  .creator-panel {
    position: fixed;
    top: 60px;
    left: 15px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 12px;
    z-index: 150;
    max-width: 260px;
    display: none;
  }
  .creator-panel.show { display: block; }
  .creator-panel h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--accent);
  }
  .creator-panel p {
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 8px;
    line-height: 1.4;
  }
  .creator-panel select {
    width: 100%;
    padding: 6px;
    background: rgba(0,0,0,0.5);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12px;
    font-family: inherit;
    margin-bottom: 6px;
  }
  .creator-panel .swap-btn {
    width: 100%;
    padding: 8px;
    background: var(--accent);
    color: #1a1520;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
  }

  /* === МЕНЮ === */
  .menu {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(5, 5, 16, 0.95);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .menu.hide { display: none; }
  .menu h1 {
    color: var(--accent);
    font-size: 28px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px var(--border);
    text-align: center;
  }
  .menu p {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 20px;
    text-align: center;
    max-width: 400px;
    line-height: 1.5;
  }
  .menu-btn {
    padding: 12px 30px;
    background: rgba(30, 20, 50, 0.9);
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    margin: 5px;
    min-width: 220px;
    font-family: inherit;
  }
  .menu-btn:hover { background: var(--accent); color: #1a1520; transform: scale(1.05); }

  /* === УВЕДОМЛЕНИЕ === */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(200px);
    background: var(--accent);
    color: #1a1520;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    z-index: 9999;
    transition: transform 0.3s;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .menu h1 { font-size: 22px; }
    .menu-btn { font-size: 13px; min-width: 180px; padding: 10px 20px; }
    .hud-title { font-size: 12px; }
    .hud-btn { font-size: 10px; padding: 4px 8px; }
    .zoom-btn { width: 36px; height: 36px; font-size: 16px; }
    .planet-label { font-size: 9px; }
    .creator-panel { top: auto; bottom: 20px; left: 10px; right: 10px; max-width: none; }
    .fp-object { font-size: 34px; }
  }
</style>
</head>
<body>

<!-- === ГЛАВНОЕ МЕНЮ === -->
<div class="menu" id="mainMenu">
  <h1>🌌 АСТРО-ПУТЬ 🌌</h1>
  <p>
    Вселенная Румэджа. Гуляй по звёздным системам, заглядывай на планеты, 
    исследуй атмосферу и стань творцом миров.
  </p>
  <button class="menu-btn" onclick="startMode('explore')">🚀 Исследователь</button>
  <button class="menu-btn" onclick="startMode('creator')">🎨 Режим Творца</button>
  <button class="menu-btn" onclick="startMode('about')">📖 Об Астро-пути</button>
</div>

<!-- === ВСЕЛЕННАЯ === -->
<div id="universe" style="display:none;">
  <div id="starField"></div>
  <div id="world"></div>
</div>

<!-- === HUD === -->
<div class="hud" id="hud" style="display:none;">
  <div class="hud-title">🌌 Астро-путь · Сунная система</div>
  <div class="hud-controls">
    <button class="hud-btn" id="exploreBtn">🚀 Исследователь</button>
    <button class="hud-btn" id="creatorBtn">🎨 Творец</button>
    <button class="hud-btn" id="menuBtn">🏠 Меню</button>
  </div>
</div>

<!-- === ЗУМ === -->
<div class="zoom-controls" id="zoomControls" style="display:none;">
  <button class="zoom-btn" id="zoomIn">+</button>
  <button class="zoom-btn" id="zoomOut">−</button>
  <button class="zoom-btn" id="zoomReset">⟲</button>
</div>

<!-- === ПАНЕЛЬ ПЛАНЕТЫ === -->
<div class="planet-panel" id="planetPanel">
  <button class="panel-close" onclick="closePanel()">×</button>
  <div id="panelContent"></div>
</div>

<!-- === РЕЖИМ ТВОРЦА === -->
<div class="creator-panel" id="creatorPanel">
  <h3>🎨 Режим Творца</h3>
  <p>Меняй планеты местами и смотри последствия. Перетаскивай планеты или используй выбор ниже.</p>
  <label style="font-size:11px; color:var(--text-dim);">Планета 1:</label>
  <select id="swapPlanet1"></select>
  <label style="font-size:11px; color:var(--text-dim);">Планета 2:</label>
  <select id="swapPlanet2"></select>
  <button class="swap-btn" id="swapBtn">🔄 Поменять местами</button>
  <button class="swap-btn" id="resetUniverseBtn" style="margin-top:6px; background:#bf3f3f; color:#fff;">↺ Сбросить вселенную</button>
</div>

<!-- === ВИД ОТ ПЕРВОГО ЛИЦА === -->
<div class="first-person" id="firstPerson">
  <div class="fp-sky" id="fpSky"></div>
  <div class="fp-ground" id="fpGround"></div>
  <div class="fp-horizon"></div>
  <div class="fp-sun" id="fpSun"></div>
  <div id="fpObjects"></div>
  <div class="fp-player" id="fpPlayer">🚶</div>
  <div class="fp-hud" id="fpHud"></div>
  <button class="fp-exit" onclick="exitFirstPerson()">← Назад в космос</button>
  <div class="fp-controls">
    <button class="fp-btn" onclick="fpMove('left')">← Влево</button>
    <button class="fp-btn" onclick="fpMove('forward')">↑ Вперёд</button>
    <button class="fp-btn" onclick="fpMove('right')">→ Вправо</button>
  </div>
</div>

<!-- === TOAST === -->
<div class="toast" id="toast"></div>

// Хранилище текущего состояния (для режима творца)
let currentPlanets = JSON.parse(JSON.stringify(planetsData));

// ============================================
// === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
// ============================================
let zoom = 1;
let panX = 0, panY = 0;
let rotation = 0;
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let currentMode = 'explore';

// ============================================
// === ЗВУКИ ===
// ============================================
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, duration, type = 'sine', vol = 0.1) {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxClick() { playTone(880, 0.08, 'sine', 0.1); }
function sfxZoom() { playTone(600, 0.1, 'sine', 0.08); }
function sfxSelect() { playTone(700, 0.12, 'sine', 0.1); setTimeout(() => playTone(900, 0.15, 'sine', 0.1), 80); }

// ============================================
// === ЗВЁЗДНОЕ НЕБО ===
// ============================================
function generateStarField() {
  const field = document.getElementById('starField');
  field.innerHTML = '';
  for (let i = 0; i < 250; i++) {
    const s = document.createElement('div');
    s.className = 'star-field';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.opacity = 0.3 + Math.random() * 0.7;
    const size = 1 + Math.random() * 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    field.appendChild(s);
  }
}
generateStarField();

// ============================================
// === ПОСТРОЕНИЕ ВСЕЛЕННОЙ ===
// ============================================
const world = document.getElementById('world');

function buildUniverse() {
  world.innerHTML = '';

  // Центральная звезда Сун
  const starSystem = document.createElement('div');
  starSystem.className = 'star-system';
  const sun = document.createElement('div');
  sun.className = 'sun-core';
  sun.title = 'Сун — звезда системы';
  sun.onclick = (e) => {
    e.stopPropagation();
    initAudio(); sfxSelect();
    showToast('☀ Сун — звезда системы. Жёлтый карлик.');
  };
  starSystem.appendChild(sun);
  world.appendChild(starSystem);

  // Планеты
  currentPlanets.forEach((p, i) => {
    // Орбита
    const orbit = document.createElement('div');
    orbit.className = 'orbit';
    const orbitSize = p.dist * 2;
    orbit.style.width = orbitSize + 'px';
    orbit.style.height = orbitSize + 'px';
    world.appendChild(orbit);

    // Планета
    const planet = document.createElement('div');
    planet.className = 'planet';
    planet.style.width = p.size + 'px';
    planet.style.height = p.size + 'px';
    planet.style.background = `radial-gradient(circle at 30% 30%, #fff, ${p.color}, #2a1a4a)`;
    planet.style.color = p.color;
    planet.dataset.id = p.id;
    planet.dataset.pos = i;

    // Позиция на орбите
    const angle = (i * 137.5 + Date.now() / 10000) * Math.PI / 180;
    planet.style.left = `calc(50% + ${Math.cos(angle) * p.dist}px - ${p.size / 2}px)`;
    planet.style.top = `calc(50% + ${Math.sin(angle) * p.dist}px - ${p.size / 2}px)`;

    // Сфера с вращением
    const sphere = document.createElement('div');
    sphere.className = 'planet-sphere';
    sphere.style.background = `linear-gradient(90deg, ${p.color}, #fff, ${p.color}, #2a1a4a, ${p.color})`;
    planet.appendChild(sphere);

    // Подпись
    const label = document.createElement('div');
    label.className = 'planet-label';
    label.textContent = p.name;
    planet.appendChild(label);

    planet.onclick = (e) => {
      e.stopPropagation();
      initAudio(); sfxSelect();
      showPlanetPanel(p);
    };

    world.appendChild(planet);
  });
}
buildUniverse();

// ============================================
// === ЗУМ И ПЕРЕМЕЩЕНИЕ ===
// ============================================
function applyTransform() {
  world.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom}) rotate(${rotation}deg)`;
}

document.getElementById('zoomIn').onclick = () => {
  initAudio(); sfxZoom();
  zoom = Math.min(zoom * 1.3, 8);
  applyTransform();
};
document.getElementById('zoomOut').onclick = () => {
  initAudio(); sfxZoom();
  zoom = Math.max(zoom / 1.3, 0.1);
  applyTransform();
};
document.getElementById('zoomReset').onclick = () => {
  initAudio(); sfxZoom();
  zoom = 1; panX = 0; panY = 0; rotation = 0;
  applyTransform();
};

// Перетаскивание + колесо мыши
const universe = document.getElementById('universe');
universe.addEventListener('mousedown', (e) => {
  if (e.target.closest('.planet') || e.target.closest('.sun-core')) return;
  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; });

// Зум колесом
universe.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.1, Math.min(zoom * delta, 8));
  applyTransform();
}, { passive: false });

// Тач для мобильных
let touchStartDist = 0;
universe.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    touchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  } else if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX - panX;
    dragStartY = e.touches[0].clientY - panY;
  }
});
universe.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const delta = dist / touchStartDist;
    zoom = Math.max(0.1, Math.min(zoom * delta, 8));
    touchStartDist = dist;
    applyTransform();
  } else if (isDragging && e.touches.length === 1) {
    panX = e.touches[0].clientX - dragStartX;
    panY = e.touches[0].clientY - dragStartY;
    applyTransform();
  }
}, { passive: false });
universe.addEventListener('touchend', () => { isDragging = false; });

// ============================================
// === ПАНЕЛЬ ПЛАНЕТЫ ===
// ============================================
function showPlanetPanel(p) {
  const panel = document.getElementById('planetPanel');
  const content = document.getElementById('panelContent');

  content.innerHTML = `
    <div class="panel-header">
      <div class="panel-sphere" style="background:radial-gradient(circle at 30% 30%, #fff, ${p.color}, #2a1a4a); color:${p.color};"></div>
      <div class="panel-info">
        <div class="panel-name">${p.name}</div>
        <div class="panel-type">${p.type} · ${p.pos}-я от Суна</div>
        <div class="panel-lang">📜 ${p.lang}</div>
      </div>
    </div>
    <div class="panel-desc">${p.desc}</div>
    <div class="panel-stats">
      ${Object.entries(p.stats).map(([k, v]) => `<div class="panel-stat"><b>${k}:</b> ${v}</div>`).join('')}
    </div>
    <div style="text-align:center;">
      <button class="panel-btn" onclick="enterFirstPerson('${p.id}')">🚶 Прогуляться</button>
      <button class="panel-btn" onclick="viewFromOrbit('${p.id}')">🌅 Вид с орбиты</button>
    </div>
  `;
  panel.classList.add('show');
}
function closePanel() {
  document.getElementById('planetPanel').classList.remove('show');
}

// ============================================
// === ВИД С ОРБИТЫ ===
// ============================================
function viewFromOrbit(id) {
  initAudio(); sfxClick();
  const p = currentPlanets.find(x => x.id === id);
  if (!p) return;
  showToast(`🌅 Вид с ${p.name}: ${p.desc.slice(0, 60)}...`);
  // Зум на планету
  const planetEl = document.querySelector(`.planet[data-id="${id}"]`);
  if (planetEl) {
    const rect = planetEl.getBoundingClientRect();
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    panX += cx - (rect.left + rect.width / 2);
    panY += cy - (rect.top + rect.height / 2);
    zoom = 3;
    applyTransform();
  }
  closePanel();
}

// ============================================
// === ПЕРВОЕ ЛИЦО (3D-прогулка) ===
// ============================================
let fpPlanetId = null;
let fpPlayerX = 50;

function enterFirstPerson(id) {
  initAudio(); sfxSelect();
  const p = currentPlanets.find(x => x.id === id);
  if (!p) return;

  fpPlanetId = id;
  fpPlayerX = 50;

  const fp = document.getElementById('firstPerson');
  fp.classList.add('show');

  // Небо
  const sky = document.getElementById('fpSky');
  sky.style.background = `linear-gradient(180deg, ${p.skyColors[0]} 0%, ${p.skyColors[1]} 50%, ${p.skyColors[2]} 100%)`;

  // Земля
  const ground = document.getElementById('fpGround');
  ground.style.background = `linear-gradient(180deg, ${p.groundColors[0]}, ${p.groundColors[1]})`;

  // Солнце
  const sun = document.getElementById('fpSun');
  sun.style.background = `radial-gradient(circle, #fff, ${p.sunColor}, transparent)`;
  sun.style.color = p.sunColor;
  sun.style.width = '80px';
  sun.style.height = '80px';
  sun.style.left = '70%';
  sun.style.top = '10%';
  sun.style.boxShadow = `0 0 60px ${p.sunColor}`;

  // Объекты
  const objectsContainer = document.getElementById('fpObjects');
  objectsContainer.innerHTML = '';
  p.objects.forEach(o => {
    const obj = document.createElement('div');
    obj.className = 'fp-object';
    obj.style.left = o.x + '%';
    obj.style.top = o.y + '%';
    obj.textContent = o.icon;
    obj.style.color = p.color;
    obj.onclick = (e) => {
      e.stopPropagation();
      initAudio(); sfxClick();
      showToast(`${o.name}: ${o.desc}`);
    };
    objectsContainer.appendChild(obj);
  });

  // Игрок
  document.getElementById('fpPlayer').style.left = fpPlayerX + '%';

  // HUD
  document.getElementById('fpHud').innerHTML = `
    <b>${p.name}</b><br>
    ${p.type}<br>
    <span style="color:${p.color};">● ${p.stats["Температура"]}</span>
  `;

  // Закрываем панель планеты
  closePanel();
}

function exitFirstPerson() {
  initAudio(); sfxClick();
  document.getElementById('firstPerson').classList.remove('show');
  fpPlanetId = null;
}

function fpMove(dir) {
  initAudio(); sfxClick();
  const player = document.getElementById('fpPlayer');
  if (dir === 'left') fpPlayerX = Math.max(5, fpPlayerX - 10);
  else if (dir === 'right') fpPlayerX = Math.min(95, fpPlayerX + 10);
  else if (dir === 'forward') {
    player.style.transform = 'scale(1.2)';
    setTimeout(() => player.style.transform = 'scale(1)', 200);
  }
  player.style.left = fpPlayerX + '%';
}

// ============================================
// === РЕЖИМ ТВОРЦА ===
// ============================================
function openCreatorPanel() {
  currentMode = 'creator';
  const panel = document.getElementById('creatorPanel');
  panel.classList.add('show');

  // Заполняем селекты
  const sel1 = document.getElementById('swapPlanet1');
  const sel2 = document.getElementById('swapPlanet2');
  sel1.innerHTML = '';
  sel2.innerHTML = '';
  currentPlanets.forEach((p, i) => {
    sel1.innerHTML += `<option value="${i}">${p.name} (позиция ${p.pos})</option>`;
    sel2.innerHTML += `<option value="${i}">${p.name} (позиция ${p.pos})</option>`;
  });
  sel2.selectedIndex = 1;
}

document.getElementById('swapBtn').onclick = () => {
  initAudio(); sfxSelect();
  const i1 = parseInt(document.getElementById('swapPlanet1').value);
  const i2 = parseInt(document.getElementById('swapPlanet2').value);
  if (i1 === i2) { showToast('❌ Выбери разные планеты!'); return; }

  // Меняем местами
  const temp = { ...currentPlanets[i1] };
  currentPlanets[i1] = { ...currentPlanets[i2] };
  currentPlanets[i2] = temp;

  // Меняем pos
  const tempPos = currentPlanets[i1].pos;
  currentPlanets[i1].pos = currentPlanets[i2].pos;
  currentPlanets[i2].pos = tempPos;

  // Обновляем визуал
  buildUniverse();

  // Прогноз последствий
  let consequence = '';
  const p1 = currentPlanets[i1];
  const p2 = currentPlanets[i2];

  if (p1.type.includes("обитаемая") && p1.pos > 3) {
    consequence = `⚠ ${p1.name} слишком далеко от Суна — жизнь погибнет!`;
  } else if (p2.type.includes("обитаемая") && p2.pos > 3) {
    consequence = `⚠ ${p2.name} слишком далеко от Суна — жизнь погибнет!`;
  } else if (p1.pos === 1 || p2.pos === 1) {
    consequence = `🔥 Планета на 1-й позиции сгорит от жара Суна!`;
  } else {
    consequence = `✅ Планеты поменялись местами. Система выжила.`;
  }

  showToast(consequence);
};

document.getElementById('resetUniverseBtn').onclick = () => {
  initAudio(); sfxClick();
  currentPlanets = JSON.parse(JSON.stringify(planetsData));
  buildUniverse();
  openCreatorPanel();
  showToast('↺ Вселенная сброшена');
};

// ============================================
// === УПРАВЛЕНИЕ РЕЖИМАМИ ===
// ============================================
function startMode(mode) {
  initAudio(); sfxSelect();
  document.getElementById('mainMenu').classList.add('hide');
  document.getElementById('universe').style.display = 'block';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('zoomControls').style.display = 'flex';

  if (mode === 'explore') {
    currentMode = 'explore';
    document.getElementById('exploreBtn').classList.add('active');
    document.getElementById('creatorBtn').classList.remove('active');
    document.getElementById('creatorPanel').classList.remove('show');
    showToast('🚀 Режим исследователя');
  } else if (mode === 'creator') {
    currentMode = 'creator';
    document.getElementById('creatorBtn').classList.add('active');
    document.getElementById('exploreBtn').classList.remove('active');
    openCreatorPanel();
    showToast('🎨 Режим творца активирован');
  } else if (mode === 'about') {
    alert(`🌌 АСТРО-ПУТЬ\n\nВселенная Румэджа — бесконечное море звёздных систем.\n\nИсследуй планеты Сунной системы: 7 миров, каждый со своей атмосферой, флорой и фауной.\n\nВ Режиме Творца можно менять планеты местами и смотреть, что произойдёт.`);
    document.getElementById('mainMenu').classList.remove('hide');
    document.getElementById('universe').style.display = 'none';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('zoomControls').style.display = 'none';
  }
}

document.getElementById('exploreBtn').onclick = () => startMode('explore');
document.getElementById('creatorBtn').onclick = () => startMode('creator');
document.getElementById('menuBtn').onclick = () => {
  initAudio(); sfxClick();
  document.getElementById('mainMenu').classList.remove('hide');
  document.getElementById('universe').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('zoomControls').style.display = 'none';
  document.getElementById('creatorPanel').classList.remove('show');
  closePanel();
  exitFirstPerson();
};

// ============================================
// === TOAST ===
// ============================================
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ============================================
// === АНИМАЦИЯ ОРБИТ ===
// ============================================
function animateOrbits() {
  if (currentMode !== 'explore' && currentMode !== 'creator') {
    requestAnimationFrame(animateOrbits);
    return;
  }

  const planets = document.querySelectorAll('.planet');
  const time = Date.now() / 1000;

  planets.forEach((el, i) => {
    const p = currentPlanets[i];
    if (!p) return;
    const speed = 0.05 / Math.sqrt(p.dist / 100);
    const angle = (i * 137.5 + time * speed * 20) * Math.PI / 180;
    const x = Math.cos(angle) * p.dist;
    const y = Math.sin(angle) * p.dist;
    el.style.left = `calc(50% + ${x}px - ${p.size / 2}px)`;
    el.style.top = `calc(50% + ${y}px - ${p.size / 2}px)`;
  });

  requestAnimationFrame(animateOrbits);
}
animateOrbits();

// ============================================
// === СТАРТ ===
// ============================================
console.log("🌌 Астро-путь загружен. Планет:", planetsData.length);
</script>
