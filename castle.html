  <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🌍 Our Empire Pro — Прототип</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0e1a;
            color: #c8d6e5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #141b2b;
            border: 2px solid #3a5f8a;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 0 50px rgba(58, 95, 138, 0.2);
        }
        h1 {
            color: #b7c9ff;
            text-align: center;
            font-size: 28px;
            border-bottom: 1px solid #2a3f6a;
            padding-bottom: 12px;
            margin-bottom: 18px;
            letter-spacing: 3px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #10182a;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid #2a3f6a;
            margin-bottom: 18px;
            font-weight: bold;
            gap: 8px;
        }
        .stats span { color: #ffd866; }
        .map {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin: 16px 0;
        }
        .cell {
            background: #1a2440;
            border: 1px solid #2f4370;
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #b0c4f0;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .cell:hover { transform: scale(1.03); border-color: #7a9aff; }
        .cell.own { border-color: #6fcf97; background: #1a3a2a; }
        .cell.enemy { border-color: #ff6b6b; background: #3a1a1a; }
        .cell .name { font-weight: bold; font-size: 13px; }
        .cell .army { color: #ffaa66; }
        .cell .gold { color: #ffd700; }
        .cell .defense { color: #66b3ff; }
        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 12px 0;
        }
        .btn {
            background: #2a4a8a;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #4a7acf; transform: scale(1.02); }
        .btn:active { transform: scale(0.95); }
        .log {
            background: #0b1120;
            border: 1px solid #1f3460;
            border-radius: 14px;
            padding: 12px;
            margin-top: 16px;
            max-height: 140px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .log .highlight { color: #ffd866; }
        .log .combat { color: #ff8a80; }
        .log .win { color: #80d8a0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Our Empire Pro — Прототип</h1>

    <div class="stats" id="stats">
        <span>🪙 Золото: <span id="goldDisplay">100</span></span>
        <span>⚔️ Армия: <span id="armyDisplay">30</span></span>
        <span>🏰 Регионов: <span id="territoryDisplay">1</span></span>
        <span>⏳ Ход: <span id="turnDisplay">0</span></span>
    </div>

    <div class="map" id="mapContainer"></div>

    <div class="flex">
        <button class="btn" onclick="trainArmy()">🎯 Тренировать войска (30 золота)</button>
        <button class="btn" onclick="nextTurn()">⏩ Следующий ход</button>
        <button class="btn" onclick="resetGame()">🔄 Перезапуск</button>
    </div>

    <div class="log" id="log">⚔️ Добро пожаловать в Our Empire Pro! Выбери свою страну кликом.</div>
</div>

<script>
    // === МИР (6×6) ===
    const NAMES = [
        'Россия', 'Украина', 'Германия', 'Франция', 'Италия', 'Испания',
        'Великобритания', 'Польша', 'Турция', 'Греция', 'Египет', 'Сауд. Аравия',
        'Индия', 'Китай', 'Япония', 'США', 'Канада', 'Мексика',
        'Бразилия', 'Аргентина', 'ЮАР', 'Нигерия', 'Австралия', 'Казахстан',
        'Швеция', 'Норвегия', 'Финляндия', 'Дания', 'Нидерланды', 'Бельгия',
        'Швейцария', 'Австрия', 'Венгрия', 'Румыния', 'Болгария', 'Сербия'
    ];

    let world = [];
    let playerIndex = -1; // выбрана страна
    let gold = 100;
    let army = 30;
    let turn = 0;

    function initWorld() {
        world = NAMES.map((name, i) => ({
            id: i,
            name: name,
            owner: -1, // -1 = нейтрал, 0 = игрок, >0 = ИИ
            gold: 15 + Math.floor(Math.random() * 30),
            army: 8 + Math.floor(Math.random() * 18),
            defense: 2 + Math.floor(Math.random() * 6)
        }));
        // Первая страна (Россия) изначально принадлежит игроку для примера
        world[0].owner = 0;
        playerIndex = 0;
        gold = world[0].gold;
        army = world[0].army;
    }
    initWorld();

    function renderMap() {
        const container = document.getElementById('mapContainer');
        container.innerHTML = '';
        world.forEach((cell, idx) => {
            const div = document.createElement('div');
            div.className = 'cell';
            if (cell.owner === 0) div.classList.add('own');
            else if (cell.owner > 0) div.classList.add('enemy');

            div.innerHTML = `
                <div class="name">${cell.name}</div>
                <div class="gold">🪙 ${cell.gold}</div>
                <div class="army">⚔️ ${cell.army}</div>
                <div class="defense">🛡️ ${cell.defense}</div>
                ${cell.owner === -1 ? '<div style="color:#667;font-size:10px;">🌿 нейтр.</div>' : ''}
                ${cell.owner === 0 ? '🏠' : ''}
                ${cell.owner > 0 ? '🤖' : ''}
            `;
            // Выбор страны для игрока
            if (cell.owner === -1 || cell.owner > 0) {
                div.style.cursor = 'pointer';
                div.onclick = () => selectCountry(idx);
            }
            container.appendChild(div);
        });
        updateStats();
    }

    function selectCountry(idx) {
        if (world[idx].owner === 0) return;
        // Если игрок уже имеет страну — сначала забрать ресурсы
        if (playerIndex !== -1 && world[playerIndex].owner === 0) {
            world[playerIndex].gold = gold;
            world[playerIndex].army = army;
            world[playerIndex].owner = -1; // освободить
        }
        // Захват выбранной страны (если нейтральная или ИИ)
        if (world[idx].owner === -1) {
            world[idx].owner = 0;
            gold = world[idx].gold;
            army = world[idx].army;
            playerIndex = idx;
            addLog(`✅ Ты выбрал ${world[idx].name}!`);
        } else if (world[idx].owner > 0) {
            // Бой с ИИ за страну
            attackCountry(idx);
        }
        renderMap();
    }

    function attackCountry(idx) {
        const target = world[idx];
        if (army <= 0) { addLog('❌ Нет войск для атаки!'); return; }
        const playerPower = army + Math.floor(Math.random() * 10);
        const enemyPower = target.army + target.defense + Math.floor(Math.random() * 8);
        if (playerPower > enemyPower) {
            const lost = Math.floor(army * 0.3) + Math.floor(Math.random() * 4);
            army -= lost;
            const gained = Math.floor(target.army * 0.4);
            army += gained;
            gold += Math.floor(target.gold * 0.5);
            target.owner = 0;
            target.army = Math.max(5, target.army - Math.floor(target.army * 0.5));
            target.gold = Math.floor(target.gold * 0.3);
            playerIndex = idx;
            addLog(`⚔️ Победа! ${target.name} захвачен. Потеряно ${lost} войск.`, 'win');
        } else {
            const lost = Math.floor(army * 0.5) + Math.floor(Math.random() * 4);
            army = Math.max(0, army - lost);
            target.army = Math.max(5, target.army - Math.floor(target.army * 0.2));
            addLog(`💀 Поражение от ${target.name}! Потеряно ${lost} войск.`, 'combat');
        }
        renderMap();
        checkGameOver();
    }

    function trainArmy() {
        if (gold >= 30) {
            gold -= 30;
            const inc = 8 + Math.floor(Math.random() * 6);
            army += inc;
            addLog(`🎯 Войска обучены! +${inc} солдат.`);
            renderMap();
        } else {
            addLog('❌ Не хватает золота (нужно 30).');
        }
    }

    function nextTurn() {
        // Доход с регионов
        const territories = world.filter(c => c.owner === 0);
        const income = territories.length * 4 + Math.floor(Math.random() * 4);
        gold += income;

        // Враги укрепляются
        world.forEach(c => {
            if (c.owner > 0) {
                c.army += Math.floor(Math.random() * 4);
                c.defense += Math.floor(Math.random() * 2);
                c.gold += Math.floor(Math.random() * 5);
            }
        });

        // ИИ атакует друг друга (случайно)
        const aiCountries = world.filter(c => c.owner > 0);
        if (aiCountries.length > 1) {
            const attacker = aiCountries[Math.floor(Math.random() * aiCountries.length)];
            const targets = world.filter(c => c.owner !== attacker.owner && c.owner !== 0 && c.owner !== -1);
            if (targets.length > 0) {
                const target = targets[Math.floor(Math.random() * targets.length)];
                const ap = attacker.army + Math.random() * 8;
                const ep = target.army + target.defense + Math.random() * 6;
                if (ap > ep) {
                    const lost = Math.floor(attacker.army * 0.2);
                    attacker.army -= lost;
                    const gained = Math.floor(target.army * 0.3);
                    attacker.army += gained;
                    target.owner = attacker.owner;
                    addLog(`🤖 ${attacker.name} захватил ${target.name}!`, 'combat');
                } else {
                    const lost = Math.floor(attacker.army * 0.3);
                    attacker.army = Math.max(3, attacker.army - lost);
                    addLog(`🤖 ${attacker.name} атаковал ${target.name}, но отступил.`, 'combat');
                }
            }
        }

        // Если игрок потерял все регионы — проигрыш
        if (world.filter(c => c.owner === 0).length === 0 && playerIndex !== -1) {
            addLog('💀 ТЫ ПОТЕРЯЛ ВСЕ РЕГИОНЫ! ИГРА ОКОНЧЕНА.', 'combat');
            playerIndex = -1;
        }

        turn++;
        renderMap();
        document.getElementById('turnDisplay').textContent = turn;
        addLog(`⏳ Ход ${turn}. Доход: +${income} золота.`);
    }

    function addLog(msg, cls = '') {
        const log = document.getElementById('log');
        log.innerHTML += `<div class="${cls}">${msg}</div>`;
        log.scrollTop = log.scrollHeight;
        if (log.children.length > 20) log.removeChild(log.firstChild);
    }

    function updateStats() {
        document.getElementById('goldDisplay').textContent = gold;
        document.getElementById('armyDisplay').textContent = army;
        document.getElementById('territoryDisplay').textContent = world.filter(c => c.owner === 0).length;
        document.getElementById('turnDisplay').textContent = turn;
    }

    function checkGameOver() {
        if (world.filter(c => c.owner === 0).length >= 36) {
            addLog('🏆 ТЫ ЗАХВАТИЛ ВЕСЬ МИР! ПОБЕДА!', 'win');
        }
        if (army <= 0 && playerIndex !== -1) {
            addLog('💀 ВСЕ ВОЙСКА ПОТЕРЯНЫ. ИГРА ОКОНЧЕНА.', 'combat');
            playerIndex = -1;
        }
    }

    function resetGame() {
        initWorld();
        turn = 0;
        document.getElementById('turnDisplay').textContent = '0';
        document.getElementById('log').innerHTML = '🔄 Игра перезапущена. Выбери страну.';
        renderMap();
    }

    // === ТАЙМЕР АВТО-ХОДА ===
    setInterval(() => {
        if (playerIndex !== -1) nextTurn();
    }, 12000);

    // === СТАРТ ===
    renderMap();
    addLog('👆 Кликни по любой нейтральной или вражеской стране, чтобы выбрать её.');
</script>
</body>
</html>
