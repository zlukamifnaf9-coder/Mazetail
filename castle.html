<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Maze Russia Ekaterinburg — Прототип</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0e1a;
            color: #c8d6e5;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            width: 100%;
            background: #111827;
            border: 2px solid #3a6a9a;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 0 60px rgba(58, 106, 154, 0.2);
        }
        h1 {
            color: #b7c9ff;
            text-align: center;
            font-size: 26px;
            letter-spacing: 2px;
            border-bottom: 1px solid #2a4a7a;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .top-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            background: #0f1729;
            border-radius: 16px;
            padding: 14px 18px;
            border: 1px solid #2a4a7a;
            margin-bottom: 16px;
        }
        .top-panel .stat {
            font-weight: bold;
        }
        .top-panel .stat span { color: #ffd866; }
        .year-selector {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .year-btn {
            background: #1f3460;
            color: #aab8e6;
            border: 1px solid #3a5f8a;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .year-btn.active {
            background: #3a6a9a;
            color: #fff;
            border-color: #7a9aff;
        }
        .year-btn:hover { background: #2a4a7a; }
        .diplomacy-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 10px 0 16px;
            padding: 10px;
            background: #0f1729;
            border-radius: 16px;
            border: 1px solid #1f3460;
        }
        .dip-btn {
            background: #1f3460;
            color: #b7c9ff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .dip-btn:hover { background: #3a5f8a; transform: scale(1.02); }
        .dip-btn.war { border-left: 3px solid #ff6b6b; }
        .dip-btn.ally { border-left: 3px solid #6fcf97; }
        .dip-btn.trade { border-left: 3px solid #ffd700; }
        .dip-btn.pact { border-left: 3px solid #66b3ff; }
        .dip-btn.coal { border-left: 3px solid #ff8a80; }
        .map {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .region {
            background: #141f3a;
            border: 1px solid #2a4a7a;
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
        }
        .region .region-name {
            font-weight: bold;
            color: #7a9aff;
            font-size: 14px;
            border-bottom: 1px solid #1f3460;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .country {
            background: #1a2440;
            border: 1px solid #2f4370;
            border-radius: 8px;
            padding: 6px 4px;
            margin: 4px 0;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .country:hover { border-color: #7a9aff; transform: scale(1.01); }
        .country.own { border-color: #6fcf97; background: #1a3a2a; }
        .country.enemy { border-color: #ff6b6b; background: #3a1a1a; }
        .country .cname { font-weight: bold; }
        .country .carmy { color: #ffaa66; }
        .country .cgold { color: #ffd700; }
        .country .crel { font-size: 10px; color: #8899bb; }
        .log {
            background: #0b1120;
            border: 1px solid #1f3460;
            border-radius: 14px;
            padding: 12px;
            margin-top: 16px;
            max-height: 160px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
        }
        .log .highlight { color: #ffd866; }
        .log .combat { color: #ff8a80; }
        .log .win { color: #80d8a0; }
        .log .dip { color: #66b3ff; }
        .flex { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn {
            background: #2a4a8a;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: #4a7acf; transform: scale(1.02); }
        .btn:active { transform: scale(0.95); }
        .btn.danger { background: #8a2a2a; }
        .btn.danger:hover { background: #cf4a4a; }
        @media (max-width: 700px) {
            .map { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Maze Russia Ekaterinburg</h1>

    <div class="top-panel">
        <div class="stat">🪙 Золото: <span id="goldDisplay">0</span></div>
        <div class="stat">⚔️ Армия: <span id="armyDisplay">0</span></div>
        <div class="stat">🏰 Регионов: <span id="regionDisplay">0</span></div>
        <div class="stat">⏳ Ход: <span id="turnDisplay">0</span></div>
        <div class="year-selector">
            <span style="color:#8899bb;">Год:</span>
            <button class="year-btn active" data-year="2026" onclick="setYear(2026)">2026</button>
            <button class="year-btn" data-year="1941" onclick="setYear(1941)">1941</button>
            <button class="year-btn" data-year="1812" onclick="setYear(1812)">1812</button>
        </div>
    </div>

    <div class="diplomacy-panel" id="dipPanel">
        <button class="dip-btn war" onclick="diplomacy('war')">⚔️ Война</button>
        <button class="dip-btn ally" onclick="diplomacy('ally')">🤝 Союз</button>
        <button class="dip-btn trade" onclick="diplomacy('trade')">📦 Торговля</button>
        <button class="dip-btn pact" onclick="diplomacy('pact')">🕊️ Пакт</button>
        <button class="dip-btn coal" onclick="diplomacy('coalition')">⚡ Коалиция</button>
        <span style="color:#8899bb; font-size:13px; margin-left:8px;" id="dipTarget">Выбери страну на карте</span>
    </div>

    <div class="map" id="mapContainer"></div>

    <div class="flex">
        <button class="btn" onclick="trainArmy()">🎯 Тренировать войска (40 золота)</button>
        <button class="btn" onclick="nextTurn()">⏩ Следующий ход</button>
        <button class="btn danger" onclick="resetGame()">🔄 Перезапуск</button>
    </div>

    <div class="log" id="log">⚔️ Добро пожаловать в Maze Russia Ekaterinburg. Выбери страну кликом.</div>
</div>

<script>
    // ======================================================================
    //  MAZE RUSSIA EKATERINBURG — ЯДРО ИГРЫ
    // ======================================================================

    // ---- КОНФИГ: РЕГИОНЫ И СТРАНЫ ----
    const REGIONS = [
        { name: 'Европа', countries: ['Германия', 'Франция', 'Италия', 'Польша'] },
        { name: 'Азия', countries: ['Россия', 'Китай', 'Индия', 'Япония'] },
        { name: 'Америка', countries: ['США', 'Канада', 'Бразилия', 'Мексика'] },
        { name: 'Африка', countries: ['Египет', 'ЮАР', 'Нигерия', 'Алжир'] }
    ];

    // ---- СОСТОЯНИЕ ИГРЫ ----
    let game = {
        year: 2026,
        turn: 0,
        playerCountry: null,       // строка (название страны игрока)
        countries: {},             // { 'Россия': { gold, army, defense, region, relations: { 'Германия': 0, ... } } }
        selectedDiplomacyTarget: null, // строка — страна, с которой взаимодействуем
        log: []
    };

    // ---- БАЛАНСЫ ПО ГОДАМ ----
    function getBalance(year) {
        if (year === 1941) return { goldMultiplier: 0.7, armyMultiplier: 1.4, defenseMultiplier: 1.2 };
        if (year === 1812) return { goldMultiplier: 0.4, armyMultiplier: 0.8, defenseMultiplier: 0.6 };
        return { goldMultiplier: 1.0, armyMultiplier: 1.0, defenseMultiplier: 1.0 }; // 2026
    }

    // ---- ИНИЦИАЛИЗАЦИЯ ----
    function initGame() {
        const balance = getBalance(game.year);
        game.countries = {};
        game.playerCountry = null;
        game.selectedDiplomacyTarget = null;
        game.turn = 0;

        REGIONS.forEach(region => {
            region.countries.forEach(name => {
                const gold = Math.floor((20 + Math.random() * 40) * balance.goldMultiplier);
                const army = Math.floor((8 + Math.random() * 20) * balance.armyMultiplier);
                const defense = Math.floor((2 + Math.random() * 8) * balance.defenseMultiplier);
                game.countries[name] = {
                    gold: gold,
                    army: army,
                    defense: defense,
                    region: region.name,
                    relations: {}
                };
            });
        });

        // Инициализация отношений (случайные)
        const names = Object.keys(game.countries);
        names.forEach(c1 => {
            names.forEach(c2 => {
                if (c1 !== c2) {
                    game.countries[c1].relations[c2] = Math.floor(Math.random() * 40) - 20; // -20..+20
                }
            });
        });

        // Игрок по умолчанию — Россия (если есть)
        if (game.countries['Россия']) {
            game.playerCountry = 'Россия';
            game.countries['Россия'].gold = 100;
            game.countries['Россия'].army = 30;
        } else {
            const first = Object.keys(game.countries)[0];
            game.playerCountry = first;
        }

        renderAll();
        addLog('🌍 Игра инициализирована. Год: ' + game.year);
        addLog('👆 Твоя страна: ' + game.playerCountry + '. Кликни по другой стране для дипломатии.');
    }

    // ---- ОТРИСОВКА КАРТЫ ----
    function renderMap() {
        const container = document.getElementById('mapContainer');
        container.innerHTML = '';
        REGIONS.forEach(region => {
            const div = document.createElement('div');
            div.className = 'region';
            div.innerHTML = `<div class="region-name">${region.name}</div>`;
            region.countries.forEach(name => {
                const c = game.countries[name];
                if (!c) return;
                const isOwn = name === game.playerCountry;
                const isEnemy = !isOwn && game.playerCountry && game.countries[game.playerCountry]?.relations?.[name] < -20;
                const countryDiv = document.createElement('div');
                countryDiv.className = 'country' + (isOwn ? ' own' : '') + (isEnemy ? ' enemy' : '');
                countryDiv.innerHTML = `
                    <span class="cname">${name}</span>
                    <span class="cgold">🪙${c.gold}</span>
                    <span class="carmy">⚔️${c.army}</span>
                    <span class="crel">${isOwn ? '🏠' : getRelationEmoji(name)}</span>
                `;
                if (!isOwn) {
                    countryDiv.style.cursor = 'pointer';
                    countryDiv.onclick = () => selectDiplomacyTarget(name);
                }
                div.appendChild(countryDiv);
            });
            container.appendChild(div);
        });
        updateStats();
    }

    function getRelationEmoji(name) {
        if (!game.playerCountry) return '❓';
        const rel = game.countries[game.playerCountry]?.relations?.[name] || 0;
        if (rel > 30) return '🤝';
        if (rel > 10) return '😊';
        if (rel > -10) return '😐';
        if (rel > -30) return '😠';
        return '⚔️';
    }

    function updateStats() {
        if (!game.playerCountry) return;
        const p = game.countries[game.playerCountry];
        document.getElementById('goldDisplay').textContent = p.gold;
        document.getElementById('armyDisplay').textContent = p.army;
        const regions = new Set();
        Object.keys(game.countries).forEach(name => {
            if (game.countries[name].region) regions.add(game.countries[name].region);
        });
        document.getElementById('regionDisplay').textContent = regions.size;
        document.getElementById('turnDisplay').textContent = game.turn;
    }

    function renderAll() {
        renderMap();
        document.getElementById('dipTarget').textContent =
            game.selectedDiplomacyTarget ? 'Цель: ' + game.selectedDiplomacyTarget : 'Выбери страну на карте';
        updateStats();
    }

    // ---- ВЫБОР ЦЕЛИ ДЛЯ ДИПЛОМАТИИ ----
    function selectDiplomacyTarget(name) {
        if (name === game.playerCountry) return;
        game.selectedDiplomacyTarget = name;
        document.getElementById('dipTarget').textContent = 'Цель: ' + name;
        addLog(`🎯 Выбрана цель: ${name}`, 'dip');
        renderAll();
    }

    // ---- ДИПЛОМАТИЯ ----
    function diplomacy(action) {
        if (!game.playerCountry) { addLog('❌ Ты не играешь ни за одну страну!'); return; }
        const target = game.selectedDiplomacyTarget;
        if (!target || !game.countries[target]) { addLog('❌ Сначала выбери страну на карте!'); return; }
        if (target === game.playerCountry) { addLog('❌ Нельзя с самим собой!'); return; }

        const player = game.countries[game.playerCountry];
        const enemy = game.countries[target];
        const rel = player.relations[target] || 0;

        let result = '';
        let success = false;

        switch (action) {
            case 'war':
                if (rel < 0) {
                    success = true;
                    player.relations[target] = Math.min(-100, rel - 20);
                    enemy.relations[game.playerCountry] = Math.min(-100, (enemy.relations[game.playerCountry] || 0) - 20);
                    result = `⚔️ ВОЙНА объявлена ${target}! Отношения ухудшены.`;
                    // Мгновенная атака
                    resolveBattle(game.playerCountry, target);
                } else {
                    result = `❌ ${target} не настроена враждебно. Сначала ухудши отношения (провокации).`;
                }
                break;
            case 'ally':
                if (rel > 20 || Math.random() < 0.4) {
                    success = true;
                    player.relations[target] = Math.min(100, rel + 40);
                    enemy.relations[game.playerCountry] = Math.min(100, (enemy.relations[game.playerCountry] || 0) + 40);
                    result = `🤝 Союз с ${target} заключён! Отношения +40.`;
                } else {
                    result = `❌ ${target} отказалась от союза. Попробуй улучшить отношения.`;
                }
                break;
            case 'trade':
                if (rel > -10 || Math.random() < 0.5) {
                    success = true;
                    const tradeGold = Math.floor(10 + Math.random() * 20);
                    player.gold += tradeGold;
                    enemy.gold += tradeGold;
                    player.relations[target] = Math.min(100, rel + 10);
                    result = `📦 Торговля с ${target}! +${tradeGold} золота каждой стороне. Отношения +10.`;
                } else {
                    result = `❌ ${target} не заинтересована в торговле.`;
                }
                break;
            case 'pact':
                if (rel > -30 || Math.random() < 0.5) {
                    success = true;
                    player.relations[target] = Math.min(100, rel + 15);
                    enemy.relations[game.playerCountry] = Math.min(100, (enemy.relations[game.playerCountry] || 0) + 15);
                    result = `🕊️ Пакт о ненападении с ${target}! Отношения +15.`;
                } else {
                    result = `❌ ${target} отвергла пакт. Отношения слишком плохие.`;
                }
                break;
            case 'coalition':
                // Коалиция: все страны с отношением к цели < -30 присоединяются
                const allies = [];
                Object.keys(game.countries).forEach(name => {
                    if (name !== game.playerCountry && name !== target) {
                        const relToTarget = game.countries[name].relations[target] || 0;
                        if (relToTarget < -30) allies.push(name);
                    }
                });
                if (allies.length > 0) {
                    success = true;
                    const bonus = allies.length * 10;
                    player.army += bonus;
                    allies.forEach(a => {
                        game.countries[a].relations[target] = Math.min(-100, (game.countries[a].relations[target] || 0) - 20);
                        game.countries[a].relations[game.playerCountry] = Math.min(100, (game.countries[a].relations[game.playerCountry] || 0) + 10);
                    });
                    result = `⚡ Коалиция против ${target}! К ней присоединились: ${allies.join(', ')}. Армия +${bonus}.`;
                } else {
                    result = `❌ Недостаточно стран для коалиции против ${target}.`;
                }
                break;
            default: return;
        }

        addLog(result, success ? 'win' : 'combat');
        renderAll();
        checkGameOver();
    }

    // ---- БОЕВКА ----
    function resolveBattle(attacker, defender) {
        const a = game.countries[attacker];
        const d = game.countries[defender];
        if (!a || !d) return;

        const aPower = a.army + Math.random() * 10;
        const dPower = d.army + d.defense + Math.random() * 8;

        if (aPower > dPower) {
            const lost = Math.floor(a.army * 0.25) + Math.floor(Math.random() * 5);
            a.army -= lost;
            const gained = Math.floor(d.army * 0.3);
            a.army += gained;
            const goldLoot = Math.floor(d.gold * 0.3);
            a.gold += goldLoot;
            d.army = Math.max(3, d.army - Math.floor(d.army * 0.4));
            d.gold = Math.max(10, d.gold - Math.floor(d.gold * 0.3));
            addLog(`⚔️ ${attacker} ПОБЕДИЛ ${defender}! Потеряно ${lost} войск, +${gained} захвачено, +${goldLoot} золота.`, 'win');
        } else {
            const lost = Math.floor(a.army * 0.4) + Math.floor(Math.random() * 5);
            a.army = Math.max(0, a.army - lost);
            d.army = Math.max(3, d.army - Math.floor(d.army * 0.15));
            addLog(`💀 ${attacker} проиграл битву ${defender}! Потеряно ${lost} войск.`, 'combat');
        }
    }

    // ---- ТРЕНИРОВКА ----
    function trainArmy() {
        if (!game.playerCountry) return;
        const p = game.countries[game.playerCountry];
        if (p.gold >= 40) {
            p.gold -= 40;
            const inc = 6 + Math.floor(Math.random() * 8);
            p.army += inc;
            addLog(`🎯 Войска обучены! +${inc} солдат.`);
            renderAll();
        } else {
            addLog('❌ Не хватает золота (нужно 40).');
        }
    }

    // ---- ХОД ----
    function nextTurn() {
        if (!game.playerCountry) return;
        game.turn++;
        const p = game.countries[game.playerCountry];

        // Доход
        const regions = new Set();
        Object.keys(game.countries).forEach(name => {
            if (game.countries[name].region) regions.add(game.countries[name].region);
        });
        const income = regions.size * 3 + Math.floor(Math.random() * 5);
        p.gold += income;

        // ИИ ходит
        aiTurn();

        // Проверка на поражение
        if (p.army <= 0) {
            addLog('💀 Твоя армия уничтожена! Игра окончена.', 'combat');
            game.playerCountry = null;
        }

        renderAll();
        addLog(`⏳ Ход ${game.turn}. Доход: +${income} золота.`);
        checkGameOver();
    }

    // ---- ИИ ----
    function aiTurn() {
        const names = Object.keys(game.countries);
        names.forEach(name => {
            if (name === game.playerCountry) return;
            const c = game.countries[name];
            // Случайные действия ИИ
            const roll = Math.random();
            if (roll < 0.1) {
                // Атака соседа
                const targets = names.filter(n => n !== name && (c.relations[n] || 0) < -10);
                if (targets.length > 0) {
                    const target = targets[Math.floor(Math.random() * targets.length)];
                    resolveBattle(name, target);
                }
            } else if (roll < 0.2) {
                // Улучшение отношений с игроком (если плохие)
                if (game.playerCountry && (c.relations[game.playerCountry] || 0) < 0) {
                    c.relations[game.playerCountry] = Math.min(50, (c.relations[game.playerCountry] || 0) + 5);
                }
            } else if (roll < 0.3) {
                // Тренировка
                if (c.gold > 30) {
                    c.gold -= 20;
                    c.army += 4 + Math.floor(Math.random() * 4);
                }
            }
        });
    }

    // ---- ПРОВЕРКА ПОБЕДЫ ----
    function checkGameOver() {
        if (!game.playerCountry) return;
        const p = game.countries[game.playerCountry];
        if (p.army > 500) {
            addLog('🏆 ТЫ ДОСТИГ МОГУЩЕСТВА! Игра продолжается...', 'win');
        }
    }

    // ---- СМЕНА ГОДА ----
    function setYear(year) {
        game.year = year;
        document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.year-btn[data-year="${year}"]`).classList.add('active');
        initGame();
    }

    // ---- ПЕРЕЗАПУСК ----
    function resetGame() {
        if (confirm('Перезапустить игру? Весь прогресс будет потерян.')) {
            initGame();
        }
    }

    // ---- ЛОГ ----
    function addLog(msg, cls = '') {
        const log = document.getElementById('log');
        log.innerHTML += `<div class="${cls}">${msg}</div>`;
        log.scrollTop = log.scrollHeight;
        if (log.children.length > 30) log.removeChild(log.firstChild);
    }

    // ---- АВТО-ХОД (каждые 15 секунд) ----
    setInterval(() => {
        if (game.playerCountry) nextTurn();
    }, 15000);

    // ---- СТАРТ ----
    initGame();
</script>
</body>
</html>
